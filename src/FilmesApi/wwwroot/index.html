<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmes</title>
<script>
/* ES5 puro, roda ANTES do resto. Navegador de TV antiga não roda esta página (é toda
   ES6+) — quem abre o servidor numa TV velha quer o receptor, manda pra /tv.html. */
(function () {
  var temAsync = false;
  try { new Function('(async function(){})'); temAsync = true; } catch (e) {}
  if (!window.fetch || !window.Promise || !temAsync) {
    location.replace('/tv.html');
  }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/base.css">
<style>
/* Reset, header, .filter-btn, #grid, .row/.grupo-hd e as cores em variável (--accent etc.)
   vêm de css/base.css (compartilhado com controle.html). Aqui só o que é específico
   desta tela. */
.actions{display:flex;gap:8px}
button{background:#222;color:#eee;border:1px solid var(--border);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#333}
.filters{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a1a1a}
.filter-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-left:12px}
.filter-label:first-child{margin-left:0}
.filter-sep{width:1px;align-self:stretch;background:#222;margin:2px 4px}
main{padding:16px 24px;max-width:1000px;margin:0 auto}
.lista{display:flex;flex-direction:column}
.row{cursor:pointer}
.row:hover{background:var(--bg-3)}
.rposter{width:28px;height:40px;flex-shrink:0;border-radius:3px;background:#1a1a1a;object-fit:cover}
.row .rep{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:8px}
.row .resume{font-size:12px;color:var(--accent);white-space:nowrap}
.row .badge:hover{border-color:#666;color:#ccc}
.grupo{margin-bottom:2px}
.grupo-hd:hover{background:var(--bg-3)}
.grupo-body{padding-left:22px}
.player-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center}
.player-overlay.active{display:flex}
.player-overlay video{max-width:100vw;max-height:100vh;width:auto;height:auto}
.player-close{position:absolute;top:16px;right:24px;font-size:28px;color:#fff;cursor:pointer;z-index:101}
.converting{display:none;color:#ccc;font-size:14px;margin-top:16px;white-space:pre-line;text-align:center;max-width:80vw}
.converting button{margin-top:14px;display:inline-block}
#proximoBox{display:none;position:absolute;right:24px;bottom:80px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:14px 16px;max-width:320px;z-index:102}
#proximoBox.on{display:block}
#proximoBox .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
#proximoBox .tit{font-size:14px;margin:4px 0 10px;color:#fff}
#proximoBox button{margin-right:8px}
#proximoBox .go{background:var(--accent);border-color:var(--accent);color:#fff}
#loadbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:200;opacity:0;transition:width .3s ease}
#loadbar.on{opacity:1;width:75%}
#loadbar.done{opacity:0;width:100%;transition:width .2s ease,opacity .4s ease .2s}
.secao{margin-bottom:26px}
.secao-title .count{color:#555;font-weight:400}
.empty{text-align:center;color:#777;padding:70px 20px;font-size:16px}
.empty .ico{font-size:52px;display:block;margin-bottom:12px;opacity:.6}
.empty button{margin-top:16px}
.search{background:#1a1a1a;border:1px solid var(--border);color:#eee;padding:7px 12px;border-radius:20px;font-size:13px;width:200px;transition:width .2s,border-color .2s}
.search:focus{outline:none;border-color:var(--accent);width:260px}
.header-links{display:flex;gap:14px;align-items:center;font-size:13px}
.header-links a{color:var(--muted);text-decoration:none}
.header-links a:hover{color:#fff}
.scan-msg{position:fixed;bottom:20px;right:20px;background:var(--ok);color:#000;padding:10px 16px;border-radius:6px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="loadbar"></div>
<header>
  <h1>🎬 Filmes</h1>
  <div class="actions">
    <input class="search" id="busca" type="search" placeholder="Buscar…  ( / )" oninput="render()">
    <button onclick="scanMedia()">📂 Scan Mídia</button>
    <span class="header-links">
      <a href="/status.html" title="Status do servidor">📊</a>
      <a href="/swagger" title="API">‹/›</a>
    </span>
  </div>
</header>

<div class="filters" id="filters">
  <span class="filter-label">Tipo</span>
  <button class="filter-btn active" data-grupo="tipo" data-filter="all">Todos</button>
  <button class="filter-btn" data-grupo="tipo" data-filter="filme">🎬 Filmes</button>
  <button class="filter-btn" data-grupo="tipo" data-filter="serie">📺 Séries</button>
  <span class="filter-sep"></span>
  <span class="filter-label">Status</span>
  <button class="filter-btn active" data-grupo="visto" data-filter="all">Todos</button>
  <button class="filter-btn" data-grupo="visto" data-filter="assistido">Assistidos</button>
  <button class="filter-btn" data-grupo="visto" data-filter="nao-assistido">Não assistidos</button>
</div>

<main>
  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div class="player-overlay" id="player">
  <span class="player-close" onclick="closePlayer()">✕</span>
  <video id="video" controls autoplay></video>
  <div class="converting" id="converting"></div>
  <div id="proximoBox">
    <div class="lbl">Próximo episódio <span id="proximoSeg"></span></div>
    <div class="tit" id="proximoTit"></div>
    <button class="go" onclick="irProximo()">▶ Assistir agora</button>
    <button onclick="cancelarProximo()">Cancelar</button>
  </div>
</div>

<div class="scan-msg" id="scanMsg"></div>

<script src="/vendor/hls.min.js"></script>
<script src="/js/util.js"></script>

<script>
const API = '/api/filmes';
let filtroTipo = 'all';   // all | filme | serie
let filtroVisto = 'all';  // all | assistido | nao-assistido
const foldersAbertos = new Set();  // pastas/séries expandidas — sobrevive ao re-render

// Elementos consultados em 2+ lugares (funções diferentes) — pegos uma vez só. Os que só
// aparecem 1x no código (grid, empty, loadbar, etc.) ficam com getElementById direto ali mesmo.
const els = {
  video: document.getElementById('video'),
  converting: document.getElementById('converting'),
  player: document.getElementById('player'),
  busca: document.getElementById('busca'),
  proximoBox: document.getElementById('proximoBox'),
};

// GET que nunca lança: erro de rede ou resposta não-2xx viram null (chamador decide o fallback).
async function fetchJsonOuNull(url) {
  return fetch(url).then(r => r.ok ? r.json() : null).catch(() => null);
}

// ─── Configuração (valores antes soltos pelo código, alguns repetidos em mais de um
// lugar com o mesmo literal significando coisas diferentes — ex.: dois "1500" e três "12") ──
const RETOMAR_MIN_SEGUNDOS = 5;      // abaixo disso não vale a pena retomar do meio
const RETOMAR_MARGEM_FIM_S = 5;      // dentro desses últimos segundos do fim, considera "já terminou" (não retoma)
const RETOMAR_TOLERANCIA_S = 1.5;    // diferença aceitável entre currentTime e a retomada aplicada
const MAX_RETOMAR_TENTATIVAS = 4;    // desiste de tentar re-aplicar o seek de retomada
const MAX_HLS_RETRIES = 3;           // reconexões automáticas em erro de rede do hls.js
const HLS_RETRY_DELAY_MS = 1500;     // espera antes de cada reconexão do hls.js
const POLL_PREPARANDO_MS = 1500;     // intervalo de poll enquanto o vídeo ainda está "preparando"
const MAX_FALHAS_POLL = 12;          // falhas de rede seguidas no poll até desistir com "erro"
const WATCHDOG_STALL_MS = 15000;     // tempo parado no live-edge do HLS até considerar travado
const WATCHDOG_POLL_MS = 5000;       // intervalo do watchdog de live-edge
const DICA_4K_S = 12;                // segundos preparando até mostrar a dica de "arquivo 4K"
const PROXIMO_COUNTDOWN_S = 12;      // contagem regressiva antes de tocar o próximo episódio sozinho
const AUTOSAVE_THROTTLE_MS = 10000;  // intervalo mínimo entre saves automáticos de progresso
const KEEPALIVE_MS = 20000;          // intervalo do aviso "ainda tem alguém aqui" pro transcode
const PLAYER_CONTROLS_HEIGHT_PX = 64; // altura estimada da barra de controle nativa do <video>
const SCAN_MSG_DURATION_MS = 3000;   // quanto tempo o toast "N importados" fica visível
const LOADBAR_RESET_MS = 600;        // espera a transição de "done" terminar antes de zerar a barra

function loadbar(ligado) {
  const b = document.getElementById('loadbar');
  if (ligado) { b.className = 'on'; }
  else { b.className = 'done'; setTimeout(() => { b.className = ''; }, LOADBAR_RESET_MS); }
}

async function load() {
  loadbar(true);
  try { await render(); }
  finally { loadbar(false); }
}

// Filtro (tipo/visto/busca) e agrupamento (filme solto / pasta filme+extras / série com
// episódios) vêm prontos de /api/filmes/tela — esta tela só desenha o que chega, sem
// nenhuma lógica própria de agrupar (era assim que o mesmo bug precisava ser corrigido
// em 3 lugares diferentes: index.html, controle.html e tv.html).
async function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const scrollAntes = window.scrollY;  // não pular pro topo ao re-renderizar

  const mostrarVazio = html => { grid.innerHTML = ''; empty.innerHTML = html; empty.style.display = 'block'; };

  const q = els.busca.value.trim();
  const params = new URLSearchParams({ tipo: filtroTipo, visto: filtroVisto });
  if (q) params.set('busca', q);
  const t = await fetchJsonOuNull(`${API}/tela?${params}`);

  if (!t) {
    mostrarVazio('<span class="ico">🔍</span>Não consegui falar com o servidor.');
    return;
  }

  const nada = !t.continuarAssistindo.length && !t.filmesSoltos.length && !t.pastasFilme.length && !t.series.length;
  if (nada) {
    mostrarVazio(t.catalogoVazio
      ? `<span class="ico">🎬</span>Catálogo vazio.<br><button onclick="scanMedia()">📂 Escanear a pasta de mídia</button>`
      : `<span class="ico">🔍</span>${q ? 'Nada encontrado pra “' + esc(q) + '”.' : 'Nada corresponde a esse filtro.'}`);
    return;
  }
  empty.style.display = 'none';

  const grupo = (key, tituloHtml, rows) => {
    const aberto = foldersAbertos.has(key);
    return `
      <div class="grupo ${aberto ? '' : 'collapsed'}" data-key="${attr(key)}">
        <div class="grupo-hd" onclick="toggleGrupo(this, foldersAbertos)"><span class="caret">${aberto ? '▾' : '▸'}</span>${tituloHtml}</div>
        <div class="grupo-body">${rows}</div>
      </div>`;
  };

  let html = '';
  if (t.continuarAssistindo.length) {
    html += `
    <div class="secao">
      <div class="secao-title">▶ Continuar assistindo <span class="count">(${t.continuarAssistindo.length})</span></div>
      <div class="lista">${t.continuarAssistindo.map(continuarRowHtml).join('')}</div>
    </div>`;
  }

  const totalFilmes = t.filmesSoltos.length + t.pastasFilme.reduce((s, p) => s + p.itens.length, 0);
  if (totalFilmes) {
    html += `<div class="secao"><div class="secao-title">🎬 Filmes <span class="count">(${totalFilmes})</span></div><div class="lista">`;
    html += t.filmesSoltos.map(f => rowHtml(f)).join('');
    html += t.pastasFilme.map(p =>
      grupo('f:' + p.pasta, `📁 ${esc(p.pasta)} <span class="count">(${p.itens.length} arquivos)</span>`,
        p.itens.map(f => rowHtml(f)).join(''))
    ).join('');
    html += `</div></div>`;
  }

  if (t.series.length) {
    html += `<div class="secao"><div class="secao-title">📺 Séries <span class="count">(${t.series.length})</span></div><div class="lista">`;
    html += t.series.map(s => {
      const poster = s.episodios.find(f => f.posterUrl);   // um pôster já basta pra série inteira
      const tituloHtml = `${poster ? posterHtml(poster) : ''}${esc(s.nome)} <span class="count">(${s.episodios.length} ${s.episodios.length === 1 ? 'episódio' : 'episódios'})</span>`;
      return grupo('s:' + s.chave, tituloHtml, s.episodios.map(f => rowHtml(f, true)).join(''));
    }).join('');
    html += `</div></div>`;
  }
  grid.innerHTML = html;
  window.scrollTo(0, scrollAntes);
}

// toggleGrupo(el, folderSet) vem de /js/util.js.

function pctProgresso(item) {
  if (!item.posicaoSegundos || !item.duracaoSegundos) return 0;
  return Math.min(100, Math.round(100 * item.posicaoSegundos / item.duracaoSegundos));
}

function barraProgresso(item) {
  const pct = pctProgresso(item);
  return pct ? `<div class="rprog"><div style="width:${pct}%"></div></div>` : '';
}

// formatarTempo() vem de /js/util.js.

const pad2 = n => String(n).padStart(2, '0');

// "S01E02" quando dá pra saber temporada/episódio; null senão (chamador decide o fallback).
function codigoEpisodio(f) {
  return f.temporada != null ? `S${pad2(f.temporada)}E${pad2(f.episodio)}` : null;
}

// nome "limpo" do episódio: tira SxxExx embutido, o "8 - "/"8   " do começo e,
// se sobrar só o nome da série (nome de arquivo genérico), não repete.
function tituloEpisodio(f) {
  let s = String(f.titulo || '')
    .replace(/\bS\d{1,2}\s*E\d{1,3}\b/ig, ' ')
    .replace(/^\s*\d{1,3}[\s.\-–—):\]]+/, '')
    .replace(/\s+/g, ' ').trim();
  if (f.serie && s.toLowerCase() === f.serie.toLowerCase()) s = '';
  return s;
}

// Miniatura do pôster (TMDB) quando tem; senão um retângulo vazio, só pra manter as
// linhas alinhadas na lista. "loading=lazy" evita baixar tudo de uma vez em catálogo grande.
function posterHtml(f) {
  return f.posterUrl
    ? `<img class="rposter" src="${attr(f.posterUrl)}" loading="lazy" alt="">`
    : `<span class="rposter"></span>`;
}

// Tooltip: título original (quando diverge do exibido) + sinopse — TMDB às vezes traduz
// tão livremente que vale mostrar o nome original ao passar o mouse.
function tooltipFilme(f) {
  const original = f.tituloOriginal && f.tituloOriginal !== f.titulo ? f.tituloOriginal + '\n' : '';
  return attr(original + (f.sinopse || f.titulo));
}

function rowHtml(f, episodio) {
  const retomar = f.posicaoSegundos ? `<span class="resume">▶ ${formatarTempo(f.posicaoSegundos)}</span>` : '';
  let titulo;
  if (episodio) {
    const cod = codigoEpisodio(f) || (f.rotulo || '');
    const nome = tituloEpisodio(f);
    titulo = (cod || nome)
      ? `${cod ? `<span class="rep">${esc(cod)}</span>` : ''}${esc(nome)}`
      : esc(f.titulo);
  } else {
    titulo = esc(f.titulo);
  }
  return `
    <div class="row ${f.assistido ? 'assistido' : ''}" onclick="play(${f.id})" title="${tooltipFilme(f)}">
      ${episodio ? '' : posterHtml(f)}
      <span class="rtit">${titulo}</span>
      ${!episodio && f.anoLancamento ? `<span class="rano">${f.anoLancamento}</span>` : ''}
      ${retomar}
      <span class="badge ${f.assistido ? 'on' : ''}" onclick="event.stopPropagation(); toggleAssistido(${f.id})">${f.assistido ? '✓ Assistido' : 'Marcar'}</span>
      ${barraProgresso(f)}
    </div>`;
}

// c já vem completo (FilmeResponse) de /api/filmes/tela — sem precisar procurar em nada.
function continuarRowHtml(c) {
  const info = c.duracaoSegundos
    ? `${pctProgresso(c)}% · faltam ${formatarTempo(c.duracaoSegundos - c.posicaoSegundos)}`
    : `${formatarTempo(c.posicaoSegundos)} assistidos`;
  const nome = c.ehEpisodio
    ? `<span class="rep">${c.serie} · ${codigoEpisodio(c)}</span>${esc(tituloEpisodio(c))}`
    : esc(c.titulo);
  return `
    <div class="row" onclick="play(${c.id})" title="${tooltipFilme(c)}">
      ${posterHtml(c)}
      <span class="rtit">${nome}</span>
      <span class="resume">▶ ${info}</span>
      ${barraProgresso(c)}
    </div>`;
}

async function toggleAssistido(id) {
  await fetch(`${API}/${id}/assistido`, { method: 'PUT' });
  render();  // re-busca já refletindo a mudança — sem cache local pra remendar
}

let hls = null;

function destruirHls() {
  if (hls) { hls.destroy(); hls = null; }
}

// ─── Watchdog do "live edge" ────────────────────────────────────────────
// A playlist HLS cresce sem #EXT-X-ENDLIST enquanto o servidor ainda converte. Se a
// reprodução alcança o fim do que já foi gerado (assiste mais rápido que o encode, ou o
// job travou/morreu no meio), o <video> só fica "bufferizando" pra sempre — sem nenhum
// aviso, indistinguível de travado de verdade. Esse watchdog detecta currentTime parado
// tocando e consulta /stream-status pra decidir: ainda convertendo (avisa e segue
// esperando), falhou de vez (mostra erro em vez de spinner eterno), ou já terminou e o
// hls.js só não recarregou a playlist ainda (força reload — ele nota o ENDLIST e conclui).
let watchdogLiveEdge = null;
let vigiaPos = -1;
let vigiaDesde = 0;

function pararWatchdogLiveEdge() {
  if (watchdogLiveEdge) { clearInterval(watchdogLiveEdge); watchdogLiveEdge = null; }
  vigiaPos = -1;
  vigiaDesde = 0;
}

function iniciarWatchdogLiveEdge(id) {
  pararWatchdogLiveEdge();
  watchdogLiveEdge = setInterval(async () => {
    const video = els.video;
    if (filmeAtual !== id || video.paused || video.ended || reproducaoConcluida) {
      vigiaPos = -1; vigiaDesde = 0;
      return;
    }
    if (video.currentTime !== vigiaPos) {
      vigiaPos = video.currentTime;
      vigiaDesde = Date.now();
      const converting = els.converting;
      if (converting.dataset.liveEdge) { converting.style.display = 'none'; delete converting.dataset.liveEdge; }
      return;
    }
    if (!vigiaDesde) vigiaDesde = Date.now();
    if (Date.now() - vigiaDesde < WATCHDOG_STALL_MS) return;  // parado há pouco: buffer normal, não é o live-edge

    const status = await checarStatus(id);
    if (filmeAtual !== id) return;
    const converting = els.converting;
    if (status === 'erro') {
      converting.innerHTML = 'A conversão falhou no meio do vídeo. <button onclick="play(filmeAtual)">Tentar de novo</button>';
      converting.style.display = 'block';
      converting.dataset.liveEdge = '1';
      pararWatchdogLiveEdge();
    } else if (status === 'preparando') {
      converting.textContent = 'Ainda convertendo — a reprodução alcançou o que já foi processado. Aguarde…';
      converting.style.display = 'block';
      converting.dataset.liveEdge = '1';
      vigiaDesde = Date.now();  // não repete o /stream-status a cada 5s enquanto ainda prepara
    } else if (status === 'disponivel' && hls) {
      // Terminou (ganhou #EXT-X-ENDLIST) mas o hls.js ainda não recarregou a playlist pra
      // perceber — forçar o reload costuma bastar pra ele notar o fim e disparar 'ended'.
      hls.loadSource(`${API}/${id}/hls/playlist.m3u8`);
      vigiaDesde = Date.now();
    }
  }, WATCHDOG_POLL_MS);
}

let hlsRetries = 0;
function iniciarHls(video, url, inicio) {
  destruirHls();
  const t = inicio > 5 ? Math.floor(inicio) : 0;
  const idAlvo = filmeAtual;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls(t ? { startPosition: t } : {});  // começa já na retomada, sem pulo
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      // erro fatal de rede: normalmente o transcode reiniciou e um segmento sumiu.
      // Reabre o filme (retoma perto de onde estava) em vez de deixar o player travado.
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && filmeAtual === idAlvo && hlsRetries++ < MAX_HLS_RETRIES) {
        setTimeout(() => { if (filmeAtual === idAlvo) play(idAlvo, true); }, HLS_RETRY_DELAY_MS);
      } else {
        destruirHls();
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = t ? `${url}#t=${t}` : url;
    video.play();
  } else {
    console.error('Navegador sem suporte a HLS.');
  }
}

async function play(id, ehRetry) {
  const video = els.video;
  const converting = els.converting;
  cancelarProximo();
  removerLegendas();
  video.removeAttribute('src');
  destruirHls();
  pararWatchdogLiveEdge();
  converting.style.display = 'none';
  els.player.classList.add('active');

  filmeAtual = id;
  ultimoSalvo = 0;
  posicaoParaRetomar = 0;
  retomarTentativas = 0;
  checarFalhas = 0;
  if (!ehRetry) hlsRetries = 0;  // retry preserva o contador, senão o teto de 3 nunca conta
  duracaoConfiavel = false;
  reproducaoConcluida = false;
  const prog = await fetchJsonOuNull(`${API}/${id}/progresso`);
  if (prog && prog.posicaoSegundos) posicaoParaRetomar = prog.posicaoSegundos;

  const inicioPrep = Date.now();
  converting.style.display = 'block';
  const prepTimer = setInterval(() => {
    const s = Math.round((Date.now() - inicioPrep) / 1000);
    const dica = s > DICA_4K_S ? '\nArquivos 4K levam 1-2 min na primeira vez — depois fica em cache.' : '';
    converting.innerHTML = `Preparando vídeo… ${s}s${esc(dica)}<br><button onclick="closePlayer()">Cancelar</button>`;
  }, 1000);
  converting.innerHTML = 'Preparando vídeo…<br><button onclick="closePlayer()">Cancelar</button>';

  let status;
  try {
    status = await checarStatus(id);
    while (status === 'preparando') {
      await new Promise(r => setTimeout(r, POLL_PREPARANDO_MS));
      if (filmeAtual !== id) return;  // fechou/trocou de filme durante a espera
      status = await checarStatus(id);
    }
  } finally {
    clearInterval(prepTimer);
  }
  converting.style.display = 'none';

  if (status === 'erro') {
    converting.textContent = 'Falha ao preparar o vídeo. Tente de novo.';
    converting.style.display = 'block';
    return;
  }

  if (status === 'compativel') {
    duracaoConfiavel = true;
    const frag = posicaoParaRetomar > RETOMAR_MIN_SEGUNDOS ? `#t=${Math.floor(posicaoParaRetomar)}` : '';
    video.src = `${API}/${id}/stream${frag}`;  // fragmento = começa na retomada, sem pulo
    video.play();
  } else {
    iniciarHls(video, `${API}/${id}/hls/playlist.m3u8`, posicaoParaRetomar);
    iniciarWatchdogLiveEdge(id);
  }
  carregarLegendas(id);
  // "assistido" agora é decidido pelo backend quando a reprodução chega perto do fim
  // (só no stream direto, onde a duração é confiável), ou manualmente no badge —
  // não mais ao simplesmente abrir.
}

// nunca lança: erro de rede transitório vira 'preparando' (segue tentando);
// depois de muitas falhas seguidas, desiste com 'erro'.
let checarFalhas = 0;
async function checarStatus(id) {
  try {
    const res = await fetch(`${API}/${id}/stream-status`);
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    checarFalhas = 0;
    return data.status;
  } catch {
    return (++checarFalhas > MAX_FALHAS_POLL) ? 'erro' : 'preparando';
  }
}

// ─── Legendas embutidas ───────────────────────────────────────────────
// Cada faixa de texto vira um <track> apontando pro endpoint .vtt; o menu "CC"
// nativo do <video controls> cuida da troca. Funciona no stream direto e no HLS.
const LANG_BCP = { por: 'pt', pob: 'pt', pt: 'pt', eng: 'en', spa: 'es', fre: 'fr', fra: 'fr', ger: 'de', deu: 'de', ita: 'it', jpn: 'ja' };

function removerLegendas() {
  document.querySelectorAll('#video track').forEach(t => t.remove());
}

async function carregarLegendas(id) {
  let faixas;
  try { faixas = await fetch(`${API}/${id}/legendas`).then(r => r.ok ? r.json() : []); }
  catch { return; }
  if (filmeAtual !== id) return;  // trocou de filme enquanto buscava

  const video = els.video;
  removerLegendas();
  faixas.filter(x => x.convertivel).forEach(x => {
    const tr = document.createElement('track');
    tr.kind = 'subtitles';
    tr.src = `${API}/${id}/legenda/${x.idx}`;
    tr.srclang = LANG_BCP[(x.idioma || '').toLowerCase()] || x.idioma || 'und';
    tr.label = x.titulo || x.idioma || `Legenda ${x.idx + 1}`;
    if (x.forced && (x.idioma === 'por' || x.idioma === 'pob')) tr.default = true;
    video.appendChild(tr);
  });
}

// ─── Próximo episódio ─────────────────────────────────────────────────
let proximoInfo = null, proximoInterval = null, proximoOfertaId = 0;

function cancelarProximo() {
  if (proximoInterval) { clearInterval(proximoInterval); proximoInterval = null; }
  proximoInfo = null;
  proximoOfertaId++;  // invalida qualquer resposta de /proximo ainda em voo (ver ofereceProximo)
  els.proximoBox.classList.remove('on');
}

async function ofereceProximo(id) {
  // 'ended' pode disparar 2x em alguns navegadores. cancelarProximo() sozinho não basta: se
  // as 2 chamadas acontecem síncronas (uma logo após a outra, antes do fetch da 1ª
  // responder), as 2 leem o estado ainda limpo e nenhuma cancela nada — cada resposta monta
  // seu PRÓPRIO setInterval e só o mais recente fica em proximoInterval; o outro roda órfão
  // e chama irProximo() de novo pouco depois, reiniciando o episódio que acabou de começar.
  // O token (proximoOfertaId) resolve isso não importa o intervalo entre as 2 chamadas: só a
  // resposta da ÚLTIMA ofereceProximo (que "ganhou" o token por último) monta o timer.
  cancelarProximo();
  const meuToken = ++proximoOfertaId;
  let prox;
  try {
    const r = await fetch(`${API}/${id}/proximo`);
    if (r.status !== 200) return;
    prox = await r.json();
  } catch { return; }
  if (filmeAtual !== id || !prox || meuToken !== proximoOfertaId) return;

  proximoInfo = prox;
  document.getElementById('proximoTit').textContent = prox.rotulo + (prox.serie ? ' — ' + prox.serie : '');
  els.proximoBox.classList.add('on');

  let resta = PROXIMO_COUNTDOWN_S;
  const tick = () => {
    document.getElementById('proximoSeg').textContent = `em ${resta}s`;
    if (resta-- <= 0) irProximo();
  };
  tick();
  proximoInterval = setInterval(tick, 1000);
}

function irProximo() {
  const prox = proximoInfo;
  cancelarProximo();
  if (prox) play(prox.id);
}

async function closePlayer() {
  const id = filmeAtual;
  cancelarProximo();
  await salvarProgresso();  // grava ANTES de rebuscar, senão a lista volta desatualizada
  const video = els.video;
  removerLegendas();
  destruirHls();
  pararWatchdogLiveEdge();
  video.pause();
  video.src = '';
  filmeAtual = null;
  els.player.classList.remove('active');
  els.converting.style.display = 'none';
  await atualizarAposReproducao(id);
}

// render() já busca /tela de novo — reflete a posição/progresso salvo sem precisar
// remendar nada em cache local.
async function atualizarAposReproducao(id) {
  render();
}

// ─── Continuar de onde parou ────────────────────────────────────────────
let filmeAtual = null;
let ultimoSalvo = 0;
let posicaoParaRetomar = 0;
let retomarTentativas = 0;
// video.duration só é confiável no stream direto; no HLS ele cresce enquanto
// transcodifica, então nem mandamos pro backend nem usamos pra decidir o "fim".
let duracaoConfiavel = false;
// depois do 'ended' o /concluir já limpou a retomada — impede um save tardio de recriá-la.
let reproducaoConcluida = false;

// Aplicar a retomada só no 'loadedmetadata' não cola: o Chromium volta o
// currentTime pra 0 logo depois. 'loadeddata'/'canplay'/'seeked' já pegam, e
// re-tentamos algumas vezes caso o primeiro seek seja revertido.
function aplicarRetomada() {
  const video = els.video;
  if (!(posicaoParaRetomar > RETOMAR_MIN_SEGUNDOS)) return;
  const dur = video.duration;
  if (duracaoConfiavel && isFinite(dur) && posicaoParaRetomar >= dur - RETOMAR_MARGEM_FIM_S) { posicaoParaRetomar = 0; return; }
  if (Math.abs(video.currentTime - posicaoParaRetomar) <= RETOMAR_TOLERANCIA_S) { posicaoParaRetomar = 0; return; }
  if (retomarTentativas++ > MAX_RETOMAR_TENTATIVAS) { posicaoParaRetomar = 0; return; }
  try { video.currentTime = posicaoParaRetomar; } catch { /* ainda não seekável */ }
}

function configurarProgresso() {
  const video = els.video;

  video.addEventListener('loadeddata', aplicarRetomada);
  video.addEventListener('canplay', aplicarRetomada);
  video.addEventListener('seeked', aplicarRetomada);

  // Clicar em qualquer lugar do player pausa/despausa: na imagem (fora da faixa
  // de baixo, que é a barra de controle nativa) ou nas bordas pretas em volta.
  const alternarPausa = () => { if (video.paused) video.play().catch(() => {}); else video.pause(); };
  video.addEventListener('click', e => {
    const r = video.getBoundingClientRect();
    // ignora a faixa de baixo (barra de controle nativa, ~48-64px)
    if (r.height > 0 && e.clientY > r.bottom - PLAYER_CONTROLS_HEIGHT_PX) return;
    alternarPausa();
  });
  els.player.addEventListener('click', e => {
    if (e.target.id === 'player') alternarPausa();  // bordas pretas em volta do vídeo
  });

  video.addEventListener('timeupdate', () => {
    if (filmeAtual == null || video.paused) return;
    const agora = Date.now();
    if (agora - ultimoSalvo < AUTOSAVE_THROTTLE_MS) return;
    ultimoSalvo = agora;
    salvarProgresso();
  });

  video.addEventListener('pause', () => salvarProgresso());
  window.addEventListener('pagehide', () => salvarProgresso());
  video.addEventListener('ended', () => {
    // fim da reprodução: marca assistido + limpa a retomada (funciona também no
    // HLS, onde a regra de "perto do fim" do backend não roda).
    if (filmeAtual == null) return;
    reproducaoConcluida = true;
    const id = filmeAtual;
    fetch(`${API}/${id}/concluir`, { method: 'POST', keepalive: true }).catch(() => {});
    ofereceProximo(id);
  });

  // Keepalive: avisa o backend que ainda tem alguém aqui, senão o transcode em
  // andamento é abortado por inatividade (HlsOrphanTimeoutSeconds).
  setInterval(() => {
    if (filmeAtual != null) fetch(`${API}/${filmeAtual}/assistindo`, { method: 'POST' }).catch(() => {});
  }, KEEPALIVE_MS);
}

function salvarProgresso() {
  const video = els.video;
  if (filmeAtual == null || reproducaoConcluida || !(video.currentTime > 15)) return Promise.resolve();
  return fetch(`${API}/${filmeAtual}/progresso`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      posicao: video.currentTime,
      duracao: duracaoConfiavel && isFinite(video.duration) && video.duration > 0 ? video.duration : null
    }),
    keepalive: true
  }).catch(() => {});
}

async function scanMedia() {
  const btn = document.querySelector('.actions button');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Escaneando…'; }
  try {
    const res = await fetch(`${API}/scan`, { method: 'POST' });
    const data = await res.json();
    const msg = document.getElementById('scanMsg');
    const partes = [`${data.importados} importado(s)`];
    if (data.removidos) partes.push(`${data.removidos} removido(s)`);
    if (data.titulosLimpos) partes.push(`${data.titulosLimpos} título(s) limpo(s)`);
    msg.textContent = partes.join(' · ');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', SCAN_MSG_DURATION_MS);
    await load();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📂 Scan Mídia'; }
  }
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const grupo = btn.dataset.grupo;
  document.querySelectorAll(`.filter-btn[data-grupo="${grupo}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (grupo === 'tipo') filtroTipo = btn.dataset.filter;
  else filtroVisto = btn.dataset.filter;
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); els.busca.blur(); }
  // "/" foca a busca (a não ser que já esteja digitando em algum campo)
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    els.busca.focus();
  }
});
configurarProgresso();
load();
</script>
</body>
