<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Filmes</title>
<script>
/* ES5 puro, roda ANTES do resto. Navegador de TV antiga não roda esta página (é toda
   ES6+) — quem abre o servidor numa TV velha quer o receptor, manda pra /tv.html. */
(function () {
  var temAsync = false;
  try { new Function('(async function(){})'); temAsync = true; } catch (e) {}
  if (!window.fetch || !window.Promise || !temAsync) {
    location.replace('/tv.html');
  }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div id="loadbar"></div>
<header>
  <h1>🎬 Filmes</h1>
  <div class="actions">
    <button onclick="abrirControleTv()" aria-label="Controle da TV" title="Controle da TV"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M16 3l-4 4l-4-4"/></svg></button>
    <button onclick="scanMedia()" aria-label="Escanear a pasta de mídia" title="Escanear a pasta de mídia">📂 Scan</button>
    <button onclick="abrirConfig()" aria-label="Configurações" title="Configurações">⚙</button>
  </div>
</header>

<main>
  <div class="busca-wrap" id="buscaWrap"><input id="busca" type="search" placeholder="Buscar filme, série ou novela…" autocomplete="off" oninput="buscarDigitando()"></div>
  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div id="agora"></div>

<nav id="abas" aria-label="Seções">
  <button data-aba="inicio" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Início</button>
  <button data-aba="serie"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M9 3l3 3 3-3"/></svg>Séries</button>
  <button data-aba="filme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Filmes</button>
  <button data-aba="novela"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9v7a4.5 4.5 0 0 1-9 0z"/><path d="M11 12h9v1a4.5 4.5 0 0 1-8 2.8"/><path d="M6.5 9h1M10 9h1M6.5 13c1 1 2.5 1 3.5 0"/></svg>Novelas</button>
  <button data-aba="buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Buscar</button>
</nav>

<div id="tvSheet" aria-hidden="true"><iframe id="tvFrame" title="Controle da TV"></iframe></div>

<div id="sheet" onclick="if (event.target === this) fecharFicha()"><div class="sheet-box" id="sheetBox"></div></div>

<div class="player-overlay" id="player">
  <button class="btn-tv" onclick="continuarNaTv()">📺 Continuar na TV</button>
  <button class="player-close" onclick="closePlayer()" aria-label="Fechar o player">✕</button>
  <video id="video" controls autoplay playsinline></video>
  <div class="converting" id="converting" role="status" aria-live="polite"></div>
  <div id="sobreVideo">
    <div id="trilhoLocal"><i id="trilhoAbertura"></i><i id="trilhoCreditos"></i></div>
    <!-- UM overlay de ação por vez, na parte de baixo, acima da barra do player (prioridade: próximo automático > aviso > botão) -->
    <div id="acaoLocal" data-vez="">
      <div id="avisoLocal" role="status"></div>
      <button id="ctaLocal" class="cta neutro" onclick="acaoDoBotaoLocal()"></button>
      <div id="proximoBox">
        <div class="lbl">Próximo episódio <span id="proximoSeg"></span></div>
        <div class="tit" id="proximoTit"></div>
        <div class="prox-acoes">
          <button class="go" onclick="irProximo()">▶ Assistir agora</button>
          <button onclick="cancelarProximoPeloUsuario()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="scan-msg" id="scanMsg"></div>

<script src="/vendor/hls.min.js"></script>
<script src="/js/util.js"></script>

<script src="/js/player-regras.js"></script>
<script src="/js/player-local.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
