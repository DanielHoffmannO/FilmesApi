<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;min-height:100vh}
header{background:#111;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
h1{font-size:20px;font-weight:600}
.actions{display:flex;gap:8px}
button{background:#222;color:#eee;border:1px solid #333;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#333}
.filters{padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #1a1a1a}
.filter-btn{background:none;border:1px solid #333;color:#888;padding:6px 12px;border-radius:20px;font-size:12px}
.filter-btn.active{border-color:#e50914;color:#fff}
.filter-label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-left:12px}
.filter-label:first-child{margin-left:0}
.filter-sep{width:1px;align-self:stretch;background:#222;margin:2px 4px}
main{padding:24px}
#grid{display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{background:#181818;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card-body{padding:12px}
.progressbar{height:4px;background:#333}
.progressbar-fill{height:100%;background:#e50914}
.card-meta .resume{color:#e50914}
.card-title{font-size:14px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:11px;color:#888;display:flex;gap:8px}
.card-meta .badge{background:#333;color:#888;border:1px solid #444;padding:1px 8px;border-radius:3px;font-size:10px;cursor:pointer;user-select:none}
.card-meta .badge:hover{border-color:#666;color:#ccc}
.card-meta .badge.on{background:#2ecc40;color:#000;border-color:#2ecc40}
.card.assistido .card-body{border-left:3px solid #2ecc40}
.player-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center}
.player-overlay.active{display:flex}
.player-overlay video{max-width:100vw;max-height:100vh;width:auto;height:auto}
.player-close{position:absolute;top:16px;right:24px;font-size:28px;color:#fff;cursor:pointer;z-index:101}
.converting{display:none;color:#ccc;font-size:14px;margin-top:16px}
.secao{margin-bottom:40px}
.secao-title{font-size:19px;font-weight:700;color:#fff;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid #222}
.secao-title .count{font-size:13px;color:#666;font-weight:400}
.folder{margin-bottom:32px}
.folder-title{font-size:16px;font-weight:600;margin-bottom:12px;color:#ccc;display:flex;align-items:center;gap:8px}
.folder-title .count{font-size:12px;color:#666;font-weight:400}
.folder.serie .folder-title{cursor:pointer;user-select:none}
.folder.serie .folder-title .caret{display:inline-block;width:14px;color:#888;font-size:12px}
.folder.collapsed .grid{display:none}
.empty{text-align:center;color:#555;padding:60px 0;font-size:15px}
.scan-msg{position:fixed;bottom:20px;right:20px;background:#2ecc40;color:#000;padding:10px 16px;border-radius:6px;font-size:13px;display:none}
.cast-btn{background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:2px 4px;line-height:1}
.cast-btn:hover{color:#fff}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.remote{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #222;padding:10px 16px;display:none;align-items:center;gap:12px;flex-wrap:wrap;z-index:50}
.remote.active{display:flex}
.remote .titulo{font-size:12px;color:#ccc;flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remote button{padding:8px 12px}
.remote input[type=range]{width:100px}
</style>
</head>
<body>
<header>
  <h1>🎬 Filmes</h1>
  <div class="actions">
    <button onclick="scanMedia()">📂 Scan Mídia</button>
  </div>
</header>

<div class="filters" id="filters">
  <span class="filter-label">Tipo</span>
  <button class="filter-btn active" data-grupo="tipo" data-filter="all">Todos</button>
  <button class="filter-btn" data-grupo="tipo" data-filter="filme">🎬 Filmes</button>
  <button class="filter-btn" data-grupo="tipo" data-filter="serie">📺 Séries</button>
  <span class="filter-sep"></span>
  <span class="filter-label">Status</span>
  <button class="filter-btn active" data-grupo="visto" data-filter="all">Todos</button>
  <button class="filter-btn" data-grupo="visto" data-filter="assistido">Assistidos</button>
  <button class="filter-btn" data-grupo="visto" data-filter="nao-assistido">Não assistidos</button>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Nenhum filme encontrado. Clique em "Scan Mídia" para importar.</div>
</main>

<div class="player-overlay" id="player">
  <span class="player-close" onclick="closePlayer()">✕</span>
  <video id="video" controls autoplay></video>
  <div class="converting" id="converting">Convertendo vídeo para reprodução, aguarde...</div>
</div>

<div class="scan-msg" id="scanMsg"></div>

<script src="/vendor/hls.min.js"></script>

<div class="remote" id="remote">
  <span class="titulo" id="remoteTitulo"></span>
  <button onclick="remoteSeek(-10)">« 10s</button>
  <button onclick="remotePlayPause()" id="remotePlayPauseBtn">⏸</button>
  <button onclick="remoteSeek(10)">10s »</button>
  <input type="range" id="remoteVolume" min="0" max="1" step="0.05" oninput="remoteVolume(this.value)">
  <button onclick="remoteParar()">⏹ Parar</button>
</div>

<script>
const API = '/api/filmes';
let filmes = [];
let continuar = [];
let filtroTipo = 'all';   // all | filme | serie
let filtroVisto = 'all';  // all | assistido | nao-assistido

async function load() {
  const [resF, resC] = await Promise.all([fetch(API), fetch(`${API}/continuar`)]);
  filmes = await resF.json();
  continuar = resC.ok ? await resC.json() : [];
  render();
}

function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  // classificação filme/série vem da lista COMPLETA — filtrar por "não assistido"
  // não pode transformar uma série de 1 episódio pendente num "filme".
  const totalPorPasta = new Map();
  for (const f of filmes) {
    const p = pastaDe(f.arquivoPath);
    totalPorPasta.set(p, (totalPorPasta.get(p) || 0) + 1);
  }
  const ehSeriePasta = p => p !== 'Sem pasta' && totalPorPasta.get(p) > 1;
  const ehSerieFilme = f => ehSeriePasta(pastaDe(f.arquivoPath));

  const filtered = filmes.filter(f => {
    if (filtroVisto === 'assistido' && !f.assistido) return false;
    if (filtroVisto === 'nao-assistido' && f.assistido) return false;
    if (filtroTipo === 'filme' && ehSerieFilme(f)) return false;
    if (filtroTipo === 'serie' && !ehSerieFilme(f)) return false;
    return true;
  });

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.textContent = filmes.length
      ? 'Nada corresponde a esse filtro.'
      : 'Nenhum filme encontrado. Clique em "Scan Mídia" para importar.';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  const grupos = new Map();
  for (const f of filtered) {
    const pasta = pastaDe(f.arquivoPath);
    if (!grupos.has(pasta)) grupos.set(pasta, []);
    grupos.get(pasta).push(f);
  }

  const pastas = [...grupos.keys()].sort((a, b) => a.localeCompare(b, 'pt-BR'));

  const filmesSoltos = [];
  for (const pasta of pastas) if (!ehSeriePasta(pasta)) filmesSoltos.push(...grupos.get(pasta));
  filmesSoltos.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR'));
  const seriesPastas = pastas.filter(ehSeriePasta);

  let html = '';
  if (filtroTipo === 'all' && filtroVisto === 'all' && continuar.length) {
    html += `
    <div class="secao">
      <div class="secao-title">▶ Continuar assistindo <span class="count">(${continuar.length})</span></div>
      <div class="grid">${continuar.map(continuarCardHtml).join('')}</div>
    </div>`;
  }
  if (filmesSoltos.length) {
    html += `
    <div class="secao">
      <div class="secao-title">🎬 Filmes <span class="count">(${filmesSoltos.length})</span></div>
      <div class="grid">${filmesSoltos.map(cardHtml).join('')}</div>
    </div>`;
  }
  if (seriesPastas.length) {
    html += `
    <div class="secao">
      <div class="secao-title">📺 Séries <span class="count">(${seriesPastas.length})</span></div>
      ${seriesPastas.map(pasta => {
        const itens = grupos.get(pasta);
        return `
      <div class="folder serie collapsed">
        <div class="folder-title" onclick="toggleFolder(this)"><span class="caret">▸</span> ${pasta} <span class="count">(${itens.length} ${itens.length === 1 ? 'episódio' : 'episódios'})</span></div>
        <div class="grid">${itens.map(cardHtml).join('')}</div>
      </div>`;
      }).join('')}
    </div>`;
  }
  grid.innerHTML = html;
}

function toggleFolder(el) {
  const folder = el.parentNode;
  folder.classList.toggle('collapsed');
  const caret = el.querySelector('.caret');
  if (caret) caret.textContent = folder.classList.contains('collapsed') ? '▸' : '▾';
}

function pastaDe(arquivoPath) {
  if (!arquivoPath) return 'Sem pasta';
  const partes = arquivoPath.split('/');
  return partes.length > 1 ? partes.slice(0, -1).join('/') : 'Sem pasta';
}

function pctProgresso(item) {
  if (!item.posicaoSegundos || !item.duracaoSegundos) return 0;
  return Math.min(100, Math.round(100 * item.posicaoSegundos / item.duracaoSegundos));
}

function barraProgresso(item) {
  const pct = pctProgresso(item);
  return pct ? `<div class="progressbar"><div class="progressbar-fill" style="width:${pct}%"></div></div>` : '';
}

function formatarTempo(seg) {
  seg = Math.max(0, Math.round(seg || 0));
  const h = Math.floor(seg / 3600), m = Math.round((seg % 3600) / 60);
  return h ? `${h}h ${m}min` : `${m}min`;
}

function cardHtml(f) {
  const retomar = f.posicaoSegundos
    ? `<span class="resume">▶ ${formatarTempo(f.posicaoSegundos)}</span>`
    : '';
  return `
    <div class="card ${f.assistido ? 'assistido' : ''}" onclick="play(${f.id})">
      <div class="card-body">
        <div class="card-top">
          <div class="card-title" title="${f.titulo}">${f.titulo}</div>
          <button class="cast-btn" title="Enviar para a TV" onclick="event.stopPropagation(); enviarParaTv(${f.id})">📺</button>
        </div>
        <div class="card-meta">
          ${f.anoLancamento ? `<span>${f.anoLancamento}</span>` : ''}
          ${retomar}
          <span class="badge ${f.assistido ? 'on' : ''}" onclick="event.stopPropagation(); toggleAssistido(${f.id})">${f.assistido ? '✓ Assistido' : 'Marcar assistido'}</span>
        </div>
      </div>
      ${barraProgresso(f)}
    </div>`;
}

function continuarCardHtml(c) {
  const info = c.duracaoSegundos
    ? `${pctProgresso(c)}% · faltam ${formatarTempo(c.duracaoSegundos - c.posicaoSegundos)}`
    : `${formatarTempo(c.posicaoSegundos)} assistidos`;
  return `
    <div class="card" onclick="play(${c.id})">
      <div class="card-body">
        <div class="card-top">
          <div class="card-title" title="${c.titulo}">${c.titulo}</div>
          <button class="cast-btn" title="Enviar para a TV" onclick="event.stopPropagation(); enviarParaTv(${c.id})">📺</button>
        </div>
        <div class="card-meta"><span class="resume">▶ ${info}</span></div>
      </div>
      ${barraProgresso(c)}
    </div>`;
}

async function toggleAssistido(id) {
  await fetch(`${API}/${id}/assistido`, { method: 'PUT' });
  const f = filmes.find(x => x.id === id);
  if (f) f.assistido = !f.assistido;
  render();
}

let hls = null;

function destruirHls() {
  if (hls) { hls.destroy(); hls = null; }
}

function iniciarHls(video, url) {
  destruirHls();
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play();
  } else {
    console.error('Navegador sem suporte a HLS.');
  }
}

async function play(id) {
  const video = document.getElementById('video');
  const converting = document.getElementById('converting');
  salvarProgresso();  // se já estava vendo outro filme, guarda onde parou
  video.removeAttribute('src');
  destruirHls();
  converting.style.display = 'none';
  document.getElementById('player').classList.add('active');

  filmeAtual = id;
  ultimoSalvo = 0;
  posicaoParaRetomar = 0;
  retomarTentativas = 0;
  duracaoConfiavel = false;
  const prog = await fetch(`${API}/${id}/progresso`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (prog && prog.posicaoSegundos) posicaoParaRetomar = prog.posicaoSegundos;

  let status = await checarStatus(id);
  while (status === 'preparando') {
    converting.textContent = 'Preparando vídeo, só um instante...';
    converting.style.display = 'block';
    await new Promise(r => setTimeout(r, 1500));
    status = await checarStatus(id);
  }
  converting.style.display = 'none';

  if (status === 'erro') {
    converting.textContent = 'Falha ao converter o vídeo.';
    converting.style.display = 'block';
    return;
  }

  if (status === 'compativel') {
    duracaoConfiavel = true;
    video.src = `${API}/${id}/stream`;
    video.play();
  } else {
    iniciarHls(video, `${API}/${id}/hls/playlist.m3u8`);
  }
  // "assistido" agora é decidido pelo backend quando a reprodução chega perto do fim
  // (só no stream direto, onde a duração é confiável), ou manualmente no badge —
  // não mais ao simplesmente abrir.
}

async function checarStatus(id) {
  const res = await fetch(`${API}/${id}/stream-status`);
  const data = await res.json();
  return data.status;
}

function closePlayer() {
  salvarProgresso();
  const video = document.getElementById('video');
  destruirHls();
  video.pause();
  video.src = '';
  filmeAtual = null;
  document.getElementById('player').classList.remove('active');
  document.getElementById('converting').style.display = 'none';
  load();  // recarrega pra atualizar "continuar assistindo" e as barras de progresso
}

// ─── Continuar de onde parou ────────────────────────────────────────────
let filmeAtual = null;
let ultimoSalvo = 0;
let posicaoParaRetomar = 0;
let retomarTentativas = 0;
// video.duration só é confiável no stream direto; no HLS ele cresce enquanto
// transcodifica, então nem mandamos pro backend nem usamos pra decidir o "fim".
let duracaoConfiavel = false;

// Aplicar a retomada só no 'loadedmetadata' não cola: o Chromium volta o
// currentTime pra 0 logo depois. 'loadeddata'/'canplay'/'seeked' já pegam, e
// re-tentamos algumas vezes caso o primeiro seek seja revertido.
function aplicarRetomada() {
  const video = document.getElementById('video');
  if (!(posicaoParaRetomar > 5)) return;
  const dur = video.duration;
  if (duracaoConfiavel && isFinite(dur) && posicaoParaRetomar >= dur - 5) { posicaoParaRetomar = 0; return; }
  if (Math.abs(video.currentTime - posicaoParaRetomar) <= 1.5) { posicaoParaRetomar = 0; return; }
  if (retomarTentativas++ > 4) { posicaoParaRetomar = 0; return; }
  try { video.currentTime = posicaoParaRetomar; } catch { /* ainda não seekável */ }
}

function configurarProgresso() {
  const video = document.getElementById('video');

  video.addEventListener('loadeddata', aplicarRetomada);
  video.addEventListener('canplay', aplicarRetomada);
  video.addEventListener('seeked', aplicarRetomada);

  video.addEventListener('timeupdate', () => {
    if (filmeAtual == null || video.paused) return;
    const agora = Date.now();
    if (agora - ultimoSalvo < 10000) return;
    ultimoSalvo = agora;
    salvarProgresso();
  });

  video.addEventListener('pause', salvarProgresso);
  window.addEventListener('pagehide', salvarProgresso);
  video.addEventListener('ended', () => {
    if (filmeAtual != null) {
      fetch(`${API}/${filmeAtual}/progresso`, { method: 'DELETE', keepalive: true }).catch(() => {});
    }
  });
}

function salvarProgresso() {
  const video = document.getElementById('video');
  if (filmeAtual == null || !(video.currentTime > 15)) return;
  fetch(`${API}/${filmeAtual}/progresso`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      posicao: video.currentTime,
      duracao: duracaoConfiavel && isFinite(video.duration) && video.duration > 0 ? video.duration : null
    }),
    keepalive: true
  }).catch(() => {});
}

async function scanMedia() {
  const res = await fetch(`${API}/scan`, { method: 'POST' });
  const data = await res.json();
  const msg = document.getElementById('scanMsg');
  msg.textContent = `${data.importados} vídeo(s) importado(s)`;
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 3000);
  load();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const grupo = btn.dataset.grupo;
  document.querySelectorAll(`.filter-btn[data-grupo="${grupo}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (grupo === 'tipo') filtroTipo = btn.dataset.filter;
  else filtroVisto = btn.dataset.filter;
  render();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });
configurarProgresso();
load();

// ─── Controle remoto (TV) ─────────────────────────────────────────────
const PLAYER_API = '/api/player';
let ultimoEstadoRemoto = null;

async function enviarParaTv(id) {
  await fetch(`${PLAYER_API}/selecionar/${id}`, { method: 'POST' });
  pollRemote();
}

async function remotePlayPause() {
  await fetch(`${PLAYER_API}/play-pause`, { method: 'POST' });
  pollRemote();
}

async function remoteSeek(delta) {
  await fetch(`${PLAYER_API}/seek`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ delta })
  });
}

async function remoteVolume(valor) {
  await fetch(`${PLAYER_API}/volume`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ valor: Number(valor) })
  });
}

async function remoteParar() {
  await fetch(`${PLAYER_API}/parar`, { method: 'POST' });
  pollRemote();
}

async function pollRemote() {
  try {
    const res = await fetch(`${PLAYER_API}/state`);
    const estado = await res.json();
    ultimoEstadoRemoto = estado;

    const bar = document.getElementById('remote');
    if (estado.filmeId === null) {
      bar.classList.remove('active');
    } else {
      bar.classList.add('active');
      const f = filmes.find(x => x.id === estado.filmeId);
      document.getElementById('remoteTitulo').textContent = f ? `📺 ${f.titulo}` : '📺 Reproduzindo…';
      document.getElementById('remotePlayPauseBtn').textContent = estado.playing ? '⏸' : '▶';
      document.getElementById('remoteVolume').value = estado.volume;
    }
  } catch { /* ignora falha pontual de rede */ }
  finally {
    setTimeout(pollRemote, 2000);
  }
}

pollRemote();
</script>
</body>
</html>
