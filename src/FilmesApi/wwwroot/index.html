<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmes</title>
<script>
/* ES5 puro, roda ANTES do resto. Navegador de TV antiga não roda esta página (é toda
   ES6+) — quem abre o servidor numa TV velha quer o receptor, manda pra /tv.html. */
(function () {
  var temAsync = false;
  try { new Function('(async function(){})'); temAsync = true; } catch (e) {}
  if (!window.fetch || !window.Promise || !temAsync) {
    location.replace('/tv.html');
  }
})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/base.css">
<style>
/* Reset, header, .filter-btn, #grid, .row/.grupo-hd e as cores em variável (--accent etc.)
   vêm de css/base.css (compartilhado com controle.html). Aqui só o que é específico
   desta tela. */
/* Visual alinhado ao do controle.html (tokens, pílulas, cartões, linhas de 48 px); marcação e comportamento seguem os mesmos. */
:root{--bg:#0d0d0d;--s1:#141414;--s2:#1b1b1b;--s3:#242424;--line:#262626;--txt:#ececec;--mut:#8b8b8b;--mut2:#5f5f5f;--acc:#e50914;--acc-soft:rgba(229,9,20,.14);--acc-txt:#ff7b82;--r:12px}
body{background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
header{background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
.actions{display:flex;gap:10px;align-items:center}
button{background:var(--s2);color:var(--txt);border:1px solid var(--line);padding:0 14px;height:36px;border-radius:18px;cursor:pointer;font:inherit;font-size:13px;transition:background .15s,border-color .15s}
button:hover{background:var(--s3)}
main{padding:12px 16px calc(84px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
.secao{margin-bottom:28px}
.secao-title{font-size:11.5px;letter-spacing:.08em;color:var(--mut2);padding:0 4px;margin-bottom:8px}
.secao-title .count{color:var(--mut2);font-weight:400}
/* cada seção vira um cartão, como as temporadas do controle */
.lista{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lista>.row,.lista .grupo-body>.row{border-radius:0}
.row{cursor:pointer;min-height:48px;padding:0 12px;gap:12px;border-top:1px solid var(--line)}
.lista>.row:first-child,.lista>.grupo:first-child>.grupo-hd,.lista>.grupo:first-child>.serie{border-top:0}
.row:hover{background:var(--s2)}
.row.assistido .rtit{color:var(--mut)}
.row .rtit{font-size:14.5px}
.row .rano{color:var(--mut)}
.rposter{width:28px;height:40px;flex-shrink:0;border-radius:4px;background:var(--s3);object-fit:cover;margin:4px 0}
.row .rep{color:var(--mut2);font-variant-numeric:tabular-nums;margin-right:8px;font-size:12.5px}
.row .resume{font-size:12px;color:var(--acc-txt);white-space:nowrap}
.row .badge{border-radius:12px;padding:2px 9px;font-size:11.5px}
.row .badge:hover{border-color:#666;color:#ccc}
.row .badge.on{background:none;color:var(--mut);border-color:var(--line)}
.row .rprog{left:0;right:0;height:2px;background:transparent;bottom:0}
.row .rprog>div{opacity:.7;border-radius:0 2px 2px 0}
.row .baixar{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;margin:0 -4px 0 0;color:var(--mut2);text-decoration:none;font-size:15px;border-radius:50%}
.row .baixar:hover{color:var(--txt);background:var(--s3)}
.grupo{margin-bottom:0}
.grupo-hd{min-height:52px;padding:6px 12px;border-top:1px solid var(--line);border-radius:0;font-size:15px;font-weight:600;color:var(--txt)}
.grupo-hd:hover{background:var(--s2)}
.grupo-hd .caret{color:var(--mut2)}
.grupo-hd .count{color:var(--mut);font-size:12.5px}
.grupo-body{padding-left:0}
.grupo-body>.row{padding-left:34px}
.grupo.temporada{margin-left:0}
.grupo.temporada>.grupo-hd{font-size:13.5px;font-weight:500;padding-left:26px;color:var(--mut)}
.serie-audio{padding:6px 12px 8px 34px;color:var(--mut)}
.serie-audio select{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:3px 6px}
.player-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center}
.player-overlay.active{display:flex}
.player-overlay video{max-width:100vw;max-height:100vh;width:auto;height:auto}
.player-close{position:absolute;top:16px;right:24px;font-size:28px;color:#fff;cursor:pointer;z-index:101}
.converting{display:none;color:#ccc;font-size:14px;margin-top:16px;white-space:pre-line;text-align:center;max-width:80vw}
.converting button{margin-top:14px;display:inline-block}
#proximoBox{display:none;position:absolute;right:24px;bottom:80px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;max-width:320px;z-index:102}
#proximoBox.on{display:block}
#proximoBox .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
#proximoBox .tit{font-size:14px;margin:4px 0 10px;color:#fff}
#proximoBox button{margin-right:8px}
#proximoBox .go{background:var(--acc);border-color:var(--acc);color:#fff}
#loadbar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--accent);z-index:200;opacity:0;transition:width .3s ease}
#loadbar.on{opacity:1;width:75%}
#loadbar.done{opacity:0;width:100%;transition:width .2s ease,opacity .4s ease .2s}
.empty{text-align:center;color:var(--mut);padding:70px 20px;font-size:16px}
.empty .ico{font-size:52px;display:block;margin-bottom:12px;opacity:.6}
.empty button{margin-top:16px}
.scan-msg{position:fixed;bottom:20px;right:20px;background:var(--ok);color:#000;padding:10px 16px;border-radius:var(--r);font-size:13px;display:none}
/* ─── Grade de pôsteres, fileiras, abas e ficha (mobile-first) ─── */
header{padding:10px 16px;gap:10px}
header h1{font-size:18px;white-space:nowrap}
.actions{flex-wrap:nowrap}
.actions button{white-space:nowrap}
.actions button{height:44px;min-width:44px;padding:0 12px}
.busca-wrap{display:none;padding:0 0 12px}
.busca-wrap.on{display:block}
#busca{width:100%;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--s1);color:var(--txt);padding:0 18px;font-size:16px}
#busca:focus{outline:none;border-color:var(--acc)}
.fileira{margin:4px 0 20px}
.fileira-tit{font-size:15px;font-weight:650;margin:0 2px 8px}
.fileira-tit .count{color:var(--mut2);font-weight:400;font-size:13px}
.trilho{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.trilho .tile{flex:0 0 112px;scroll-snap-align:start}
.posters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.tile{cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.tile .cap{position:relative;aspect-ratio:2/3;background:var(--s2);border-radius:8px;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .sem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12.5px;color:var(--mut);background:linear-gradient(160deg,var(--s3),var(--s1))}
.tile .ok{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);color:#7ddf8b;border-radius:10px;font-size:11px;padding:1px 6px}
.tile .rm{position:absolute;top:0;left:0;width:44px;height:44px;border:0;border-radius:0 0 14px 0;background:rgba(0,0,0,.55);color:#fff;padding:0;font-size:14px}
.tile .qtd{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.72);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.tile .rprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.tile .rprog>div{height:100%;background:var(--acc)}
.tile .nome{font-size:12.5px;margin-top:5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .sub{font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav#abas{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(13,13,13,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#abas button{flex:1;height:58px;border:0;border-radius:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
nav#abas button span{font-size:20px;line-height:1}
nav#abas button.on{color:var(--acc-txt)}
#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.6)}
#sheet.on{display:block}
.sheet-box{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;animation:sobe .22s ease-out}
@keyframes sobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;font-size:18px;padding:0;z-index:2}
.ficha{display:flex;gap:14px}
.ficha img,.ficha .semp{flex:0 0 38%;max-width:200px;aspect-ratio:2/3;border-radius:10px;background:var(--s2);object-fit:cover}
.ficha .semp{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:40px}
.ficha h2{font-size:19px;line-height:1.2;margin:4px 40px 4px 0}
.ficha .meta{color:var(--mut);font-size:13px;margin-bottom:10px}
.sinopse{font-size:14px;line-height:1.45;color:#cfcfcf;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sinopse.aberta{display:block}
.mais{background:none;border:0;color:var(--acc-txt);height:44px;padding:0;font-size:13px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.acoes button,.acoes a{height:48px;border-radius:24px;padding:0 20px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--txt)}
.acoes .pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.corpo-ficha{margin-top:6px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--s1)}
.corpo-ficha .row{min-height:52px}
.corpo-ficha .row .baixar{display:none}
.scan-msg{bottom:calc(130px + env(safe-area-inset-bottom));z-index:300}
.cfg-lista{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--s1);margin-top:14px}
.cfg-lista a,.cfg-lista button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border:0;border-top:1px solid var(--line);border-radius:0;background:none;color:var(--txt);font-size:15px;text-decoration:none;text-align:left;height:auto}
.cfg-lista>:first-child{border-top:0}
.cfg-lista small{color:var(--mut);font-size:12px;margin-left:auto}
.sheet-tit{font-size:19px;font-weight:650;margin:4px 40px 0 0}
.btn-tv{position:absolute;top:16px;left:24px;z-index:101;height:44px;border-radius:22px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;padding:0 16px}
#agora{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:39;display:none;align-items:center;gap:8px;background:var(--s2);border-top:1px solid var(--line);padding:6px 8px 6px 10px;min-height:56px}
#agora.on{display:flex}
#agora img{width:30px;height:44px;border-radius:4px;object-fit:cover;background:var(--s3);flex:none}
#agora .txt{flex:1;min-width:0;color:var(--txt);text-decoration:none;line-height:1.25}
#agora .txt small{display:block;color:var(--acc-txt);font-size:11px}
#agora .txt b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#agora button{height:44px;min-width:44px;padding:0 12px;border-radius:22px;flex:none}
body.com-agora main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
@media(min-width:700px){.posters{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 14px}.trilho .tile{flex-basis:140px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loadbar"></div>
<header>
  <h1>🎬 Filmes</h1>
  <div class="actions">
    <button onclick="scanMedia()" aria-label="Escanear a pasta de mídia" title="Escanear a pasta de mídia">📂 Scan</button>
    <button onclick="abrirConfig()" aria-label="Configurações" title="Configurações">⚙</button>
  </div>
</header>

<main>
  <div class="busca-wrap" id="buscaWrap"><input id="busca" type="search" placeholder="Buscar filme, série ou novela…" autocomplete="off" oninput="buscarDigitando()"></div>
  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</main>

<div id="agora"></div>

<nav id="abas" aria-label="Seções">
  <button data-aba="inicio" class="on"><span>🏠</span>Início</button>
  <button data-aba="serie"><span>📺</span>Séries</button>
  <button data-aba="filme"><span>🎬</span>Filmes</button>
  <button data-aba="novela"><span>🎭</span>Novelas</button>
  <button data-aba="buscar"><span>🔍</span>Buscar</button>
</nav>

<div id="sheet" onclick="if (event.target === this) fecharFicha()"><div class="sheet-box" id="sheetBox"></div></div>

<div class="player-overlay" id="player">
  <button class="btn-tv" onclick="continuarNaTv()">📺 Continuar na TV</button>
  <span class="player-close" onclick="closePlayer()">✕</span>
  <video id="video" controls autoplay></video>
  <div class="converting" id="converting"></div>
  <div id="proximoBox">
    <div class="lbl">Próximo episódio <span id="proximoSeg"></span></div>
    <div class="tit" id="proximoTit"></div>
    <button class="go" onclick="irProximo()">▶ Assistir agora</button>
    <button onclick="cancelarProximo()">Cancelar</button>
  </div>
</div>

<div class="scan-msg" id="scanMsg"></div>

<script src="/vendor/hls.min.js"></script>
<script src="/js/util.js"></script>

<script>
const API = '/api/filmes';
let aba = 'inicio';   // inicio | serie | filme | novela | buscar
const foldersAbertos = new Set();  // pastas de filme expandidas — sobrevive ao re-render

// Elementos consultados em 2+ lugares (funções diferentes) — pegos uma vez só. Os que só
// aparecem 1x no código (grid, empty, loadbar, etc.) ficam com getElementById direto ali mesmo.
const els = {
  video: document.getElementById('video'),
  converting: document.getElementById('converting'),
  player: document.getElementById('player'),
  busca: document.getElementById('busca'),
  sheet: document.getElementById('sheet'),
  sheetBox: document.getElementById('sheetBox'),
  proximoBox: document.getElementById('proximoBox'),
};

// ─── Configuração (valores antes soltos pelo código, alguns repetidos em mais de um
// lugar com o mesmo literal significando coisas diferentes — ex.: dois "1500" e três "12") ──
const RETOMAR_MIN_SEGUNDOS = 5;      // abaixo disso não vale a pena retomar do meio
const RETOMAR_RECUO_S = 7;         // ao retomar de onde parou, volta esses segundos (recuarRetomada: não recua perto do início)
const RETOMAR_MARGEM_FIM_S = 5;      // dentro desses últimos segundos do fim, considera "já terminou" (não retoma)
const RETOMAR_TOLERANCIA_S = 1.5;    // diferença aceitável entre currentTime e a retomada aplicada
const MAX_RETOMAR_TENTATIVAS = 4;    // desiste de tentar re-aplicar o seek de retomada
const MAX_HLS_RETRIES = 3;           // reconexões automáticas em erro de rede do hls.js
const HLS_RETRY_DELAY_MS = 1500;     // espera antes de cada reconexão do hls.js
const POLL_PREPARANDO_MS = 1500;     // intervalo de poll enquanto o vídeo ainda está "preparando"
const MAX_FALHAS_POLL = 12;          // falhas de rede seguidas no poll até desistir com "erro"
const WATCHDOG_STALL_MS = 15000;     // tempo parado no live-edge do HLS até considerar travado
const WATCHDOG_POLL_MS = 5000;       // intervalo do watchdog de live-edge
const DICA_4K_S = 12;                // segundos preparando até mostrar a dica de "arquivo 4K"
const PROXIMO_COUNTDOWN_S = 12;      // contagem regressiva antes de tocar o próximo episódio sozinho
const AUTOSAVE_THROTTLE_MS = 10000;  // intervalo mínimo entre saves automáticos de progresso
const KEEPALIVE_MS = 20000;          // intervalo do aviso "ainda tem alguém aqui" pro transcode
const PLAYER_CONTROLS_HEIGHT_PX = 64; // altura estimada da barra de controle nativa do <video>
const SCAN_MSG_DURATION_MS = 3000;   // quanto tempo o toast "N importados" fica visível
const LOADBAR_RESET_MS = 600;        // espera a transição de "done" terminar antes de zerar a barra

function loadbar(ligado) {
  const b = document.getElementById('loadbar');
  if (ligado) { b.className = 'on'; }
  else { b.className = 'done'; setTimeout(() => { b.className = ''; }, LOADBAR_RESET_MS); }
}

async function load() {
  loadbar(true);
  try { await render(); }
  finally { loadbar(false); }
}

// Filtro (tipo/visto/busca) e agrupamento (filme solto / pasta filme+extras / série com
// episódios) vêm prontos de /api/filmes/tela — esta tela só desenha o que chega, sem
// nenhuma lógica própria de agrupar (era assim que o mesmo bug precisava ser corrigido
// em 3 lugares diferentes: index.html, controle.html e tv.html).
// Miniatura pequena na grade (w185) e pôster maior só na ficha (w500): o TMDb serve o mesmo arquivo em vários tamanhos,
// trocando o segmento "/w342/" da URL guardada — se a URL não tiver esse segmento, usa como veio.
const pw = (url, w) => url ? url.replace('/w342/', `/w${w}/`) : '';

const tipoDaAba = { inicio: 'all', serie: 'serie', filme: 'filme', novela: 'novela', buscar: 'all' };
let itens = new Map();     // chave -> {tipo:'filme'|'serie'|'pasta', ...} do último render (a ficha lê daqui)
let fichaAberta = null;    // chave do que está na ficha

function tile(chave, o) {
  const pct = o.pct || 0;
  return `
    <div class="tile" onclick="${o.onclick}" role="button" tabindex="0">
      <div class="cap">
        ${o.poster ? `<img src="${attr(pw(o.poster, 185))}" loading="lazy" alt="">` : ''}
        ${o.poster ? '' : `<span class="sem">${esc(o.nome)}</span>`}
        ${o.visto ? '<span class="ok">✓</span>' : ''}
        ${o.remover ? `<button class="rm" title="Tirar de continuar assistindo" aria-label="Tirar de continuar assistindo" onclick="event.stopPropagation(); removerDeContinuar(${o.remover})">✕</button>` : ''}
        ${o.qtd ? `<span class="qtd">${esc(o.qtd)}</span>` : ''}
        ${pct ? `<div class="rprog"><div style="width:${pct}%"></div></div>` : ''}
      </div>
      <div class="nome">${esc(o.nome)}</div>
      ${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}
    </div>`;
}

// Monta os cartões da grade a partir de /tela e registra cada um em `itens`.
function cartoesDaTela(t) {
  const lista = [];
  const filmeTile = f => {
    itens.set('f:' + f.id, { tipo: 'filme', f });
    return { nome: f.titulo, sort: f.titulo, poster: f.posterUrl, visto: f.assistido, pct: pctProgresso(f),
             sub: f.anoLancamento ? String(f.anoLancamento) : '', onclick: `abrirFicha('f:${f.id}')` };
  };
  t.filmesSoltos.forEach(f => lista.push(filmeTile(f)));
  t.pastasFilme.forEach(p => {
    const k = 'p:' + p.chave;
    itens.set(k, { tipo: 'pasta', p });
    const pst = p.itens.find(f => f.posterUrl);
    lista.push({ nome: p.nome, sort: p.nome, poster: pst && pst.posterUrl, qtd: `📁 ${p.itens.length}`, onclick: `abrirFicha('${attr(k)}')` });
  });
  t.series.forEach(s => {
    const k = 's:' + s.chave;
    itens.set(k, { tipo: 'serie', s });
    const pst = s.episodios.find(f => f.posterUrl);
    const vistos = s.episodios.filter(e => e.assistido).length;
    lista.push({ nome: s.nome, sort: s.nome, poster: pst && pst.posterUrl, visto: vistos === s.episodios.length,
                 qtd: contagemEpisodios(s.episodios.length).replace(' episódios', ' eps').replace(' episódio', ' ep'),
                 onclick: `abrirFicha('${attr(k)}')` });
  });
  lista.sort((a, b) => a.sort.localeCompare(b.sort, 'pt', { sensitivity: 'base' }));
  return lista;
}

// Fileira horizontal (Continuar assistindo / Novidades / Dublados): tocar já reproduz — é o que a pessoa quer ali.
function fileira(titulo, cartoes) {
  if (!cartoes.length) return '';
  return `<section class="fileira"><div class="fileira-tit">${titulo} <span class="count">(${cartoes.length})</span></div><div class="trilho">${cartoes.join('')}</div></section>`;
}

function cartaoDeFilme(f, sub, remover) {
  return tile('', {
    nome: f.ehEpisodio ? (f.serie || f.titulo) : f.titulo, poster: f.posterUrl, visto: false, pct: pctProgresso(f),
    sub, remover, onclick: `play(${f.id})`,
  });
}

async function render() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const scrollAntes = window.scrollY;  // não pular pro topo ao re-renderizar
  const mostrarVazio = html => { grid.innerHTML = ''; empty.innerHTML = html; empty.style.display = 'block'; };

  const q = aba === 'buscar' ? els.busca.value.trim() : '';
  if (aba === 'buscar' && !q) {
    mostrarVazio('<span class="ico">🔍</span>Digite o nome de um filme, série ou novela.');
    return;
  }
  const params = new URLSearchParams({ tipo: tipoDaAba[aba], visto: 'all' });
  if (q) params.set('busca', q);
  const buscaDoInicio = aba === 'inicio'
    ? Promise.all([fetchJsonOuNull('/api/catalogo/novidades?limite=20'), fetchJsonOuNull('/api/catalogo/dublados?limite=24')])
    : Promise.resolve([null, null]);
  const [t, [novidades, dublados]] = await Promise.all([fetchJsonOuNull(`${API}/tela?${params}`), buscaDoInicio]);

  if (!t) {
    mostrarVazio('<span class="ico">🔍</span>Não consegui falar com o servidor.');
    return;
  }
  itens = new Map();
  const cartoes = cartoesDaTela(t);

  let html = '';
  if (aba === 'inicio') {
    html += fileira('▶ Continuar assistindo', t.continuarAssistindo.map(c =>
      cartaoDeFilme(c, c.ehEpisodio ? `${codigoEpisodio(c) || c.rotulo || ''}` : `faltam ${formatarTempo(Math.max(0, (c.duracaoSegundos || 0) - c.posicaoSegundos))}`, c.id)));
    html += fileira('🆕 Novidades', (novidades || []).map(n => cartaoDeFilme(n.filme, n.rotulo.replace(/^.*·\s*/, ''))));
    html += fileira('🔊 Dublados', (dublados || []).map(n => cartaoDeFilme(n.filme, n.rotulo.replace(/^.*·\s*/, ''))));
  }
  if (cartoes.length) {
    const titulos = { inicio: 'Tudo', serie: 'Séries', filme: 'Filmes', novela: 'Novelas', buscar: 'Resultados' };
    html += `<section class="fileira"><div class="fileira-tit">${titulos[aba]} <span class="count">(${cartoes.length})</span></div><div class="posters">${cartoes.map(c => tile('', c)).join('')}</div></section>`;
  }

  if (!html) {
    mostrarVazio(t.catalogoVazio
      ? `<span class="ico">🎬</span>Catálogo vazio.<br><button onclick="scanMedia()">📂 Escanear a pasta de mídia</button>`
      : aba === 'novela' && !q
      ? `<span class="ico">🎭</span>Nenhuma novela ainda.<br>Coloque os capítulos em <b>novelas/Nome da novela/</b> na pasta de mídia e escaneie.`
      : `<span class="ico">🔍</span>${q ? 'Nada encontrado pra “' + esc(q) + '”.' : 'Nada por aqui ainda.'}`);
  } else {
    empty.style.display = 'none';
    grid.innerHTML = html;
  }
  window.scrollTo(0, scrollAntes);
  if (fichaAberta) { if (itens.has(fichaAberta)) montarFicha(fichaAberta); else fecharFicha(); }   // ficha aberta reflete o que mudou (visto, progresso)
}

// ─── Celular ⇄ TV (sem fila, sem confirmação: o último envio vale) ───────
const PLAYER_API = '/api/player';

async function enviarParaTv(id) {
  fetch(`${API}/${id}/pre-aquecer`, { method: 'POST' }).catch(() => {});   // aquece o remux enquanto a TV carrega
  try {
    const r = await fetch(`${PLAYER_API}/selecionar/${id}`, { method: 'POST' });
    if (!r.ok) throw new Error();
    msgScanErro('📺 Enviado para a TV');
    fecharFicha();
    consultarAgora();
  } catch { msgScanErro('Não consegui falar com a TV.'); }
}

// Do player do celular para a TV: grava onde parou, manda o mesmo título (a TV retoma dali) e fecha o player local.
async function continuarNaTv() {
  const id = filmeAtual;
  if (id == null) return;
  await salvarProgresso();
  await enviarParaTv(id);
  await closePlayer();
}

// Da TV para o celular: grava a posição que a TV está, para a TV e abre o player local exatamente ali.
async function continuarNoCelular() {
  const est = estadoTv;
  if (!est || est.filmeId == null) return;
  const id = est.filmeId;
  if (est.posSegundos > 15) {
    await fetch(`${API}/${id}/progresso`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ posicao: est.posSegundos, duracao: est.duracaoSegundos > 0 ? est.duracaoSegundos : null }) }).catch(() => {});
  }
  await fetch(`${PLAYER_API}/parar`, { method: 'POST' }).catch(() => {});
  consultarAgora();
  play(id, false, true);   // semRecuo: abre na posição exata da TV
}

// Barra "tocando agora": só aparece quando a TV está com algo. Independente do player local do celular.
let estadoTv = null, tvFilmeInfo = {};
async function consultarAgora() {
  const caixa = document.getElementById('agora');
  const est = await fetchJsonOuNull(`${PLAYER_API}/state`);
  estadoTv = est;
  if (!est || est.filmeId == null) { caixa.classList.remove('on'); document.body.classList.remove('com-agora'); return; }
  let info = tvFilmeInfo[est.filmeId];
  if (!info) { info = tvFilmeInfo[est.filmeId] = await fetchJsonOuNull(`${API}/${est.filmeId}`) || {}; }
  const nome = info.ehEpisodio ? `${info.serie || ''} · ${codigoEpisodio(info) || info.rotulo || ''}` : (info.titulo || 'Tocando na TV');
  const pos = est.posSegundos > 0 ? ` · ${formatarTempo(est.posSegundos)}` : '';
  caixa.innerHTML = `
    ${info.posterUrl ? `<img src="${attr(pw(info.posterUrl, 185))}" alt="">` : '<img alt="">'}
    <a class="txt" href="/controle.html" title="Abrir o controle completo da TV"><small>${est.playing ? '▶ Tocando na TV' : '⏸ Pausado na TV'}${esc(pos)}</small><b>${esc(nome)}</b></a>
    <button onclick="fetch('${PLAYER_API}/play-pause',{method:'POST'}).then(consultarAgora)" aria-label="Play ou pausa">${est.playing ? '⏸' : '▶'}</button>
    <button onclick="continuarNoCelular()" title="Continuar no celular">📱 No celular</button>`;
  caixa.classList.add('on');
  document.body.classList.add('com-agora');
}
setInterval(() => { if (!document.hidden) consultarAgora(); }, 3000);
consultarAgora();

// ─── Ficha do título (folha que sobe de baixo) ──────────────────────────
function sinopseHtml(texto) {
  if (!texto) return '';
  return `<p class="sinopse" id="sinopse">${esc(texto)}</p>${texto.length > 180 ? '<button class="mais" onclick="document.getElementById(\'sinopse\').classList.toggle(\'aberta\'); this.textContent = this.textContent === \'mais\' ? \'menos\' : \'mais\'">mais</button>' : ''}`;
}

async function montarFicha(chave) {
  const it = itens.get(chave);
  if (!it) return;
  let poster = '', titulo = '', meta = '', sinopse = '', acoes = '', corpo = '';
  if (it.tipo === 'filme') {
    const f = it.f;
    poster = f.posterUrl; titulo = f.titulo;
    meta = [f.anoLancamento, f.tituloOriginal && f.tituloOriginal !== f.titulo ? f.tituloOriginal : ''].filter(Boolean).join(' · ');
    sinopse = f.sinopse;
    const retomar = f.posicaoSegundos ? `▶ Continuar aqui (${formatarTempo(f.posicaoSegundos)})` : '▶ Assistir aqui';
    acoes = `<button class="pri" onclick="enviarParaTv(${f.id})">📺 Enviar para a TV</button>
      <button onclick="play(${f.id})">${retomar}</button>
      <button onclick="toggleAssistido(${f.id})">${f.assistido ? '✓ Assistido' : 'Marcar como assistido'}</button>
      <a href="/api/filmes/${f.id}/download" download title="Baixar o arquivo original" class="btn-baixar">⬇ Baixar</a>`;
  } else if (it.tipo === 'pasta') {
    const p = it.p, pst = p.itens.find(f => f.posterUrl);
    poster = pst && pst.posterUrl; titulo = p.nome; meta = `${p.itens.length} arquivos`;
    sinopse = (p.itens.find(f => f.sinopse) || {}).sinopse;
    corpo = p.itens.map(f => rowHtml(f)).join('');
  } else {
    const s = it.s, pst = s.episodios.find(f => f.posterUrl);
    poster = pst && pst.posterUrl; titulo = s.nome;
    const temps = new Set(s.episodios.map(e => e.temporada).filter(t => t > 0)).size;
    const orig = s.episodios.map(e => e.tituloOriginal).find(Boolean);
    meta = [temps > 1 ? `${temps} temporadas` : '', contagemEpisodios(s.episodios.length), textoVistos(s.episodios)].filter(Boolean).join(' · ');
    sinopse = (s.episodios.find(f => f.sinopse) || {}).sinopse;
    const proximo = s.episodios.find(e => !e.assistido) || s.episodios[0];
    const emAndamento = s.episodios.find(e => e.posicaoSegundos);
    const alvo = emAndamento || proximo;
    const nomeAlvo = esc(codigoEpisodio(alvo) || alvo.rotulo || '');
    acoes = alvo ? `<button class="pri" onclick="enviarParaTv(${alvo.id})">📺 Enviar para a TV · ${nomeAlvo}</button>
      <button onclick="play(${alvo.id})">${emAndamento ? '▶ Continuar aqui' : '▶ Assistir aqui'}</button>` : '';
    const audios = await carregarAudiosDasSeries();
    corpo = corpoDaSerieHtml(s.episodios, seletorAudioSerieHtml(s.chave, audios[s.chave]), f => rowHtml(f, true));
  }
  if (fichaAberta !== chave && fichaAberta !== null && !itens.has(fichaAberta)) return;
  const abertoAntes = els.sheetBox.scrollTop;
  els.sheetBox.innerHTML = `
    <button class="sheet-x" onclick="fecharFicha()" aria-label="Fechar">✕</button>
    <div class="ficha">
      ${poster ? `<img src="${attr(pw(poster, 500))}" alt="">` : '<div class="semp">🎬</div>'}
      <div><h2>${esc(titulo)}</h2><div class="meta">${esc(meta)}</div>${sinopseHtml(sinopse)}</div>
    </div>
    <div class="acoes">${acoes}</div>
    ${corpo ? `<div class="corpo-ficha">${corpo}</div>` : ''}`;
  els.sheetBox.scrollTop = abertoAntes;
}

async function abrirFicha(chave) {
  fichaAberta = chave;
  els.sheetBox.scrollTop = 0;
  await montarFicha(chave);
  els.sheet.classList.add('on');
  document.body.style.overflow = 'hidden';
}

function fecharFicha() {
  fichaAberta = null;
  els.sheet.classList.remove('on');
  document.body.style.overflow = '';
}

function pctProgresso(item) {
  if (!item.posicaoSegundos || !item.duracaoSegundos) return 0;
  return Math.min(100, Math.round(100 * item.posicaoSegundos / item.duracaoSegundos));
}

function barraProgresso(item) {
  const pct = pctProgresso(item);
  return pct ? `<div class="rprog"><div style="width:${pct}%"></div></div>` : '';
}

// formatarTempo() vem de /js/util.js.

const pad2 = n => String(n).padStart(2, '0');

// "S01E02" quando dá pra saber temporada/episódio; null senão (chamador decide o fallback).
function codigoEpisodio(f) {
  return f.temporada != null ? `S${pad2(f.temporada)}E${pad2(f.episodio)}` : null;
}

// nome "limpo" do episódio: tira SxxExx embutido, o "8 - "/"8   " do começo e,
// se sobrar só o nome da série (nome de arquivo genérico), não repete.
function tituloEpisodio(f) {
  let s = String(f.titulo || '')
    .replace(/\bS\d{1,2}\s*E\d{1,3}\b/ig, ' ')
    .replace(/^\s*\d{1,3}[\s.\-–—):\]]+/, '')
    .replace(/\s+/g, ' ').trim();
  if (f.serie && s.toLowerCase() === f.serie.toLowerCase()) s = '';
  return s;
}

// Miniatura do pôster (TMDB) quando tem; senão um retângulo vazio, só pra manter as
// linhas alinhadas na lista. "loading=lazy" evita baixar tudo de uma vez em catálogo grande.
function posterHtml(f) {
  return f.posterUrl
    ? `<img class="rposter" src="${attr(f.posterUrl)}" loading="lazy" alt="">`
    : `<span class="rposter"></span>`;
}

// Tooltip: título original (quando diverge do exibido) + sinopse — TMDB às vezes traduz
// tão livremente que vale mostrar o nome original ao passar o mouse.
function tooltipFilme(f) {
  const original = f.tituloOriginal && f.tituloOriginal !== f.titulo ? f.tituloOriginal + '\n' : '';
  return attr(original + (f.sinopse || f.titulo));
}

function rowHtml(f, episodio) {
  const retomar = f.posicaoSegundos ? `<span class="resume">▶ ${formatarTempo(f.posicaoSegundos)}</span>` : '';
  let titulo;
  if (episodio) {
    const cod = codigoEpisodio(f) || (f.rotulo || '');
    const nome = f.tituloEpisodio || tituloEpisodio(f);
    titulo = (cod || nome)
      ? `${cod ? `<span class="rep">${esc(cod)}</span>` : ''}${esc(nome)}`
      : esc(f.titulo);
  } else {
    titulo = esc(f.titulo);
  }
  return `
    <div class="row ${f.assistido ? 'assistido' : ''}" onclick="play(${f.id})" title="${tooltipFilme(f)}">
      ${episodio ? '' : posterHtml(f)}
      <span class="rtit">${titulo}</span>
      ${!episodio && f.anoLancamento ? `<span class="rano">${f.anoLancamento}</span>` : ''}
      ${retomar}
      <span class="badge ${f.assistido ? 'on' : ''}" onclick="event.stopPropagation(); toggleAssistido(${f.id})">${f.assistido ? '✓ Assistido' : 'Marcar'}</span>
      <a class="baixar" href="/api/filmes/${f.id}/download" download title="Baixar o arquivo original" onclick="event.stopPropagation()">⬇</a>
      ${barraProgresso(f)}
    </div>`;
}

// c já vem completo (FilmeResponse) de /api/filmes/tela — sem precisar procurar em nada.
function continuarRowHtml(c) {
  const info = c.duracaoSegundos
    ? `${pctProgresso(c)}% · faltam ${formatarTempo(c.duracaoSegundos - c.posicaoSegundos)}`
    : `${formatarTempo(c.posicaoSegundos)} assistidos`;
  const nome = c.ehEpisodio
    ? `<span class="rep">${c.serie} · ${codigoEpisodio(c)}</span>${esc(tituloEpisodio(c))}`
    : esc(c.titulo);
  return `
    <div class="row" onclick="play(${c.id})" title="${tooltipFilme(c)}">
      ${posterHtml(c)}
      <span class="rtit">${nome}</span>
      <span class="resume">▶ ${info}</span>
      <button class="remover" title="Tirar de continuar assistindo" onclick="event.stopPropagation(); removerDeContinuar(${c.id})">✕</button>
      ${barraProgresso(c)}
    </div>`;
}

let hls = null;

function destruirHls() {
  if (hls) { hls.destroy(); hls = null; }
}

// ─── Watchdog do "live edge" ────────────────────────────────────────────
// A playlist HLS cresce sem #EXT-X-ENDLIST enquanto o servidor ainda converte. Se a
// reprodução alcança o fim do que já foi gerado (assiste mais rápido que o encode, ou o
// job travou/morreu no meio), o <video> só fica "bufferizando" pra sempre — sem nenhum
// aviso, indistinguível de travado de verdade. Esse watchdog detecta currentTime parado
// tocando e consulta /stream-status pra decidir: ainda convertendo (avisa e segue
// esperando), falhou de vez (mostra erro em vez de spinner eterno), ou já terminou e o
// hls.js só não recarregou a playlist ainda (força reload — ele nota o ENDLIST e conclui).
let watchdogLiveEdge = null;
let vigiaPos = -1;
let vigiaDesde = 0;

function pararWatchdogLiveEdge() {
  if (watchdogLiveEdge) { clearInterval(watchdogLiveEdge); watchdogLiveEdge = null; }
  vigiaPos = -1;
  vigiaDesde = 0;
}

function iniciarWatchdogLiveEdge(id) {
  pararWatchdogLiveEdge();
  watchdogLiveEdge = setInterval(async () => {
    const video = els.video;
    if (filmeAtual !== id || video.paused || video.ended || reproducaoConcluida) {
      vigiaPos = -1; vigiaDesde = 0;
      return;
    }
    if (video.currentTime !== vigiaPos) {
      vigiaPos = video.currentTime;
      vigiaDesde = Date.now();
      const converting = els.converting;
      if (converting.dataset.liveEdge) { converting.style.display = 'none'; delete converting.dataset.liveEdge; }
      return;
    }
    if (!vigiaDesde) vigiaDesde = Date.now();
    if (Date.now() - vigiaDesde < WATCHDOG_STALL_MS) return;  // parado há pouco: buffer normal, não é o live-edge

    const status = await checarStatus(id);
    if (filmeAtual !== id) return;
    const converting = els.converting;
    if (status === 'erro') {
      converting.innerHTML = 'A conversão falhou no meio do vídeo. <button onclick="play(filmeAtual)">Tentar de novo</button>';
      converting.style.display = 'block';
      converting.dataset.liveEdge = '1';
      pararWatchdogLiveEdge();
    } else if (status === 'preparando') {
      converting.textContent = 'Ainda convertendo — a reprodução alcançou o que já foi processado. Aguarde…';
      converting.style.display = 'block';
      converting.dataset.liveEdge = '1';
      vigiaDesde = Date.now();  // não repete o /stream-status a cada 5s enquanto ainda prepara
    } else if (status === 'disponivel' && hls) {
      // Terminou (ganhou #EXT-X-ENDLIST) mas o hls.js ainda não recarregou a playlist pra
      // perceber — forçar o reload costuma bastar pra ele notar o fim e disparar 'ended'.
      hls.loadSource(`${API}/${id}/hls/playlist.m3u8`);
      vigiaDesde = Date.now();
    }
  }, WATCHDOG_POLL_MS);
}

let hlsRetries = 0;
function iniciarHls(video, url, inicio) {
  destruirHls();
  const t = inicio > 5 ? Math.floor(inicio) : 0;
  const idAlvo = filmeAtual;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls(t ? { startPosition: t } : {});  // começa já na retomada, sem pulo
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      // erro fatal de rede: normalmente o transcode reiniciou e um segmento sumiu.
      // Reabre o filme (retoma perto de onde estava) em vez de deixar o player travado.
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && filmeAtual === idAlvo && hlsRetries++ < MAX_HLS_RETRIES) {
        setTimeout(() => { if (filmeAtual === idAlvo) play(idAlvo, true); }, HLS_RETRY_DELAY_MS);
      } else {
        destruirHls();
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = t ? `${url}#t=${t}` : url;
    video.play();
  } else {
    console.error('Navegador sem suporte a HLS.');
  }
}

async function play(id, ehRetry, semRecuo) {
  const video = els.video;
  const converting = els.converting;
  cancelarProximo();
  removerLegendas();
  video.removeAttribute('src');
  destruirHls();
  pararWatchdogLiveEdge();
  converting.style.display = 'none';
  els.player.classList.add('active');

  filmeAtual = id;
  ultimoSalvo = 0;
  posicaoParaRetomar = 0;
  retomarTentativas = 0;
  checarFalhas = 0;
  if (!ehRetry) hlsRetries = 0;  // retry preserva o contador, senão o teto de 3 nunca conta
  duracaoConfiavel = false;
  reproducaoConcluida = false;
  const prog = await fetchJsonOuNull(`${API}/${id}/progresso`);
  if (prog && prog.posicaoSegundos) posicaoParaRetomar = (ehRetry || semRecuo) ? prog.posicaoSegundos : recuarRetomada(prog.posicaoSegundos, RETOMAR_RECUO_S, RETOMAR_MIN_SEGUNDOS);

  const inicioPrep = Date.now();
  converting.style.display = 'block';
  const prepTimer = setInterval(() => {
    const s = Math.round((Date.now() - inicioPrep) / 1000);
    const dica = s > DICA_4K_S ? '\nArquivos 4K levam 1-2 min na primeira vez — depois fica em cache.' : '';
    converting.innerHTML = `Preparando vídeo… ${s}s${esc(dica)}<br><button onclick="closePlayer()">Cancelar</button>`;
  }, 1000);
  converting.innerHTML = 'Preparando vídeo…<br><button onclick="closePlayer()">Cancelar</button>';

  let status;
  try {
    status = await checarStatus(id);
    while (status === 'preparando') {
      await new Promise(r => setTimeout(r, POLL_PREPARANDO_MS));
      if (filmeAtual !== id) return;  // fechou/trocou de filme durante a espera
      status = await checarStatus(id);
    }
  } finally {
    clearInterval(prepTimer);
  }
  converting.style.display = 'none';

  if (status === 'erro') {
    converting.textContent = 'Falha ao preparar o vídeo. Tente de novo.';
    converting.style.display = 'block';
    return;
  }

  if (status === 'compativel') {
    duracaoConfiavel = true;
    const frag = posicaoParaRetomar > RETOMAR_MIN_SEGUNDOS ? `#t=${Math.floor(posicaoParaRetomar)}` : '';
    video.src = `${API}/${id}/stream${frag}`;  // fragmento = começa na retomada, sem pulo
    video.play();
  } else {
    iniciarHls(video, `${API}/${id}/hls/playlist.m3u8`, posicaoParaRetomar);
    iniciarWatchdogLiveEdge(id);
  }
  carregarLegendas(id);
  // "assistido" agora é decidido pelo backend quando a reprodução chega perto do fim
  // (só no stream direto, onde a duração é confiável), ou manualmente no badge —
  // não mais ao simplesmente abrir.
}

// nunca lança: erro de rede transitório vira 'preparando' (segue tentando);
// depois de muitas falhas seguidas, desiste com 'erro'.
let checarFalhas = 0;
async function checarStatus(id) {
  try {
    const res = await fetch(`${API}/${id}/stream-status`);
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    checarFalhas = 0;
    return data.status;
  } catch {
    return (++checarFalhas > MAX_FALHAS_POLL) ? 'erro' : 'preparando';
  }
}

// ─── Legendas embutidas ───────────────────────────────────────────────
// Cada faixa de texto vira um <track> apontando pro endpoint .vtt; o menu "CC"
// nativo do <video controls> cuida da troca. Funciona no stream direto e no HLS.
const LANG_BCP = { por: 'pt', pob: 'pt', pt: 'pt', eng: 'en', spa: 'es', fre: 'fr', fra: 'fr', ger: 'de', deu: 'de', ita: 'it', jpn: 'ja' };

function removerLegendas() {
  document.querySelectorAll('#video track').forEach(t => t.remove());
}

async function carregarLegendas(id) {
  let faixas;
  try { faixas = await fetch(`${API}/${id}/legendas`).then(r => r.ok ? r.json() : []); }
  catch { return; }
  if (filmeAtual !== id) return;  // trocou de filme enquanto buscava

  const video = els.video;
  removerLegendas();
  faixas.filter(x => x.convertivel).forEach(x => {
    const tr = document.createElement('track');
    tr.kind = 'subtitles';
    tr.src = `${API}/${id}/legenda/${x.idx}`;
    tr.srclang = LANG_BCP[(x.idioma || '').toLowerCase()] || x.idioma || 'und';
    tr.label = x.titulo || x.idioma || `Legenda ${x.idx + 1}`;
    if (x.recomendada || (x.forced && (x.idioma === 'por' || x.idioma === 'pob'))) tr.default = true;
    video.appendChild(tr);
  });
}

// ─── Próximo episódio ─────────────────────────────────────────────────
let proximoInfo = null, proximoInterval = null, proximoOfertaId = 0;

function cancelarProximo() {
  if (proximoInterval) { clearInterval(proximoInterval); proximoInterval = null; }
  proximoInfo = null;
  proximoOfertaId++;  // invalida qualquer resposta de /proximo ainda em voo (ver ofereceProximo)
  els.proximoBox.classList.remove('on');
}

async function ofereceProximo(id) {
  // 'ended' pode disparar 2x em alguns navegadores. cancelarProximo() sozinho não basta: se
  // as 2 chamadas acontecem síncronas (uma logo após a outra, antes do fetch da 1ª
  // responder), as 2 leem o estado ainda limpo e nenhuma cancela nada — cada resposta monta
  // seu PRÓPRIO setInterval e só o mais recente fica em proximoInterval; o outro roda órfão
  // e chama irProximo() de novo pouco depois, reiniciando o episódio que acabou de começar.
  // O token (proximoOfertaId) resolve isso não importa o intervalo entre as 2 chamadas: só a
  // resposta da ÚLTIMA ofereceProximo (que "ganhou" o token por último) monta o timer.
  cancelarProximo();
  const meuToken = ++proximoOfertaId;
  let prox;
  try {
    const r = await fetch(`${API}/${id}/proximo`);
    if (r.status !== 200) return;
    prox = await r.json();
  } catch { return; }
  if (filmeAtual !== id || !prox || meuToken !== proximoOfertaId) return;

  proximoInfo = prox;
  preAquecerProximo(prox.id);
  document.getElementById('proximoTit').textContent = rotuloComTitulo(prox) + (prox.serie ? ' — ' + prox.serie : '');
  els.proximoBox.classList.add('on');

  let resta = PROXIMO_COUNTDOWN_S;
  const tick = () => {
    document.getElementById('proximoSeg').textContent = `em ${resta}s`;
    if (resta-- <= 0) irProximo();
  };
  tick();
  proximoInterval = setInterval(tick, 1000);
}

function irProximo() {
  const prox = proximoInfo;
  cancelarProximo();
  if (prox) play(prox.id, false, true);
}

// Dispara/reusa o transcode do próximo episódio assim que a oferta aparece (fim do atual) —
// o HLS entrega o primeiro segmento sem esperar o episódio inteiro, então só precisa começar
// cedo pra não ter o "Preparando..." quando o usuário realmente abrir. Se o arquivo for
// compatível direto, o endpoint só responde 409 na hora, sem custo. Resposta ignorada de
// propósito — é só pra cutucar o servidor a começar, ninguém vai consumir isso agora.
function preAquecerProximo(id) {
  fetch(`${API}/${id}/hls/playlist.m3u8`).catch(() => {});
}

async function closePlayer() {
  const id = filmeAtual;
  cancelarProximo();
  await salvarProgresso();  // grava ANTES de rebuscar, senão a lista volta desatualizada
  const video = els.video;
  removerLegendas();
  destruirHls();
  pararWatchdogLiveEdge();
  video.pause();
  video.src = '';
  filmeAtual = null;
  els.player.classList.remove('active');
  els.converting.style.display = 'none';
  await atualizarAposReproducao(id);
}

// render() já busca /tela de novo — reflete a posição/progresso salvo sem precisar
// remendar nada em cache local.
async function atualizarAposReproducao(id) {
  render();
}

// ─── Continuar de onde parou ────────────────────────────────────────────
let filmeAtual = null;
let ultimoSalvo = 0;
let posicaoParaRetomar = 0;
let retomarTentativas = 0;
// video.duration só é confiável no stream direto; no HLS ele cresce enquanto
// transcodifica, então nem mandamos pro backend nem usamos pra decidir o "fim".
let duracaoConfiavel = false;
// depois do 'ended' o /concluir já limpou a retomada — impede um save tardio de recriá-la.
let reproducaoConcluida = false;

// Aplicar a retomada só no 'loadedmetadata' não cola: o Chromium volta o
// currentTime pra 0 logo depois. 'loadeddata'/'canplay'/'seeked' já pegam, e
// re-tentamos algumas vezes caso o primeiro seek seja revertido.
function aplicarRetomada() {
  const video = els.video;
  if (!(posicaoParaRetomar > RETOMAR_MIN_SEGUNDOS)) return;
  const dur = video.duration;
  if (duracaoConfiavel && isFinite(dur) && posicaoParaRetomar >= dur - RETOMAR_MARGEM_FIM_S) { posicaoParaRetomar = 0; return; }
  if (Math.abs(video.currentTime - posicaoParaRetomar) <= RETOMAR_TOLERANCIA_S) { posicaoParaRetomar = 0; return; }
  if (retomarTentativas++ > MAX_RETOMAR_TENTATIVAS) { posicaoParaRetomar = 0; return; }
  try { video.currentTime = posicaoParaRetomar; } catch { /* ainda não seekável */ }
}

function configurarProgresso() {
  const video = els.video;

  video.addEventListener('loadeddata', aplicarRetomada);
  video.addEventListener('canplay', aplicarRetomada);
  video.addEventListener('seeked', aplicarRetomada);

  // Clicar em qualquer lugar do player pausa/despausa: na imagem (fora da faixa
  // de baixo, que é a barra de controle nativa) ou nas bordas pretas em volta.
  const alternarPausa = () => { if (video.paused) video.play().catch(() => {}); else video.pause(); };
  video.addEventListener('click', e => {
    const r = video.getBoundingClientRect();
    // ignora a faixa de baixo (barra de controle nativa, ~48-64px)
    if (r.height > 0 && e.clientY > r.bottom - PLAYER_CONTROLS_HEIGHT_PX) return;
    alternarPausa();
  });
  els.player.addEventListener('click', e => {
    if (e.target.id === 'player') alternarPausa();  // bordas pretas em volta do vídeo
  });

  video.addEventListener('timeupdate', () => {
    if (filmeAtual == null || video.paused) return;
    const agora = Date.now();
    if (agora - ultimoSalvo < AUTOSAVE_THROTTLE_MS) return;
    ultimoSalvo = agora;
    salvarProgresso();
  });

  video.addEventListener('pause', () => salvarProgresso());
  window.addEventListener('pagehide', () => salvarProgresso());
  video.addEventListener('ended', () => {
    // fim da reprodução: marca assistido + limpa a retomada (funciona também no
    // HLS, onde a regra de "perto do fim" do backend não roda).
    if (filmeAtual == null) return;
    reproducaoConcluida = true;
    const id = filmeAtual;
    fetch(`${API}/${id}/concluir`, { method: 'POST', keepalive: true }).catch(() => {});
    ofereceProximo(id);
  });

  // Keepalive: avisa o backend que ainda tem alguém aqui, senão o transcode em
  // andamento é abortado por inatividade (HlsOrphanTimeoutSeconds).
  setInterval(() => {
    if (filmeAtual != null) fetch(`${API}/${filmeAtual}/assistindo`, { method: 'POST' }).catch(() => {});
  }, KEEPALIVE_MS);
}

function salvarProgresso() {
  const video = els.video;
  if (filmeAtual == null || reproducaoConcluida || !(video.currentTime > 15)) return Promise.resolve();
  return fetch(`${API}/${filmeAtual}/progresso`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      posicao: video.currentTime,
      duracao: duracaoConfiavel && isFinite(video.duration) && video.duration > 0 ? video.duration : null
    }),
    keepalive: true
  }).catch(() => {});
}

// AdminToken (opcional no servidor): se o scan voltar 401, pede o token uma vez e guarda neste navegador.
async function postarScan() {
  const headers = () => { try { const t = localStorage.getItem('adminToken'); return t ? { 'X-Admin-Token': t } : {}; } catch { return {}; } };
  let res = await fetch(`${API}/scan`, { method: 'POST', headers: headers() });
  if (res.status === 401) {
    const token = prompt('O servidor pede um token de administrador pro scan:');
    if (token) { try { localStorage.setItem('adminToken', token); } catch { /* storage bloqueado: vale só desta vez */ } res = await fetch(`${API}/scan`, { method: 'POST', headers: headers() }); }
  }
  return res;
}

function msgScanErro(texto) {
  const msg = document.getElementById('scanMsg');
  msg.textContent = texto;
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', SCAN_MSG_DURATION_MS);
}

async function scanMedia() {
  const btn = document.querySelector('.actions button');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Escaneando…'; }
  try {
    const res = await postarScan();
    if (res.status === 401) { msgScanErro('Token de administrador errado ou ausente.'); return; }
    const data = await res.json();
    const msg = document.getElementById('scanMsg');
    const partes = [`${data.importados} importado(s)`];
    if (data.removidos) partes.push(`${data.removidos} removido(s)`);
    if (data.titulosLimpos) partes.push(`${data.titulosLimpos} título(s) limpo(s)`);
    msg.textContent = partes.join(' · ');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', SCAN_MSG_DURATION_MS);
    await load();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '📂 Scan'; }
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (els.player.classList.contains('active')) closePlayer();
    else if (fichaAberta) fecharFicha();
    els.busca.blur();
  }
  // "/" foca a busca (a não ser que já esteja digitando em algum campo)
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault();
    irParaAba('buscar');
  }
});
configurarProgresso();
load();
</script>
</body>
