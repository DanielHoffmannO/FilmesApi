<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Filmes</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #121216; color: #ddd; font-family: sans-serif; }
  #msg { position: absolute; top: 45%; width: 100%; text-align: center; font-size: 32px; }
  #end { margin-top: 18px; font-size: 20px; color: #888; }
</style>
</head>
<body>
<div id="msg">Abrindo Filmes...<div id="end"></div></div>
<script>
  // O servidor troca o marcador pelo endereco de onde a TV baixou este app (ver OrsayWidget.cs).
  var SERVIDOR = '__SERVIDOR__';
  document.getElementById('end').innerHTML = SERVIDOR;
  // Pausa curta so pra tela aparecer; dai em diante a pagina do servidor (tv.html) assume.
  setTimeout(function () { window.location.href = SERVIDOR + '/tv.html'; }, 400);
</script>
</body>
</html>
