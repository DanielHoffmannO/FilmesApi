<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle da TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e50914' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='7' width='18' height='12' rx='2'/%3E%3Cpath d='M16 3l-4 4l-4-4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/controle-tv.css">
</head>
<body>
<script>if (/[?&]embed=1/.test(location.search)) document.body.classList.add('embed');</script>

<div class="top">
  <h1>Controle da TV</h1>
  <a class="ib" href="/" aria-label="Lista completa" data-ico="grid"></a>
</div>

<div class="embed-cab">
  <h1>Controle da TV</h1>
  <button class="ib" onclick="fecharEmbed()" aria-label="Fechar o controle" data-ico="close"></button>
</div>
<div class="embed-capa off" id="embedCapa"><img id="capaImg" alt=""><div class="ct"><b id="capaTit"></b><small id="capaSub"></small><p id="capaSin"></p></div></div>
<div class="embed-ocioso" id="embedOcioso">
  <span data-ico="tv"></span><b>A TV está parada</b>
  <span>Escolha um título na biblioteca e toque em "Enviar para a TV".</span>
  <button onclick="abrirFila()">Ver "tocar a seguir"</button>
  <button class="irbtn" onclick="abrirIr()" hidden>📺 Controle remoto da TV</button>
  <button onclick="fecharEmbed()">Voltar à biblioteca</button>
</div>

<main>
  <div class="seg" id="filters" role="tablist" aria-label="Tipo">
    <button class="on" data-filter="all" role="tab" aria-selected="true">Todos</button>
    <button data-filter="filme" role="tab" aria-selected="false">Filmes</button>
    <button data-filter="serie" role="tab" aria-selected="false">Séries</button>
    <button data-filter="novela" role="tab" aria-selected="false">Novelas</button>
  </div>
  <div id="msg" class="msg">Carregando…</div>
  <div id="grid"></div>
</main>

<div class="folha-scrim" id="folhaScrim" onclick="fecharFolha()"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo" tabindex="-1">
  <div class="alca"></div>
  <h2 id="folhaTitulo">Idioma e legenda</h2>
  <div class="sub" id="folhaSub"></div>
  <div id="folhaCorpo"></div>
</div>

<div class="folha-scrim" id="sonoScrim" onclick="fecharSono()"></div>
<div class="folha" id="sonoFolha" role="dialog" aria-modal="true" aria-labelledby="sonoTitulo" tabindex="-1">
  <div class="alca"></div>
  <h2 id="sonoTitulo">Dormir</h2>
  <div class="sub" id="sonoSub"></div>
  <div id="sonoCorpo"></div>
</div>

<div class="folha-scrim" id="irScrim" onclick="fecharIr()"></div>
<div class="folha" id="irFolha" role="dialog" aria-modal="true" aria-label="Controle da TV" tabindex="-1">
  <div class="alca"></div>
  <div class="ir-rotulo">TV</div>
  <div class="ir">
    <div class="ir-topo">
      <button class="ir-power" data-tecla="energia" aria-label="Ligar ou desligar a TV" title="Ligar ou desligar a TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.6a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
    <div class="ir-funcs">
      <button data-tecla="fonte" aria-label="Fonte" title="Fonte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h11"/><path d="M11 8l4 4l-4 4"/><path d="M20 5v14"/></svg></button>
      <button data-tecla="smarthub" aria-label="Smart Hub" title="Smart Hub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
      <button data-tecla="menu" aria-label="Menu (configurações)" title="Menu (configurações)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button data-tecla="voltar" aria-label="Voltar" title="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    </div>
    <div class="ir-dpad">
      <button class="d-c" data-tecla="cima" aria-label="Cima" title="Cima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button class="d-e" data-tecla="esquerda" aria-label="Esquerda" title="Esquerda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="d-ok" data-tecla="ok" aria-label="OK" title="OK">OK</button>
      <button class="d-d" data-tecla="direita" aria-label="Direita" title="Direita"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="d-b" data-tecla="baixo" aria-label="Baixo" title="Baixo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="ir-baixo">
      <div class="ir-pilula" role="group" aria-label="Volume da TV">
        <button data-tecla="vol+" aria-label="Volume da TV mais" title="Volume da TV mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg></i>
        <button data-tecla="vol-" aria-label="Volume da TV menos" title="Volume da TV menos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
      <button class="ir-mudo" data-tecla="mudo" aria-label="Mudo da TV" title="Mudo da TV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8.8 0 0 1 1.5.5v14a.8.8 0 0 1-1.5.5L6 15"/><path d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <div class="ir-pilula" role="group" aria-label="Canal">
        <button data-tecla="canal+" aria-label="Canal mais" title="Canal mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg></i>
        <button data-tecla="canal-" aria-label="Canal menos" title="Canal menos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
    </div>
  </div>
</div>

<div class="folha-scrim" id="filaScrim" onclick="fecharFila()"></div>
<div class="folha" id="filaFolha" role="dialog" aria-modal="true" aria-labelledby="filaTitulo" tabindex="-1">
  <div class="alca"></div>
  <h2 id="filaTitulo">Tocar a seguir</h2>
  <div class="sub">Toca na ordem, antes do próximo episódio da série.</div>
  <div id="filaCorpo"></div>
</div>

<div class="remote" id="remote">
  <div class="l1">
    <span data-ico="tv"></span>
    <div class="t" role="button" tabindex="0" onclick="abrirFolhaAgora()" onkeydown="if (event.key === 'Enter') abrirFolhaAgora()"><b id="remoteTitulo"></b><small id="remoteSub"></small></div>
    <button class="ib" onclick="abrirFolhaAgora()" aria-label="Idioma e legenda" data-ico="sliders"></button>
  </div>
  <div class="progw" id="remoteProg" onclick="remoteScrub(event)"><div class="prog"><div class="z" id="remoteFaixaAbertura"></div><div class="z" id="remoteFaixaCreditos"></div><div class="p" id="remoteProgFill"></div></div></div>
  <div class="tempos"><span id="remoteTempoDec"></span><span id="remoteTempoRest"></span></div>
  <div class="remote-proximo" id="remoteProximo">
    <span id="remoteProximoTxt"></span>
    <button onclick="remoteAceitarProximo()">Assistir agora</button>
  </div>
  <div class="remote-ia" id="remoteIa">
    <span class="tag ia" title="Este arquivo tem uma faixa de dublagem em português feita por IA">IA</span>
    <button class="iabtn" id="remoteIaBtn" onclick="remoteAlternarIa()"></button>
  </div>
  <div class="remote-proximo" id="remoteSono">
    <span id="remoteSonoTxt"></span>
    <button style="background:var(--s3)" onclick="definirSono(0, false, 'Sono cancelado.')">Cancelar</button>
  </div>
  <div class="remote-proximo" id="remoteConfirma">
    <span id="remoteConfirmaTxt">Ainda está assistindo?</span>
    <button onclick="remoteContinuar()">Continuar</button>
  </div>
  <div class="ctl">
    <button class="rb" onclick="remoteSeek(-SEEK_STEP_S)" aria-label="Voltar 30 segundos"><span data-ico="back"></span><em>30</em></button>
    <button class="big" onclick="remotePlayPause()" id="remotePlayPauseBtn" aria-label="Pausar"></button>
    <button class="cta neutro" onclick="remoteDireita()" id="remoteDireitaBtn"></button>
  </div>
  <div class="l3">
    <button class="ib" onclick="remoteProximoEp()" id="remoteProximoEpBtn" aria-label="Próximo episódio" data-ico="next" style="display:none"></button>
    <span data-ico="vol" style="margin-left:6px;display:grid"></span>
    <input type="range" class="vol" id="remoteVolume" min="0" max="1" step="0.05" oninput="remoteVolume(this.value)" aria-label="Volume">
    <button class="ib" id="remoteFilaBtn" onclick="abrirFila()" aria-label="Fila" style="position:relative;display:none"><span data-ico="fila" style="display:grid"></span><span class="fila-n" id="remoteFilaN"></span></button>
    <button class="irbtn irpill" onclick="abrirIr()" aria-label="Abrir o controle da TV (infravermelho)" hidden>TV</button>
    <button class="ib" id="remoteSonoBtn" onclick="abrirSono()" aria-label="Dormir"></button>
    <button class="ib" onclick="remoteParar()" aria-label="Parar" data-ico="stop"></button>
  </div>
</div>

<script src="/js/util.js"></script>
<script src="/js/player-regras.js"></script>
<script src="/js/controle-tv.js"></script>
</body>
</html>
