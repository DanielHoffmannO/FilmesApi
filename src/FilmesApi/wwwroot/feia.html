<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Filmes (modo TV antiga)</title>
<style>
/* Sem flexbox, sem grid, sem media queries: so o que TV velha entende. */
* { margin: 0; padding: 0; }
html, body {
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  line-height: 1.4;
}
body { padding: 5%; }              /* margem de overscan pra nao cortar nas bordas */
h1 { font-size: 40px; margin-bottom: 20px; }
h2 {
  font-size: 30px;
  color: #aaa;
  margin: 30px 0 10px;
  border-bottom: 2px solid #333;
  padding-bottom: 6px;
}
a.item {
  display: block;
  color: #fff;
  text-decoration: none;
  padding: 14px 18px;
  border: 2px solid #333;
  margin-bottom: 8px;
  background: #111;
}
a.item:focus, a.item.sel {
  background: #e50914;
  border-color: #fff;
  outline: 0;
}
a.grp {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 30px;
  padding: 14px 18px;
  border: 2px solid #333;
  margin: 24px 0 8px;
  background: #1a1a1a;
}
a.grp:focus, a.grp.sel { background: #e50914; border-color: #fff; outline: 0; }
.eps { margin-left: 24px; }
.ano { color: #bbb; font-size: 22px; }
.visto { color: #2ecc40; font-size: 22px; }
#msg { color: #bbb; margin: 20px 0; }
#bar {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 2px solid #333;
}
#bar a {
  display: inline-block;
  color: #fff;
  text-decoration: none;
  padding: 10px 16px;
  border: 2px solid #333;
  background: #111;
  margin: 0 8px 8px 0;
}
#bar a.on { border-color: #e50914; color: #fff; }              /* filtro ativo */
#bar a:focus, #bar a.sel { background: #333; border-color: #fff; outline: 0; }  /* foco do controle */
#bar .lbl { color: #666; font-size: 18px; margin: 0 4px 0 10px; text-transform: uppercase; }
#bar .sep { color: #444; margin: 0 4px; }

/* player */
#player { display: none; }
#player.on {
  display: block;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  text-align: center;
  font-size: 0;              /* mata o respiro entre elementos inline */
  z-index: 100;
}
#player.on:before {          /* truque de centralizacao vertical pre-flexbox */
  content: '';
  display: inline-block;
  height: 100%;
  vertical-align: middle;
}
#list.hide { display: none; }
body.playing { padding: 0; }
body.playing > h1, body.playing #list { display: none; }
video { width: 100%; height: auto; background: #000; }
/* max-* + width/height:auto = ocupa a tela toda e, quando o formato nao bate
   (4:3 numa TV widescreen), sobra barra so nas laterais. Sem object-fit de
   proposito: TV antiga nao suporta e distorceria a imagem. */
#player.on video {
  width: auto; height: auto;
  max-width: 100%; max-height: 100%;
  vertical-align: middle;
}
#pmsg {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  margin: 0;
  padding: 10px 16px;
  font-size: 22px;
  color: #ddd;
  background: rgba(0,0,0,.6);
}
#pmsg:empty { display: none; }
#phint {
  position: absolute;
  top: 0; right: 0;
  padding: 6px 12px;
  font-size: 18px;
  color: #aaa;
  background: rgba(0,0,0,.5);
}
</style>
</head>
<body>

<h1>Filmes &mdash; modo TV antiga</h1>

<div id="list">
  <div id="bar">
    <span class="lbl">Tipo</span>
    <a href="#" data-fg="tipo" data-fv="all" class="on">Tudo</a>
    <a href="#" data-fg="tipo" data-fv="filme">Filmes</a>
    <a href="#" data-fg="tipo" data-fv="serie">Series</a>
    <span class="sep">|</span>
    <span class="lbl">Status</span>
    <a href="#" data-fg="visto" data-fv="all" class="on">Todos</a>
    <a href="#" data-fg="visto" data-fv="nao">Nao assistidos</a>
    <a href="#" data-fg="visto" data-fv="sim">Assistidos</a>
    <span class="sep">|</span>
    <a href="#" id="reload">Recarregar</a>
  </div>
  <div id="msg">Carregando...</div>
  <div id="grid"></div>
</div>

<div id="player">
  <video id="video" controls autoplay></video>
  <div id="pmsg"></div>
  <div id="phint">Voltar = volta pra lista</div>
</div>

<script>
/* ES5 puro, XMLHttpRequest, sem Promise. Feito pra navegador de smart TV antiga. */
(function () {
  var API = '/api/filmes';
  var filmes = [];
  var continuar = [];
  var filtroTipo = 'all';   // all | filme | serie
  var filtroVisto = 'all';  // all | sim | nao
  var links = [];      // itens navegaveis atuais
  var idx = 0;

  // continuar de onde parou
  var filmeAtual = null;
  var ultimoSalvo = 0;
  var posicaoRetomar = 0;
  var retomarTentativas = 0;

  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4) {
        if (x.status >= 200 && x.status < 300) {
          var d = null;
          try { d = JSON.parse(x.responseText); } catch (e) {}
          cb(null, d);
        } else {
          cb(x.status || 'erro', null);
        }
      }
    };
    x.send();
  }

  function send(method, url) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.send();
  }

  function esc(s) {
    s = String(s == null ? '' : s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function pastaDe(p) {
    if (!p) return 'Sem pasta';
    var parts = p.split('/');
    return parts.length > 1 ? parts.slice(0, -1).join('/') : 'Sem pasta';
  }

  function load() {
    document.getElementById('msg').style.display = 'block';
    document.getElementById('msg').innerHTML = 'Carregando...';
    get(API, function (err, data) {
      if (err) {
        document.getElementById('msg').innerHTML = 'Falha ao carregar (erro ' + err + ').';
        return;
      }
      filmes = data || [];
      get(API + '/continuar', function (e2, d2) {
        continuar = (!e2 && d2) ? d2 : [];
        render();
      });
    });
  }

  function formatarTempo(seg) {
    seg = Math.max(0, Math.round(seg || 0));
    var h = Math.floor(seg / 3600), m = Math.round((seg % 3600) / 60);
    return h ? (h + 'h ' + m + 'min') : (m + 'min');
  }

  function render() {
    var grid = document.getElementById('grid');
    var msg = document.getElementById('msg');
    var i, j, k;

    // classificacao filme/serie sai da lista COMPLETA: filtrar por "nao assistido"
    // nao pode rebaixar uma serie com 1 episodio pendente a "filme".
    var totalPorPasta = {};
    for (i = 0; i < filmes.length; i++) {
      var pt = pastaDe(filmes[i].arquivoPath);
      totalPorPasta[pt] = (totalPorPasta[pt] || 0) + 1;
    }
    function pastaEhSerie(p) { return p !== 'Sem pasta' && totalPorPasta[p] > 1; }
    function ehSerie(m) { return pastaEhSerie(pastaDe(m.arquivoPath)); }

    var list = [];
    for (i = 0; i < filmes.length; i++) {
      var f = filmes[i];
      if (filtroVisto === 'sim' && !f.assistido) continue;
      if (filtroVisto === 'nao' && f.assistido) continue;
      if (filtroTipo === 'filme' && ehSerie(f)) continue;
      if (filtroTipo === 'serie' && !ehSerie(f)) continue;
      list.push(f);
    }
    if (!list.length) {
      grid.innerHTML = '';
      msg.style.display = 'block';
      msg.innerHTML = filmes.length ? 'Nada nesse filtro.' : 'Nenhum filme. Rode o Scan no celular.';
      buildNav();
      return;
    }
    msg.style.display = 'none';

    // agrupa por pasta (so o que passou no filtro)
    var grupos = {};
    var ordem = [];
    for (i = 0; i < list.length; i++) {
      var pasta = pastaDe(list[i].arquivoPath);
      if (!grupos[pasta]) { grupos[pasta] = []; ordem.push(pasta); }
      grupos[pasta].push(list[i]);
    }
    ordem.sort();

    function itemHtml(m) {
      return '<a class="item" href="#" data-id="' + m.id + '">' +
             esc(m.titulo) +
             (m.anoLancamento ? ' <span class="ano">(' + m.anoLancamento + ')</span>' : '') +
             (m.assistido ? ' <span class="visto">&#10003; assistido</span>' : '') +
             '</a>';
    }

    var filmesSoltos = [];
    var seriesNomes = [];
    for (i = 0; i < ordem.length; i++) {
      var nm = ordem[i];
      if (pastaEhSerie(nm)) seriesNomes.push(nm);
      else for (k = 0; k < grupos[nm].length; k++) filmesSoltos.push(grupos[nm][k]);
    }
    filmesSoltos.sort(function (a, b) {
      var x = String(a.titulo).toLowerCase(), y = String(b.titulo).toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    });

    var html = '';
    if (filtroTipo === 'all' && filtroVisto === 'all' && continuar.length) {
      html += '<h2>Continuar assistindo</h2><div class="movies">';
      for (i = 0; i < continuar.length; i++) {
        var c = continuar[i];
        var pct = c.duracaoSegundos ? Math.round(100 * c.posicaoSegundos / c.duracaoSegundos) : 0;
        var nota = pct ? (pct + '%') : formatarTempo(c.posicaoSegundos);
        html += '<a class="item" href="#" data-id="' + c.id + '">' +
                esc(c.titulo) + ' <span class="ano">(' + nota + ')</span></a>';
      }
      html += '</div>';
    }
    if (filmesSoltos.length) {
      html += '<h2>Filmes (' + filmesSoltos.length + ')</h2><div class="movies">';
      for (i = 0; i < filmesSoltos.length; i++) html += itemHtml(filmesSoltos[i]);
      html += '</div>';
    }
    for (i = 0; i < seriesNomes.length; i++) {
      var nome = seriesNomes[i];
      var arr = grupos[nome];
      if (i === 0) html += '<h2>Series (' + seriesNomes.length + ')</h2>';
      var label = esc(nome) + ' (' + arr.length + (arr.length === 1 ? ' episodio)' : ' episodios)');
      html += '<a class="grp" href="#" data-g="' + i + '" data-label="' + label + '">&#9656; ' + label + '</a>';
      html += '<div class="eps" data-g="' + i + '" style="display:none">';
      for (j = 0; j < arr.length; j++) html += itemHtml(arr[j]);
      html += '</div>';
    }
    grid.innerHTML = html;
    buildNav();
  }

  function buildNav() {
    // ordem de navegacao: barra de filtros + cabecalhos de serie + itens visiveis
    var bar = document.getElementById('bar').getElementsByTagName('a');
    var grid = document.getElementById('grid');
    links = [];
    var i, j;
    for (i = 0; i < bar.length; i++) links.push(bar[i]);
    var nodes = grid.childNodes;
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType !== 1) continue;
      var c = n.className || '';
      if (c.indexOf('grp') !== -1) {
        links.push(n);
      } else if (c.indexOf('eps') !== -1) {
        if (n.style.display !== 'none') {
          var eps = n.getElementsByClassName('item');
          for (j = 0; j < eps.length; j++) links.push(eps[j]);
        }
      } else if (c.indexOf('movies') !== -1) {
        var mv = n.getElementsByClassName('item');
        for (j = 0; j < mv.length; j++) links.push(mv[j]);
      }
    }
    if (idx >= links.length) idx = links.length - 1;
    if (idx < 0) idx = 0;
    focar(idx);
  }

  function toggleGrp(el) {
    var g = el.getAttribute('data-g');
    var boxes = document.getElementById('grid').getElementsByClassName('eps');
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].getAttribute('data-g') === g) {
        var aberto = boxes[i].style.display !== 'none';
        boxes[i].style.display = aberto ? 'none' : 'block';
        el.innerHTML = (aberto ? '▸ ' : '▾ ') + el.getAttribute('data-label');
      }
    }
    buildNav();
  }

  function focar(n) {
    var i;
    for (i = 0; i < links.length; i++) links[i].className = links[i].className.replace(/ ?sel/, '');
    idx = Math.max(0, Math.min(n, links.length - 1));
    var el = links[idx];
    if (!el) return;
    el.className += ' sel';
    try { el.focus(); } catch (e) {}
    if (el.scrollIntoView) el.scrollIntoView();
  }

  function ativar(el) {
    if (!el) return;
    if (el.className && el.className.indexOf('grp') !== -1) { toggleGrp(el); return; }
    var fg = el.getAttribute('data-fg');
    if (fg) {
      var fv = el.getAttribute('data-fv');
      if (fg === 'tipo') filtroTipo = fv; else filtroVisto = fv;
      var bar = document.getElementById('bar').getElementsByTagName('a');
      for (var i = 0; i < bar.length; i++) {
        if (bar[i].getAttribute('data-fg') !== fg) continue;
        bar[i].className = bar[i].className.replace(/ ?on/, '');
        if (bar[i].getAttribute('data-fv') === fv) bar[i].className += ' on';
      }
      render();
      return;
    }
    if (el.id === 'reload') { load(); return; }
    var id = el.getAttribute('data-id');
    if (id) tocar(id);
  }

  // ---- player ----
  var pollTimer = null;

  function tocar(id) {
    salvarProgresso();  // se ja estava vendo outro, guarda onde parou
    document.getElementById('list').className = 'hide';
    document.getElementById('player').className = 'on';
    document.body.className = 'playing';
    var v = document.getElementById('video');
    var pmsg = document.getElementById('pmsg');
    pmsg.innerHTML = 'Preparando...';
    v.removeAttribute('src');

    filmeAtual = id;
    ultimoSalvo = 0;
    posicaoRetomar = 0;
    retomarTentativas = 0;

    // pega o ponto de retomada ANTES de setar o src (senao o loadedmetadata perde a corrida)
    get(API + '/' + id + '/progresso', function (err, d) {
      if (!err && d && d.posicaoSegundos) posicaoRetomar = d.posicaoSegundos;

      checar(id, function (status) {
        if (status === 'erro') { pmsg.innerHTML = 'Falha ao converter o video.'; return; }
        if (status === 'compativel') {
          v.src = API + '/' + id + '/stream';
        } else {
          // TV antiga nao roda HLS: serve o arquivo original e torce.
          v.src = API + '/' + id + '/original';
          pmsg.innerHTML = 'Enviando arquivo original (pode nao rodar em TV muito antiga). ' +
                           'Se travar, use o app do celular pra mandar pra TV.';
        }
        try { v.load(); v.play(); } catch (e) {}
        if (status === 'compativel') pmsg.innerHTML = '';
        // "assistido" fica por conta do backend quando a reproducao chega perto do fim.
      });
    });
  }

  // aplicar so no 'loadedmetadata' nao cola (o navegador volta pra 0 depois).
  // 'loadeddata'/'canplay'/'seeked' pegam, e re-tenta se o seek for revertido.
  function aplicarRetomada() {
    var v = document.getElementById('video');
    if (!(posicaoRetomar > 5)) return;
    var dur = v.duration;
    if (isFinite(dur) && posicaoRetomar >= dur - 5) { posicaoRetomar = 0; return; }
    if (Math.abs(v.currentTime - posicaoRetomar) <= 1.5) { posicaoRetomar = 0; return; }
    if (retomarTentativas++ > 4) { posicaoRetomar = 0; return; }
    try { v.currentTime = posicaoRetomar; } catch (e) {}
  }

  function configurarProgresso() {
    var v = document.getElementById('video');
    v.onloadeddata = aplicarRetomada;
    v.oncanplay = aplicarRetomada;
    v.onseeked = aplicarRetomada;
    v.ontimeupdate = function () {
      if (filmeAtual == null || v.paused) return;
      var t = (new Date()).getTime();
      if (t - ultimoSalvo < 10000) return;
      ultimoSalvo = t;
      salvarProgresso();
    };
    v.onpause = salvarProgresso;
    v.onended = function () {
      if (filmeAtual != null) send('DELETE', API + '/' + filmeAtual + '/progresso');
    };
  }

  function salvarProgresso() {
    var v = document.getElementById('video');
    if (filmeAtual == null || !(v.currentTime > 15)) return;
    var x = new XMLHttpRequest();
    x.open('PUT', API + '/' + filmeAtual + '/progresso', true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({
      posicao: v.currentTime,
      duracao: (isFinite(v.duration) && v.duration > 0) ? v.duration : null
    }));
  }

  function checar(id, cb) {
    get(API + '/' + id + '/stream-status', function (err, d) {
      if (err) { cb('erro'); return; }
      var s = d && d.status;
      if (s === 'preparando') {
        document.getElementById('pmsg').innerHTML = 'Preparando video, aguarde...';
        pollTimer = setTimeout(function () { checar(id, cb); }, 2000);
        return;
      }
      cb(s);
    });
  }

  function fecharPlayer() {
    salvarProgresso();
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
    var v = document.getElementById('video');
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    filmeAtual = null;
    document.getElementById('player').className = '';
    document.getElementById('list').className = '';
    document.body.className = '';
    load();
  }

  // ---- teclado / controle remoto ----
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode;
    var noPlayer = document.getElementById('player').className === 'on';

    // Voltar (varia por fabricante: 8, 27, 461, 10009, 166)
    if (k === 8 || k === 27 || k === 461 || k === 10009 || k === 166) {
      if (noPlayer) { fecharPlayer(); if (e.preventDefault) e.preventDefault(); return false; }
      return true;
    }
    if (noPlayer) return true; // no player deixa o controle nativo do <video> agir

    if (k === 38 || k === 37) { focar(idx - 1); if (e.preventDefault) e.preventDefault(); return false; } // cima / esquerda
    if (k === 40 || k === 39) { focar(idx + 1); if (e.preventDefault) e.preventDefault(); return false; } // baixo / direita
    if (k === 13 || k === 32) { ativar(links[idx]); if (e.preventDefault) e.preventDefault(); return false; } // OK
    return true;
  };

  // clique tambem funciona (mouse/touch de alguns controles)
  document.getElementById('grid').onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    while (t && t !== this && (!t.className ||
           (t.className.indexOf('item') === -1 && t.className.indexOf('grp') === -1))) t = t.parentNode;
    if (t && t !== this) { ativar(t); return false; }
  };
  document.getElementById('bar').onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    if (t && t.tagName === 'A') { ativar(t); return false; }
  };

  configurarProgresso();
  load();
})();
</script>
</body>
</html>
