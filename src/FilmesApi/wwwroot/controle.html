<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle da TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e50914' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='7' width='18' height='12' rx='2'/%3E%3Cpath d='M16 3l-4 4l-4-4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/base.css">
<style>
/* Visual próprio do controle (celular). css/base.css continua valendo pro index.html; aqui só se usam tokens e classes novas daqui
   (reset, body e .grupo.collapsed .grupo-body vêm do base.css). */
:root{--bg:#0d0d0d;--s1:#141414;--s2:#1b1b1b;--s3:#242424;--line:#262626;--txt:#ececec;--mut:#8b8b8b;--mut2:#5f5f5f;--acc:#e50914;--acc-soft:rgba(229,9,20,.14);--acc-txt:#ff7b82;--r:12px}
body{background:var(--bg);color:var(--txt);font-size:15px;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--remote-h, 0px) + 16px + env(safe-area-inset-bottom))}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
main{max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;max-width:640px;margin:0 auto}
.top h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mut);margin:-4px -6px -4px 0}
.ib:active{background:var(--s2)}
.seg{display:flex;margin:8px 20px 10px;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px;max-width:600px}
@media(min-width:680px){.seg{margin-left:auto;margin-right:auto;width:600px}}
.seg button{flex:1;padding:9px 0;font-size:13.5px;color:var(--mut);border-radius:8px;min-height:40px;transition:background .15s,color .15s}
.seg button.on{background:var(--s3);color:var(--txt);font-weight:550}
.sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);padding:16px 20px 6px;font-weight:600}
.msg{text-align:center;color:var(--mut);padding:60px 20px;font-size:14px}

/* continuar assistindo: cartões que rolam na horizontal */
.cont{display:flex;gap:10px;padding:0 20px 2px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:20px;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.card{flex:none;width:158px;scroll-snap-align:start;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:76px}
.card:active{background:var(--s2)}
.card b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--mut);font-size:12px;margin:2px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small:last-child{margin-bottom:0}
.fio{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}
.fio i{display:block;height:100%;background:var(--acc)}

/* série: uma linha; temporada aberta vira cartão */
.serie{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 20px;min-height:52px;cursor:pointer;user-select:none}
.serie .t{flex:1;min-width:0}
.serie .t b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.serie .t small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{color:var(--mut2);width:18px;height:18px;transition:transform .15s}
.grupo:not(.collapsed)>.serie .cv,.grupo:not(.collapsed)>.temp-hd .cv{transform:rotate(90deg)}
.tag{font-size:11.5px;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;white-space:nowrap}
.temp{margin:2px 20px 8px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.temp-hd{display:flex;align-items:center;gap:8px;padding:12px 14px;min-height:46px;cursor:pointer;user-select:none}
.temp-hd.fixo{cursor:default;padding-bottom:8px;min-height:0}
.temp-hd b{font-size:14px;font-weight:600}
.temp-hd small{color:var(--mut);font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:8px;padding:2px 14px 12px;flex-wrap:wrap}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);color:var(--mut);font-size:12.5px;transition:background .15s,border-color .15s,color .15s}
.pill::after{content:"";position:absolute;inset:-7px -2px}
.pill svg{width:15px;height:15px}
.pill[aria-checked=true]{background:var(--acc-soft);border-color:rgba(229,9,20,.45);color:var(--acc-txt)}
.ep{display:flex;align-items:center;gap:12px;padding:0 4px 0 14px;min-height:48px;border-top:1px solid var(--line);position:relative;cursor:pointer}
.ep .n{width:34px;flex:none;color:var(--mut2);font-size:12.5px;font-variant-numeric:tabular-nums}
.ep .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}
.ep.vi .t{color:var(--mut)}
.ep.tc{background:var(--acc-soft)}
.ep.tc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.ep.tc .t{color:#fff;font-weight:550}
.ep.tc .n{color:var(--acc-txt)}
.ep:active{background:var(--s2)}
.ep.tc:active{background:var(--acc-soft)}
.pl{color:var(--acc-txt);width:18px;height:18px}
.ck{width:44px;height:44px;display:grid;place-items:center;color:var(--mut2);flex:none;margin-right:2px}
.ck svg{width:19px;height:19px}
.ck:not(.on){color:#3a3a3a}
.ck.on{color:var(--mut)}
/* filme solto: título e ano (secundário) em duas linhas */
.filmes{margin:0 20px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.filmes .ep:first-child{border-top:0}
.ep.filme{min-height:56px}
.ep.filme .t{display:block}
.ep.filme .t b{display:block;font-weight:550;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.ep.filme.vi .t b{color:var(--mut)}
.ep.filme .t small{display:block;color:var(--mut);font-size:12.5px}

/* ─── barra de controle remoto ─── */
.remote{position:fixed;left:0;right:0;bottom:0;background:var(--bg-2);border-top:1px solid #222;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:8px;z-index:50}
.remote.active{display:flex}
.remote-l1{display:flex;align-items:baseline;gap:10px}
.remote .titulo{background:none;border:none;padding:0;text-align:left;font-size:12px;color:#ccc;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remote-time{font-size:11px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap}
.remote-prog{position:relative;height:8px;background:var(--border);border-radius:4px;cursor:pointer;overflow:hidden}
.remote-prog-fill{position:relative;height:100%;background:var(--accent);width:0;transition:width .3s linear}
.remote-prog .faixa{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.22);display:none}
.remote-prog .faixa.creditos{background:rgba(120,170,255,.3)}
.remote-l2{display:flex;align-items:center;gap:10px}
.remote-l2 button{flex:1}
.remote-l2 button.direita{flex:1}
.remote-l2 button.direita.vermelho{flex:2;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.remote-l3{display:flex;align-items:center;gap:10px}
.remote-l3 input[type=range]{flex:1;min-width:0}
.remote button{background:#222;color:#eee;border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:13px;cursor:pointer}
.remote button:active{background:#333}
.remote button:disabled{opacity:.35;cursor:default}
.remote button:disabled:active{background:#222}
.remote .titulo:active{background:none}
.remote-proximo{display:none;align-items:center;gap:10px;background:var(--bg-3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:12px;color:#ccc}
.remote-proximo.on{display:flex}
.remote-proximo span{flex:1;min-width:0}
.remote-proximo button{background:var(--accent);border-color:var(--accent);color:#fff;padding:6px 10px;font-size:12px;white-space:nowrap}

/* ─── folha "Idioma e legenda" (sobe de trás da barra) e avisos ─── */
.folha-scrim{position:fixed;inset:0;z-index:55}
.folha{position:fixed;left:0;right:0;bottom:var(--remote-h, 0px);z-index:56;background:var(--bg-2);border-top:1px solid #333;border-radius:12px 12px 0 0;padding:14px 16px;max-height:60vh;overflow:auto;box-shadow:0 -8px 24px rgba(0,0,0,.5)}
.folha[hidden],.folha-scrim[hidden]{display:none}
.folha-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;font-weight:600}
.folha-hd button,.opt,.sw,.chip,.toast button{background:#222;color:#eee;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px}
.folha-hd button{padding:4px 10px}
.folha h3{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px}
.opt.on{border-color:var(--accent);color:var(--accent)}
.folha .vazio{color:var(--muted);font-size:13px}
.usar-serie{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:12px;border-top:1px solid #222;font-size:13px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--remote-h, 0px) + 12px);z-index:60;background:#2a2a2a;border:1px solid #444;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.toast span{flex:1}
.toast button{padding:5px 10px}

/* ─── chips de padrão da série e interruptores por temporada ─── */
.chips{display:inline-flex;gap:6px;margin-left:auto}
.chip{padding:3px 8px;font-size:11px;color:var(--muted);min-height:28px;white-space:nowrap}
.chip.on{color:#ddd}
.sws{display:inline-flex;gap:6px;margin-left:auto}
.sw{min-width:36px;min-height:36px;padding:0 6px;font-size:15px;opacity:.55}
.sw.on{opacity:1;border-color:var(--accent);color:var(--accent)}
.serie-opcoes{display:flex;justify-content:flex-end;padding:4px 12px}
</style>
</head>
<body>

<div class="top">
  <h1>Controle da TV</h1>
  <a class="ib" href="/" aria-label="Lista completa" data-ico="grid"></a>
</div>

<main>
  <div class="seg" id="filters" role="tablist" aria-label="Tipo">
    <button class="on" data-filter="all" role="tab" aria-selected="true">Todos</button>
    <button data-filter="filme" role="tab" aria-selected="false">Filmes</button>
    <button data-filter="serie" role="tab" aria-selected="false">Séries</button>
  </div>
  <div id="msg" class="msg">Carregando…</div>
  <div id="grid"></div>
</main>

<div class="folha-scrim" id="folhaScrim" hidden onclick="fecharFolha()"></div>
<div class="folha" id="folha" hidden>
  <div class="folha-hd"><span id="folhaTitulo"></span><button onclick="fecharFolha()" aria-label="Fechar">✕</button></div>
  <div id="folhaCorpo"></div>
</div>

<div class="remote" id="remote">
  <div class="remote-l1">
    <button class="titulo" id="remoteTitulo" onclick="abrirFolhaAgora()" title="Idioma e legenda"></button>
    <span class="remote-time" id="remoteTime"></span>
  </div>
  <div class="remote-prog" id="remoteProg" onclick="remoteScrub(event)"><div class="faixa" id="remoteFaixaAbertura"></div><div class="faixa creditos" id="remoteFaixaCreditos"></div><div class="remote-prog-fill" id="remoteProgFill"></div></div>
  <div class="remote-proximo" id="remoteProximo">
    <span id="remoteProximoTxt"></span>
    <button onclick="remoteAceitarProximo()">▶ Assistir agora</button>
  </div>
  <div class="remote-l2">
    <button onclick="remoteSeek(-SEEK_STEP_S)">« 30s</button>
    <button onclick="remotePlayPause()" id="remotePlayPauseBtn">⏸</button>
    <button onclick="remoteDireita()" id="remoteDireitaBtn" class="direita">30s »</button>
  </div>
  <div class="remote-l3">
    <button onclick="remoteProximoEp()" id="remoteProximoEpBtn" title="Próximo episódio" style="display:none">⏭</button>
    <input type="range" id="remoteVolume" min="0" max="1" step="0.05" oninput="remoteVolume(this.value)" aria-label="Volume">
    <button onclick="remoteParar()" title="Parar" aria-label="Parar">⏹</button>
  </div>
</div>

<script src="/js/util.js"></script>
<script>
const API = '/api/filmes';
const PLAYER_API = '/api/player';

// ─── Configuração (valores antes soltos pelo código) ───────────────────────
const SEEK_STEP_S = 30;      // avanço/retrocesso dos botões «30s / 30s»
const POLL_ATIVO_MS = 1000;  // intervalo de poll de /player/state com algo tocando
const POLL_OCIOSO_MS = 3000; // intervalo de poll sem nada tocando (menos urgente)

let filtroTipo = 'all';         // all | filme | serie

// ─── Ícones (SVG inline, traço 1.8, currentColor): nada de emoji nem de fonte/CDN externa ───
const IC = {
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  caret: '<path d="M9 6l6 6l-6 6"/>',
  dots: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  check: '<path d="M5 12l5 5l10-10"/>',
  circle: '<circle cx="12" cy="12" r="8.5"/>',
  tv: '<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M16 3l-4 4l-4-4"/>',
  skip: '<path d="M5 5l8 7l-8 7z"/><path d="M13 5l8 7l-8 7z"/>',
  next: '<path d="M7 4v16l10-8z"/><path d="M20 5v14"/>',
};
const ico = (nome, cls) => `<svg viewBox="0 0 24 24" class="${cls || ''}" aria-hidden="true">${IC[nome]}</svg>`;
document.querySelectorAll('[data-ico]').forEach(el => { el.innerHTML = ico(el.dataset.ico); });

// Elementos consultados em 2+ lugares — pegos uma vez só.
const els = {
  remote: document.getElementById('remote'),
  remoteProximoEpBtn: document.getElementById('remoteProximoEpBtn'),
};

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button[data-filter]');
  if (!btn) return;
  document.querySelectorAll('#filters button').forEach(b => { b.classList.toggle('on', b === btn); b.setAttribute('aria-selected', b === btn); });
  filtroTipo = btn.dataset.filter;
  render();
});

// esc() e a sanfona das séries vêm de /js/util.js.

// "E02" (ou "E23-24" nos arquivos duplos) a partir do rótulo do servidor; sem SxxExx, o número do episódio.
function codigoEp(f) {
  const m = /E\d+(?:-E?\d+)?/i.exec(f.rotulo || '');
  return m ? m[0].toUpperCase() : (f.episodio != null ? 'E' + String(f.episodio).padStart(2, '0') : '');
}
const tocandoAgora = f => !!(ultimoEstadoRemoto && ultimoEstadoRemoto.filmeId === f.id);

// "marcar como assistido": área de toque de 44x44 (a linha inteira manda pra TV)
function ckHtml(f) {
  const rot = f.assistido ? 'Desmarcar como assistido' : 'Marcar como assistido';
  return `<button class="ck${f.assistido ? ' on' : ''}" aria-label="${rot}" aria-pressed="${!!f.assistido}" onclick="event.stopPropagation(); toggleAssistido(${f.id})">${ico(f.assistido ? 'check' : 'circle')}</button>`;
}

function linhaEp(f) {
  const tc = tocandoAgora(f);
  const titulo = f.tituloEpisodio || (f.episodio != null ? 'Episódio ' + f.episodio : f.titulo);
  return `<div class="ep${tc ? ' tc' : ''}${f.assistido ? ' vi' : ''}" onclick="enviarParaTv(${f.id})">
      <span class="n">${esc(codigoEp(f))}</span><span class="t">${esc(titulo)}</span>${tc ? ico('tv', 'pl') : ''}${ckHtml(f)}
    </div>`;
}

function linhaFilme(f) {
  const tc = tocandoAgora(f);
  return `<div class="ep filme${tc ? ' tc' : ''}${f.assistido ? ' vi' : ''}" onclick="enviarParaTv(${f.id})">
      <span class="t"><b>${esc(f.titulo)}</b>${f.anoLancamento ? `<small>${f.anoLancamento}</small>` : ''}</span>${tc ? ico('tv', 'pl') : ''}${ckHtml(f)}
    </div>`;
}

// Cartão do "Continuar assistindo": série (ou filme), "T4 · E22" e um fio vermelho de progresso quando há posição salva
function cartaoFila(i) {
  const f = i.filme;
  const ep = f.ehEpisodio ? (f.temporada != null ? 'T' + f.temporada + ' · ' : '') + codigoEp(f) : (f.anoLancamento || '');
  const sub = i.motivo === 'proximo' ? 'A seguir · ' + ep : ep;
  const pct = i.motivo !== 'proximo' && f.posicaoSegundos && f.duracaoSegundos ? Math.min(100, 100 * f.posicaoSegundos / f.duracaoSegundos) : 0;
  return `<button class="card" onclick="enviarParaTv(${f.id})"><b>${esc(f.ehEpisodio && f.serie ? f.serie : f.titulo)}</b><small>${esc(sub)}</small>` +
         (pct ? `<div class="fio"><i style="width:${pct.toFixed(0)}%"></i></div>` : '') + '</button>';
}

// ─── Série (linha) -> temporada (cartão) -> episódios. O estado aberto/fechado é o da sanfona do util.js (uma série e uma temporada por vez);
//     os .grupo[data-serie|data-temp] + .collapsed são o que aplicarSanfona()/cliqueSerie()/cliqueTemporada() do util.js manipulam. ───
function pilulasHtml(chave, n) {
  const p = (prefsTemporadas[chave] || {})[n] || {};
  const pil = (campo, icone, rotulo) =>
    `<button class="pill" role="switch" aria-checked="${!!p[campo]}" data-sw="${campo}" data-serie="${attr(chave)}" data-temp="${n}">${ico(icone)}${rotulo}</button>`;
  return `<div class="pills">${pil('pularAbertura', 'skip', 'Pular abertura')}${pil('proximoAutomatico', 'next', 'Próximo auto')}</div>`;
}

function tagPadraoHtml(chave) {
  const p = padroes[chave];
  if (!p) return '';
  const partes = [];
  if (p.audio) partes.push(p.audio.toUpperCase());
  if (p.legenda) partes.push('CC ' + (p.legenda === 'off' ? 'OFF' : p.legenda.toUpperCase()));
  return `<span class="tag" data-tag="${attr(chave)}">${partes.join(' · ')}</span>`;
}
function atualizarTags() {
  document.querySelectorAll('.grupo[data-serie]').forEach(g => {
    const chave = g.getAttribute('data-serie'), hd = g.querySelector(':scope > .serie');
    hd.querySelector('.tag')?.remove();
    const html = tagPadraoHtml(chave);
    if (html) hd.querySelector('[data-pref-serie]').insertAdjacentHTML('beforebegin', html);
  });
}

function serieHtmlControle(s) {
  const grupos = agruparPorTemporada(s.episodios);
  const aberta = serieEstaAberta(s.chave);
  const eps = contagemEpisodios(s.episodios.length);
  const sub = grupos ? `${grupos.length} temporadas · ${eps}` : eps;
  let corpo;
  if (!grupos) {   // uma temporada só (ou só "Especiais"/"Outros"): o cartão já vem aberto, sem o nível de temporada
    const t = s.episodios[0] && s.episodios[0].temporada;
    corpo = `<div class="temp"><div class="temp-hd fixo"><b>${t > 0 ? 'Temporada ' + t : 'Episódios'}</b><small>${eps}</small></div>` +
      (t > 0 ? pilulasHtml(s.chave, t) : '') + s.episodios.map(linhaEp).join('') + '</div>';
  } else {
    corpo = grupos.map(g => {
      const vistos = textoVistos(g.episodios);
      return `<div class="grupo temp${temporadaEstaAberta(g.chave) ? '' : ' collapsed'}" data-temp="${attr(g.chave)}">
        <div class="temp-hd" onclick="cliqueTemporada(this)">${ico('caret', 'cv')}<b>${esc(g.rotulo)}</b><small>${contagemEpisodios(g.episodios.length)}${vistos ? ' · ' + vistos : ''}</small></div>
        <div class="grupo-body">${g.numero > 0 ? pilulasHtml(s.chave, g.numero) : ''}${g.episodios.map(linhaEp).join('')}</div></div>`;
    }).join('');
  }
  return `<div class="grupo${aberta ? '' : ' collapsed'}" data-serie="${attr(s.chave)}">
    <div class="serie" onclick="cliqueSerie(this)">${ico('caret', 'cv')}
      <div class="t"><b>${esc(s.nome)}</b><small>${sub}</small></div>${tagPadraoHtml(s.chave)}
      <button class="ib" data-pref-serie="${attr(s.chave)}" aria-label="Idioma e legenda padrão de ${attr(s.nome)}">${ico('dots')}</button>
    </div>
    <div class="grupo-body">${corpo}</div></div>`;
}

async function toggleAssistido(id) {

// Filtro e agrupamento vêm prontos de /api/filmes/tela (mesma fonte do index.html e do
// tv.html) — esta tela só desenha. Sem filtro de "visto" nem busca aqui (essa tela é o
// controle remoto simplificado), então só manda o tipo.
async function render() {
  const grid = document.getElementById('grid');
  const msg = document.getElementById('msg');
  const params = new URLSearchParams({ tipo: filtroTipo, visto: 'all' });
  const [t, fila] = await Promise.all([
    fetchJsonOuNull(`${API}/tela?${params}`),
    filtroTipo === 'all' ? fetchJsonOuNull(`${API}/fila`) : null,
  ]);

  if (!t) { msg.style.display = 'block'; msg.textContent = 'Falha ao carregar a lista.'; return; }

  if (t.series.length) {
    [padroes, prefsTemporadas] = await Promise.all([
      fetchJsonOuNull('/api/series/padroes').then(m => m || {}),
      fetchJsonOuNull('/api/series/temporadas').then(m => m || {}),
    ]);
  }

  let html = '';
  if (fila && fila.length) {
    // "proximo": o episódio seguinte de uma série vista há pouco; o cartão mostra o nome da série porque está fora do grupo dela
    html += `<div class="sec">Continuar assistindo</div><div class="cont">${fila.map(cartaoFila).join('')}</div>`;
  }

  // Essa tela não distingue "pasta de filme+extras" de filme solto — lista tudo junto,
  // ordenado por título (o index.html completo é que mostra a separação por pasta).
  const soltos = [...t.filmesSoltos, ...t.pastasFilme.flatMap(p => p.itens)]
    .sort((a, b) => a.titulo.localeCompare(b.titulo));
  if (soltos.length) html += `<div class="sec">Filmes · ${soltos.length}</div><div class="filmes">${soltos.map(linhaFilme).join('')}</div>`;

  if (t.series.length) html += `<div class="sec">Séries · ${t.series.length}</div>` + t.series.map(serieHtmlControle).join('');

  msg.style.display = html ? 'none' : 'block';
  if (!html) msg.textContent = t.catalogoVazio ? 'Nenhum filme. Rode o Scan na lista completa.' : 'Nada nesse filtro.';
  grid.innerHTML = html;
}

// ─── Controle remoto (TV) — mesmo código que existia no index.html ────────
let ultimoEstadoRemoto = null;
let remoteTimer = null;
let filmeAtualRemoto = null;  // cache do filme tocando agora — só busca de novo quando muda

function mmss(s) {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
}

async function enviarParaTv(id) {
  // aquece o remux deste episódio e do seguinte sem esperar: a TV só pede quando carrega o vídeo
  fetch(`${API}/${id}/pre-aquecer`, { method: 'POST' }).catch(() => {});
  await fetch(`${PLAYER_API}/selecionar/${id}`, { method: 'POST' });

async function remoteSeek(delta) {

    method: 'POST', headers: { 'Content-Type': 'application/json' },

  });

async function remoteScrub(e) {
  const dur = (ultimoEstadoRemoto && ultimoEstadoRemoto.duracaoSegundos) || 0;
  const bar = document.getElementById('remoteProg').getBoundingClientRect();
  if (!dur || !bar.width) return;
  const frac = Math.max(0, Math.min(1, (e.clientX - bar.left) / bar.width));
  await fetch(`${PLAYER_API}/seek-abs`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pos: frac * dur })
  });
  pollRemote();
}

// Botão da direita da barra, contextual: "30s »" normalmente; "Pular abertura" (vermelho) dentro da abertura conhecida; "Próximo episódio"
// (vermelho) a partir do início dos créditos conhecidos, se há próximo. O servidor acha abertura e créditos em segundo plano (404 = ainda não achou).
let remoteAbertura = null;
let remoteCreditos = null;       // { inicioSegundos } ou null
let remoteTemProximo = false;
async function remoteCarregarAbertura(id) {
  remoteAbertura = await fetchJsonOuNull(`${API}/${id}/abertura`);
}
async function remoteCarregarCreditos(id) {
  remoteCreditos = await fetchJsonOuNull(`${API}/${id}/creditos`);
}
function dentroDaAbertura(pos) {
  const a = remoteAbertura;
  return !!a && pos >= a.inicioSegundos - 5 && pos < a.fimSegundos - 1;
}
function nosCreditos(pos) {
  return !!remoteCreditos && remoteTemProximo && pos >= remoteCreditos.inicioSegundos;
}
function pintarFaixa(id, ini, fim, dur) {
  const el = document.getElementById(id);
  el.style.display = ini != null && dur ? 'block' : 'none';
  if (ini != null && dur) { el.style.left = (100 * ini / dur) + '%'; el.style.width = (100 * (fim - ini) / dur) + '%'; }
}
function atualizarBotaoDireita(pos, dur) {
  const btn = document.getElementById('remoteDireitaBtn');
  const pular = dentroDaAbertura(pos), proximo = !pular && nosCreditos(pos);
  btn.classList.toggle('vermelho', pular || proximo);
  btn.textContent = pular ? '⏩ Pular abertura' : proximo ? '⏭ Próximo episódio' : '30s »';
  pintarFaixa('remoteFaixaAbertura', remoteAbertura && remoteAbertura.inicioSegundos, remoteAbertura && remoteAbertura.fimSegundos, dur);
  pintarFaixa('remoteFaixaCreditos', remoteCreditos && remoteCreditos.inicioSegundos, dur, dur);
}
function remoteDireita() {
  const pos = (ultimoEstadoRemoto && ultimoEstadoRemoto.posSegundos) || 0;
  if (dentroDaAbertura(pos)) return remotePularAbertura();
  if (nosCreditos(pos)) return remoteProximoEp();
  return remoteSeek(SEEK_STEP_S);
}
// O servidor pula (vai pro fim da abertura que ele conhece) e liga o pulo automático da temporada: o Daniel confirmou que ali é abertura.
async function remotePularAbertura() {
  const res = await fetch(`${PLAYER_API}/pular-abertura`, { method: 'POST' }).catch(() => null);
  if (!res || !res.ok) toast('Não achei a abertura deste episódio.');
  pollRemote();
}

    method: 'POST', headers: { 'Content-Type': 'application/json' },

// Botão manual "próximo episódio" — diferente da oferta automática (remoteAceitarProximo):
// pula na hora, sem esperar a TV chegar perto do fim e abrir a contagem regressiva sozinha.
// O servidor toca o próximo e, se foi apertado no fim do episódio, liga o próximo automático da temporada (e avisa).
async function remoteProximoEp() {

// Mostra o botão pra qualquer episódio, mas só habilita se REALMENTE existe um próximo --
// sem isso, no último episódio da série o botão ficava visível e clicável sem fazer nada
// (silencioso, parecia quebrado em vez de "já é o último").
async function atualizarBotaoProximoEp(filmeId) {
  const btn = els.remoteProximoEpBtn;
  if (!filmeAtualRemoto || !filmeAtualRemoto.ehEpisodio) { btn.style.display = 'none'; remoteTemProximo = false; return; }

    .then(r => r.status === 200 ? r.json() : null).catch(() => null);

// ─── Faixas do que está tocando e padrões por série ─────────────────────────
// Só recarrega quando pollRemote detecta troca de filme. `idx` de áudio é o GLOBAL do ffprobe (bate com -map);
// o de legenda é relativo. Trocar a dublagem manda a TV regerar o HLS/remux (não é instantâneo).
let remoteLegendas = [];
let remoteAudios = [];
let padroes = {};            // chave da série -> { audio, legenda }
let prefsTemporadas = {};    // chave da série -> { "1": { pularAbertura, proximoAutomatico } }

async function remoteCarregarLegendas(id) {

  catch { remoteLegendas = []; }

const NOME_IDIOMA = { por: 'Português', eng: 'Inglês', spa: 'Espanhol', fra: 'Francês', deu: 'Alemão', ita: 'Italiano', jpn: 'Japonês' };
const rotuloIdioma = (i, t) => nomeDoIdioma(i, t);

document.getElementById('grid').addEventListener('click', async e => {
  const chip = e.target.closest('[data-pref-serie]');
  if (chip) { e.stopPropagation(); abrirFolhaSerie(chip.dataset.prefSerie); return; }
  const sw = e.target.closest('.pill[data-sw]');
  if (!sw) return;
  e.stopPropagation();   // (captura) o clique não chega ao cabeçalho da série/temporada, que abriria/fecharia
  const { serie, temp, sw: campo } = sw.dataset;
  definirInterruptor(serie, temp, campo, sw.getAttribute('aria-checked') !== 'true');
}, true);

async function definirInterruptor(serie, temp, campo, novo) {
  const r = await fetch(`/api/series/${encodeURIComponent(serie)}/temporadas/${temp}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [campo]: novo })
  }).catch(() => null);
  if (!r || !r.ok) { toast('Não consegui salvar. Tente de novo.'); return false; }
  ((prefsTemporadas[serie] ||= {})[temp] ||= {})[campo] = novo;
  pintarInterruptores();
  return true;
}

function pintarInterruptores() {
  document.querySelectorAll('.pill[data-sw]').forEach(b => {
    b.setAttribute('aria-checked', !!(((prefsTemporadas[b.dataset.serie] || {})[b.dataset.temp] || {})[b.dataset.sw]));
  });
}

// O servidor liga sozinho (aprendeu com o pulo / botão Pular abertura): relê e repinta os interruptores.
async function recarregarInterruptores() {
  prefsTemporadas = (await fetchJsonOuNull('/api/series/temporadas')) || prefsTemporadas;
  pintarInterruptores();
}

// ─── avisos do servidor ("Abertura pulada · voltar", "Abertura aprendida… · desligar") ───
let ultimoAviso = null;   // null = ainda não vi o 1º estado (não mostra aviso velho ao abrir a página)
function tratarAviso(aviso) {
  if (ultimoAviso === null) { ultimoAviso = aviso ? aviso.versao : 0; return; }
  if (!aviso || aviso.versao <= ultimoAviso) return;
  ultimoAviso = aviso.versao;
  const f = filmeAtualRemoto, ab = ultimoEstadoRemoto && ultimoEstadoRemoto.abertura;
  const acoes = {
    voltar: ab && { rotulo: 'Voltar', fazer: () => fetch(`${PLAYER_API}/seek-abs`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pos: ab.inicio }) }).then(pollRemote) },
    desligar: f && f.serieChave && { rotulo: 'Desligar', fazer: () => definirInterruptor(f.serieChave, f.temporada, 'pularAbertura', false) },
    'desligar-proximo': f && f.serieChave && { rotulo: 'Desligar', fazer: () => definirInterruptor(f.serieChave, f.temporada, 'proximoAutomatico', false) },
    cancelar: { rotulo: 'Cancelar', fazer: () => fetch(`${PLAYER_API}/proximo-cancelar`, { method: 'POST' }).then(pollRemote) },
  };
  toast(aviso.texto, acoes[aviso.acao] || null);
  if (aviso.tipo === 'abertura' || aviso.tipo === 'proximo') recarregarInterruptores();
}

async function salvarPadrao(chave, tipo, valor) {   // tipo: 'audio' | 'legenda'
  const r = await fetch(`/api/series/${encodeURIComponent(chave)}/${tipo}`, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idioma: valor || null })
  }).catch(() => null);
  if (!r || !r.ok) { toast('Não consegui salvar o padrão da série.'); return false; }
  const p = padroes[chave] ||= {};
  if (valor) p[tipo] = valor; else delete p[tipo];
  if (!p.audio && !p.legenda) delete padroes[chave];
  atualizarTags();
  return true;
}

// Avisos curtos acima da barra (nada de confirm()/alert()).
let toastTimer = null;
function toast(texto, acao) {
  document.getElementById('toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.id = 'toast';
  el.innerHTML = `<span>${esc(texto)}</span>` + (acao ? `<button>${esc(acao.rotulo)}</button>` : '');
  if (acao) el.querySelector('button').onclick = () => { el.remove(); acao.fazer(); };
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 8000);
}

// ─── Folha "Idioma e legenda": abre ao tocar no título (o que está tocando) ou num chip da série (padrão) ───
let folha = null;   // { modo: 'agora' } | { modo: 'serie', chave, nome }
const folhaAberta = () => !document.getElementById('folha').hidden;

function abrirFolhaAgora() { if (!filmeAtualRemoto) return; folha = { modo: 'agora' }; mostrarFolha(); }
function abrirFolhaSerie(chave) {
  const nome = document.querySelector(`.grupo[data-serie="${CSS.escape(chave)}"] .serie b`)?.textContent?.trim() || 'série';
  folha = { modo: 'serie', chave, nome };
  mostrarFolha();
}
function mostrarFolha() {
  document.getElementById('folha').hidden = false;
  document.getElementById('folhaScrim').hidden = false;
  desenharFolha();
}
function fecharFolha() {
  document.getElementById('folha').hidden = true;
  document.getElementById('folhaScrim').hidden = true;
}

const opcao = (grupo, valor, rotulo, ligada) =>
  `<button class="opt${ligada ? ' on' : ''}" data-fo="${grupo}" data-v="${attr(String(valor))}">${esc(rotulo)}</button>`;

function desenharFolha() {
  const corpo = document.getElementById('folhaCorpo');
  const titulo = document.getElementById('folhaTitulo');
  if (folha.modo === 'serie') {
    const p = padroes[folha.chave] || {};
    titulo.textContent = 'Padrão · ' + folha.nome;
    corpo.innerHTML =
      '<h3>Áudio</h3><div class="opcoes">' +
        [['', 'Automático'], ['por', 'Português'], ['eng', 'Inglês']].map(([v, t]) => opcao('s-audio', v, t, (p.audio || '') === v)).join('') +
      '</div><h3>Legenda</h3><div class="opcoes">' +
        [['', 'Automática'], ['off', 'Desligada'], ['por', 'Português'], ['eng', 'Inglês']].map(([v, t]) => opcao('s-legenda', v, t, (p.legenda || '') === v)).join('') +
      '</div>';
    return;
  }

  const f = filmeAtualRemoto;
  titulo.textContent = 'Idioma e legenda';
  const legAtual = ultimoEstadoRemoto ? ultimoEstadoRemoto.legendaIdx : -1;
  let html = '<h3>Áudio</h3><div class="opcoes">' + (remoteAudios.length > 1
    ? remoteAudios.map(a => opcao('audio', a.idx, a.idioma ? rotuloIdioma(a.idioma) : (a.titulo || 'Faixa ' + a.idx), a.atual)).join('')
    : '<span class="vazio">Só uma faixa de áudio.</span>') + '</div>';
  html += '<h3>Legenda</h3><div class="opcoes">' + (remoteLegendas.length
    ? opcao('legenda', -1, 'Desligada', legAtual === -1) + remoteLegendas.map(l =>
        opcao('legenda', l.idx, l.idioma ? rotuloIdioma(l.idioma) + (l.titulo ? ' · ' + l.titulo : '') : (l.titulo || 'Faixa ' + l.idx), legAtual === l.idx)).join('')
    : '<span class="vazio">Este arquivo não tem legenda.</span>') + '</div>';
  if (f && f.ehEpisodio && f.serieChave) {
    const ligado = !!padroes[f.serieChave];
    html += `<div class="usar-serie"><span>Usar em toda a série</span><button class="opt${ligado ? ' on' : ''}" data-fo="usar-serie" data-v="${ligado ? 0 : 1}" aria-pressed="${ligado}">${ligado ? 'Ligado' : 'Desligado'}</button></div>`;
  }
  corpo.innerHTML = html;
}

// Grava, como padrão da série, o que está escolhido AGORA no que toca (áudio e legenda).
async function gravarEscolhaComoPadraoDaSerie() {
  const chave = filmeAtualRemoto && filmeAtualRemoto.serieChave;
  if (!chave) return;
  const audio = remoteAudios.find(a => a.atual);
  const legIdx = ultimoEstadoRemoto ? ultimoEstadoRemoto.legendaIdx : -1;
  const leg = remoteLegendas.find(l => l.idx === legIdx);
  if (audio && audio.idioma && NOME_IDIOMA[audio.idioma]) await salvarPadrao(chave, 'audio', audio.idioma);
  await salvarPadrao(chave, 'legenda', legIdx === -1 || !leg ? 'off' : (NOME_IDIOMA[leg.idioma] ? leg.idioma : null));
}

document.getElementById('folhaCorpo').addEventListener('click', async e => {
  const b = e.target.closest('.opt');
  if (!b) return;
  const { fo, v } = b.dataset;
  if (fo === 's-audio') await salvarPadrao(folha.chave, 'audio', v);
  else if (fo === 's-legenda') await salvarPadrao(folha.chave, 'legenda', v);
  else if (fo === 'audio') {
    const idx = Number(v);
    await fetch(`${PLAYER_API}/audio`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idx }) });
    remoteAudios = remoteAudios.map(a => ({ ...a, atual: a.idx === idx }));
    if (padroes[filmeAtualRemoto?.serieChave]) await gravarEscolhaComoPadraoDaSerie();
    pollRemote();
  } else if (fo === 'legenda') {
    const idx = Number(v);
    await fetch(`${PLAYER_API}/legenda`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ idx }) });
    if (ultimoEstadoRemoto) ultimoEstadoRemoto = { ...ultimoEstadoRemoto, legendaIdx: idx };
    if (padroes[filmeAtualRemoto?.serieChave]) await gravarEscolhaComoPadraoDaSerie();
    pollRemote();
  } else if (fo === 'usar-serie') {
    const chave = filmeAtualRemoto.serieChave;
    if (v === '1') await gravarEscolhaComoPadraoDaSerie();
    else { await salvarPadrao(chave, 'audio', null); await salvarPadrao(chave, 'legenda', null); }
  }
  desenharFolha();
});

// A barra muda de altura (botões, aviso de próximo): publica a altura real pra lista não ficar atrás dela.
new ResizeObserver(() => {
  document.documentElement.style.setProperty('--remote-h', (els.remote.classList.contains('active') ? els.remote.offsetHeight : 0) + 'px');
}).observe(els.remote);

async function pollRemote() {
  if (remoteTimer) { clearTimeout(remoteTimer); remoteTimer = null; }
  try {
    const res = await fetch(`${PLAYER_API}/state`);
    const estado = await res.json();
    const estadoAnterior = ultimoEstadoRemoto;
    const trocouFilme = !estadoAnterior || estadoAnterior.filmeId !== estado.filmeId;
    ultimoEstadoRemoto = estado;
    tratarAviso(estado.aviso);

    const bar = els.remote;
    if (estado.filmeId === null) {
      bar.classList.remove('active');
      filmeAtualRemoto = null;
      els.remoteProximoEpBtn.style.display = 'none';
      remoteAbertura = null; remoteCreditos = null; remoteTemProximo = false;
      document.getElementById('remoteFaixaCreditos').style.display = 'none';
      document.getElementById('remoteDireitaBtn').classList.remove('vermelho');
      document.getElementById('remoteDireitaBtn').textContent = '30s »';
      document.getElementById('remoteFaixaAbertura').style.display = 'none';
      fecharFolha();
      // Só re-renderiza se realmente parou de tocar algo (transição real) -- no primeiro poll
      // da página (estadoAnterior undefined) "nada tocando" já é exatamente o que o render()
      // inicial (linha ~303) desenhou, então um 2º fetch de /tela aqui seria só desperdício.
      if (estadoAnterior && estadoAnterior.filmeId !== null) render();
    } else {
      bar.classList.add('active');
      if (trocouFilme) {
        remoteCarregarLegendas(estado.filmeId);
        remoteCarregarAudios(estado.filmeId);
        remoteAbertura = null; remoteCreditos = null; remoteTemProximo = false;
        remoteCarregarAbertura(estado.filmeId);
        remoteCarregarCreditos(estado.filmeId);
        filmeAtualRemoto = await fetchJsonOuNull(`${API}/${estado.filmeId}`);
        atualizarBotaoProximoEp(estado.filmeId);
      }
      const f = filmeAtualRemoto;
      document.getElementById('remoteTitulo').textContent = (f ? `📺 ${rotuloComTitulo(f) || f.titulo}` : '📺 Reproduzindo…') + ' ▾';
      document.getElementById('remotePlayPauseBtn').textContent = estado.playing ? '⏸' : '▶';
      document.getElementById('remoteVolume').value = estado.volume;
      const pos = estado.posSegundos || 0, dur = estado.duracaoSegundos || 0;
      document.getElementById('remoteProgFill').style.width = dur ? Math.min(100, 100 * pos / dur) + '%' : '0';
      document.getElementById('remoteTime').textContent = dur ? `${mmss(pos)} / ${mmss(dur)}` : (pos ? mmss(pos) : '');
      atualizarBotaoDireita(pos, dur);
      if (trocouFilme) render();
    }
    const proxBox = document.getElementById('remoteProximo');
    proxBox.classList.toggle('on', estado.proximoFilmeId != null);
    if (estado.proximoFilmeId != null) document.getElementById('remoteProximoTxt').textContent = 'Próximo: ' + (estado.proximoRotulo || '');
  } catch { /* ignora falha pontual de rede */ }
  finally {
    const ativo = els.remote.classList.contains('active');
    remoteTimer = setTimeout(pollRemote, ativo ? POLL_ATIVO_MS : POLL_OCIOSO_MS);
  }
}

render();
pollRemote();
</script>
</body>
</html>
