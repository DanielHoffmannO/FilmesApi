<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle da TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📱%3C/text%3E%3C/svg%3E">
<style>
/* Mesmo visual do index.html (celular/desktop) — só a lista principal some daqui,
   fica só "achar o filme e mandar pra TV" + o controle remoto embaixo. */
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;min-height:100vh;padding-bottom:96px}
header{background:#111;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
h1{font-size:20px;font-weight:600}
header a{color:#888;text-decoration:none;font-size:13px}
header a:hover{color:#fff}
main{padding:16px 24px;max-width:640px;margin:0 auto}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filter-btn{background:none;border:1px solid #333;color:#888;padding:6px 12px;border-radius:20px;font-size:12px}
.filter-btn.active{border-color:#e50914;color:#fff}
.secao-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;padding:0 12px}
#grid{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;position:relative}
.row.tocando{background:#181818}
.row .rtit{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.row .rano{font-size:12px;color:#777;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .badge{font-size:11px;color:#888;border:1px solid #333;border-radius:3px;padding:1px 7px;white-space:nowrap;user-select:none}
.row .badge:active{border-color:#666;color:#ccc}
.row .badge.on{background:#2ecc40;color:#000;border-color:#2ecc40}
.row.assistido .rtit{color:#8a8a8a}
.row .rprog{position:absolute;left:12px;right:12px;bottom:1px;height:2px;background:#2a2a2a;border-radius:1px;overflow:hidden}
.row .rprog>div{height:100%;background:#e50914}
.cast-btn{background:none;border:none;color:#666;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.cast-btn:active{color:#fff}
.grupo.collapsed .grupo-body{display:none}
.grupo-hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;font-size:14px;font-weight:600;color:#ddd;margin:14px 0 2px;cursor:pointer;user-select:none}
.grupo-hd .caret{display:inline-block;width:12px;color:#888;font-size:11px}
.grupo-hd .count{font-size:12px;color:#666;font-weight:400}
.grupo-body{padding-left:12px}
.msg{text-align:center;color:#777;padding:60px 20px;font-size:15px}

/* ─── barra de controle remoto — igual à que existia no index.html ─── */
.remote{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #222;padding:10px 16px;display:none;flex-direction:column;gap:8px;z-index:50}
.remote.active{display:flex}
.remote-l1{display:flex;align-items:baseline;gap:10px}
.remote .titulo{font-size:12px;color:#ccc;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remote-time{font-size:11px;color:#aaa;font-variant-numeric:tabular-nums;white-space:nowrap}
.remote-prog{height:8px;background:#333;border-radius:4px;cursor:pointer;overflow:hidden}
.remote-prog-fill{height:100%;background:#e50914;width:0;transition:width .3s linear}
.remote-l2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.remote button{background:#222;color:#eee;border:1px solid #333;border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
.remote button:active{background:#333}
.remote button.on{border-color:#e50914;color:#e50914}
.remote input[type=range]{width:100px}
.remote-proximo{display:none;align-items:center;gap:10px;background:#181818;border:1px solid #333;border-radius:6px;padding:8px 10px;font-size:12px;color:#ccc}
.remote-proximo.on{display:flex}
.remote-proximo span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.remote-proximo button{background:#e50914;border-color:#e50914;color:#fff;padding:6px 10px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>

<header>
  <h1>📱 Controle da TV</h1>
  <a href="/">🎬 Lista completa</a>
</header>

<main>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="filme">🎬 Filmes</button>
    <button class="filter-btn" data-filter="serie">📺 Séries</button>
  </div>
  <div id="msg" class="msg">Carregando…</div>
  <div id="grid"></div>
</main>

<div class="remote" id="remote">
  <div class="remote-l1">
    <span class="titulo" id="remoteTitulo"></span>
    <span class="remote-time" id="remoteTime"></span>
  </div>
  <div class="remote-prog" id="remoteProg" onclick="remoteScrub(event)"><div class="remote-prog-fill" id="remoteProgFill"></div></div>
  <div class="remote-proximo" id="remoteProximo">
    <span id="remoteProximoTxt"></span>
    <button onclick="remoteAceitarProximo()">▶ Assistir agora</button>
  </div>
  <div class="remote-l2">
    <button onclick="remoteSeek(-10)">« 10s</button>
    <button onclick="remotePlayPause()" id="remotePlayPauseBtn">⏸</button>
    <button onclick="remoteSeek(10)">10s »</button>
    <button onclick="remoteCC()" id="remoteCCBtn" style="display:none">CC</button>
    <input type="range" id="remoteVolume" min="0" max="1" step="0.05" oninput="remoteVolume(this.value)">
    <button onclick="remoteParar()">⏹ Parar</button>
  </div>
</div>

<script src="/js/util.js"></script>
<script>
const API = '/api/filmes';
const PLAYER_API = '/api/player';
let temFilmes = false;   // só pra decidir a mensagem "nenhum filme" x "nada nesse filtro"
let filtroTipo = 'all';         // all | filme | serie
const foldersAbertos = new Set();  // séries expandidas — fecham por padrão, sobrevive ao re-render

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filtroTipo = btn.dataset.filter;
  render();
});

// esc()/toggleGrupo() vêm de /js/util.js.

async function carregar() {
  const msg = document.getElementById('msg');
  try {
    const todos = await fetch(API).then(r => r.json());
    temFilmes = todos.length > 0;
    await render();
  } catch {
    msg.style.display = 'block';
    msg.textContent = 'Falha ao carregar a lista.';
  }
}

function rowHtml(f, rotulo) {
  const tocando = ultimoEstadoRemoto && ultimoEstadoRemoto.filmeId === f.id;
  return `<div class="row${tocando ? ' tocando' : ''}${f.assistido ? ' assistido' : ''}" onclick="enviarParaTv(${f.id})">
      <span class="rtit">${esc(rotulo || f.titulo)}</span>
      ${!rotulo && f.anoLancamento ? `<span class="rano">${f.anoLancamento}</span>` : ''}
      <span class="badge ${f.assistido ? 'on' : ''}" onclick="event.stopPropagation(); toggleAssistido(${f.id})">${f.assistido ? '✓ assistido' : 'marcar'}</span>
      <button class="cast-btn" title="Enviar para a TV" onclick="event.stopPropagation(); enviarParaTv(${f.id})">📺</button>
    </div>`;
}

async function toggleAssistido(id) {
  await fetch(`${API}/${id}/assistido`, { method: 'PUT' });
  render();  // re-busca já refletindo a mudança — sem cache local pra remendar
}

// Filtro e agrupamento vêm prontos de /api/filmes/tela (mesma fonte do index.html e do
// tv.html) — esta tela só desenha. Sem filtro de "visto" nem busca aqui (essa tela é o
// controle remoto simplificado), então só manda o tipo.
async function render() {
  const grid = document.getElementById('grid');
  const msg = document.getElementById('msg');
  const params = new URLSearchParams({ tipo: filtroTipo, visto: 'all' });
  const t = await fetch(`${API}/tela?${params}`).then(r => r.ok ? r.json() : null).catch(() => null);

  if (!t) { msg.style.display = 'block'; msg.textContent = 'Falha ao carregar a lista.'; return; }

  let html = '';
  if (t.continuarAssistindo.length) {
    html += '<div class="secao-title">Continuar assistindo</div>';
    for (const c of t.continuarAssistindo) html += rowHtml(c);
  }

  // Essa tela não distingue "pasta de filme+extras" de filme solto — lista tudo junto,
  // ordenado por título (o index.html completo é que mostra a separação por pasta).
  const soltos = [...t.filmesSoltos, ...t.pastasFilme.flatMap(p => p.itens)]
    .sort((a, b) => a.titulo.localeCompare(b.titulo));
  if (soltos.length) {
    html += '<div class="secao-title">Filmes (' + soltos.length + ')</div>';
    for (const f of soltos) html += rowHtml(f);
  }

  for (const s of t.series) {
    const aberto = foldersAbertos.has(s.chave);
    html += `<div class="grupo ${aberto ? '' : 'collapsed'}" data-key="${esc(s.chave)}">
      <div class="grupo-hd" onclick="toggleGrupo(this, foldersAbertos)"><span class="caret">${aberto ? '▾' : '▸'}</span>${esc(s.nome)} <span class="count">(${s.episodios.length} ${s.episodios.length === 1 ? 'episódio' : 'episódios'})</span></div>
      <div class="grupo-body">${s.episodios.map(ep => rowHtml(ep, ep.rotulo)).join('')}</div>
    </div>`;
  }

  msg.style.display = html ? 'none' : 'block';
  msg.textContent = temFilmes ? 'Nada nesse filtro.' : 'Nenhum filme. Rode o Scan na lista completa.';
  grid.innerHTML = html;
}

// ─── Controle remoto (TV) — mesmo código que existia no index.html ────────
let ultimoEstadoRemoto = null;
let remoteTimer = null;
let filmeAtualRemoto = null;  // cache do filme tocando agora — só busca de novo quando muda

function mmss(s) {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
}

async function enviarParaTv(id) {
  await fetch(`${PLAYER_API}/selecionar/${id}`, { method: 'POST' });
  pollRemote();
}

async function remotePlayPause() {
  await fetch(`${PLAYER_API}/play-pause`, { method: 'POST' });
  pollRemote();
}

async function remoteSeek(delta) {
  await fetch(`${PLAYER_API}/seek`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ delta })
  });
  pollRemote();
}

async function remoteScrub(e) {
  const dur = (ultimoEstadoRemoto && ultimoEstadoRemoto.duracaoSegundos) || 0;
  const bar = document.getElementById('remoteProg').getBoundingClientRect();
  if (!dur || !bar.width) return;
  const frac = Math.max(0, Math.min(1, (e.clientX - bar.left) / bar.width));
  await fetch(`${PLAYER_API}/seek-abs`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pos: frac * dur })
  });
  pollRemote();
}

async function remoteVolume(valor) {
  await fetch(`${PLAYER_API}/volume`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ valor: Number(valor) })
  });
}

async function remoteParar() {
  await fetch(`${PLAYER_API}/parar`, { method: 'POST' });
  pollRemote();
}

// A TV mesma oferece o próximo episódio (com contagem regressiva) ao terminar um — isso só
// confirma antes da hora, pelo mesmo caminho que o OK local do D-pad usaria.
async function remoteAceitarProximo() {
  await fetch(`${PLAYER_API}/proximo-aceita`, { method: 'POST' });
  pollRemote();
}

// CC: cicla entre desligado → faixa 0 → faixa 1 → … → desligado, mandando pra TV.
let remoteLegendas = [], remoteLegendasDe = null;
async function remoteCarregarLegendas(id) {
  if (remoteLegendasDe === id) return;
  remoteLegendasDe = id;
  try { remoteLegendas = (await fetch(`${API}/${id}/legendas`).then(r => r.json())).filter(x => x.convertivel); }
  catch { remoteLegendas = []; }
  document.getElementById('remoteCCBtn').style.display = remoteLegendas.length ? '' : 'none';
}
async function remoteCC() {
  if (!remoteLegendas.length) return;
  const atual = (ultimoEstadoRemoto && ultimoEstadoRemoto.legendaIdx);
  const idxAtual = remoteLegendas.findIndex(x => x.idx === atual);
  const prox = idxAtual + 1 >= remoteLegendas.length ? -1 : remoteLegendas[idxAtual + 1].idx;
  await fetch(`${PLAYER_API}/legenda`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ idx: prox })
  });
  pollRemote();
}

async function pollRemote() {
  if (remoteTimer) { clearTimeout(remoteTimer); remoteTimer = null; }
  try {
    const res = await fetch(`${PLAYER_API}/state`);
    const estado = await res.json();
    const trocouFilme = !ultimoEstadoRemoto || ultimoEstadoRemoto.filmeId !== estado.filmeId;
    ultimoEstadoRemoto = estado;

    const bar = document.getElementById('remote');
    if (estado.filmeId === null) {
      bar.classList.remove('active');
      remoteLegendasDe = null;
      filmeAtualRemoto = null;
      document.getElementById('remoteCCBtn').style.display = 'none';
      if (trocouFilme) render();
    } else {
      bar.classList.add('active');
      remoteCarregarLegendas(estado.filmeId);
      if (trocouFilme) {
        filmeAtualRemoto = await fetch(`${API}/${estado.filmeId}`).then(r => r.ok ? r.json() : null).catch(() => null);
      }
      const f = filmeAtualRemoto;
      document.getElementById('remoteTitulo').textContent = f ? `📺 ${f.rotulo || f.titulo}` : '📺 Reproduzindo…';
      document.getElementById('remotePlayPauseBtn').textContent = estado.playing ? '⏸' : '▶';
      document.getElementById('remoteVolume').value = estado.volume;
      const pos = estado.posSegundos || 0, dur = estado.duracaoSegundos || 0;
      document.getElementById('remoteProgFill').style.width = dur ? Math.min(100, 100 * pos / dur) + '%' : '0';
      document.getElementById('remoteTime').textContent = dur ? `${mmss(pos)} / ${mmss(dur)}` : (pos ? mmss(pos) : '');
      if (trocouFilme) render();
    }
    const proxBox = document.getElementById('remoteProximo');
    proxBox.classList.toggle('on', estado.proximoFilmeId != null);
    if (estado.proximoFilmeId != null) document.getElementById('remoteProximoTxt').textContent = 'Próximo: ' + (estado.proximoRotulo || '');
  } catch { /* ignora falha pontual de rede */ }
  finally {
    const ativo = document.getElementById('remote').classList.contains('active');
    remoteTimer = setTimeout(pollRemote, ativo ? 1000 : 3000);
  }
}

carregar();
pollRemote();
</script>
</body>
</html>
