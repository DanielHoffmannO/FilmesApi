<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Filmes — TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<style>
/* Sem flexbox, sem grid, sem media queries: so o que TV velha entende. */
* { margin: 0; padding: 0; }
html, body {
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  line-height: 1.4;
}
body { padding: 5%; }              /* margem de overscan pra nao cortar nas bordas */
h1 { font-size: 40px; margin-bottom: 20px; }
h2 {
  font-size: 30px;
  color: #aaa;
  margin: 30px 0 10px;
  border-bottom: 2px solid #333;
  padding-bottom: 6px;
}
a.item {
  display: block;
  color: #fff;
  text-decoration: none;
  padding: 14px 18px;
  border: 2px solid #333;
  margin-bottom: 8px;
  background: #111;
}
a.item:focus, a.item.sel {
  background: #e50914;
  border-color: #fff;
  outline: 0;
}
a.grp {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 30px;
  padding: 14px 18px;
  border: 2px solid #333;
  margin: 24px 0 8px;
  background: #1a1a1a;
}
a.grp:focus, a.grp.sel { background: #e50914; border-color: #fff; outline: 0; }
.eps { margin-left: 24px; }
.ano { color: #bbb; font-size: 22px; }
.visto { color: #2ecc40; font-size: 22px; }
#msg { color: #bbb; margin: 20px 0; }
#bar {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 2px solid #333;
}
#bar a {
  display: inline-block;
  color: #fff;
  text-decoration: none;
  padding: 10px 16px;
  border: 2px solid #333;
  background: #111;
  margin: 0 8px 8px 0;
}
#bar a.on { border-color: #e50914; color: #fff; }              /* filtro ativo */
#bar a:focus, #bar a.sel { background: #333; border-color: #fff; outline: 0; }  /* foco do controle */
#bar .lbl { color: #666; font-size: 18px; margin: 0 4px 0 10px; text-transform: uppercase; }
#bar .sep { color: #444; margin: 0 4px; }

/* player */
#player { display: none; }
#player.on {
  display: block;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  z-index: 100;
}
#list.hide { display: none; }
body.playing { padding: 0; }
body.playing > h1, body.playing #list { display: none; }
video { width: 100%; height: auto; background: #000; }
/* Centralizacao com position:absolute + margin:auto: funciona em TV antiga
   (nao depende de flexbox) e nao mexe no font-size do <video> — se mexer, os
   controles nativos (play/pause/tela cheia) somem em WebKit velho.
   max-* + width/height:auto = preenche a tela e sobra barra so nas laterais
   quando o formato nao bate. Sem object-fit: TV antiga distorceria a imagem. */
#player.on video {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  margin: auto;
  width: auto; height: auto;
  max-width: 100%; max-height: 100%;
}
/* aviso/erro no TOPO — nunca em cima da barra de controle do <video> (que fica embaixo) */
#pmsg {
  position: absolute;
  top: 0; left: 0; right: 0;
  margin: 0;
  padding: 10px 16px;
  font-size: 22px;
  text-align: center;
  color: #ddd;
  background: rgba(0,0,0,.7);
  z-index: 2;
}
#pmsg:empty { display: none; }
/* legenda desenhada por nos (nao pelo <track> nativo, que muita TV nao renderiza) */
#psub {
  position: absolute;
  left: 0; right: 0; bottom: 12%;
  padding: 0 8%;
  text-align: center;
  font-size: 34px;
  line-height: 1.25;
  color: #fff;
  text-shadow: 0 0 4px #000, 0 0 4px #000, 2px 2px 3px #000;
  z-index: 1;
}
#psub:empty { display: none; }
#phint {
  position: absolute;
  top: 0; right: 0;
  padding: 6px 12px;
  font-size: 18px;
  color: #aaa;
  background: rgba(0,0,0,.5);
  z-index: 3;
}
</style>
</head>
<body>

<h1>&#128250; Filmes</h1>

<div id="list">
  <div id="bar">
    <span class="lbl">Tipo</span>
    <a href="#" data-fg="tipo" data-fv="all" class="on">Tudo</a>
    <a href="#" data-fg="tipo" data-fv="filme">Filmes</a>
    <a href="#" data-fg="tipo" data-fv="serie">Series</a>
    <span class="sep">|</span>
    <a href="#" id="reload">Recarregar</a>
  </div>
  <div id="msg">Carregando...</div>
  <div id="grid"></div>
</div>

<div id="player">
  <video id="video" controls controlsList="nofullscreen" autoplay></video>
  <div id="psub"></div>
  <div id="pmsg"></div>
  <div id="phint">&#8592; &#8594; 15s &middot; OK pausa &middot; Vermelho = legenda &middot; &#8593; tela cheia &middot; Voltar = lista</div>
</div>

<script src="/vendor/hls.min.js"></script>
<script src="/js/util.js"></script>

<script>
/* ES5 puro, XMLHttpRequest, sem Promise. Feito pra navegador de smart TV antiga.
   Excecao: se a TV aguentar MediaSource (window.Hls carregou e Hls.isSupported()),
   usamos hls.js pra sempre ter audio AAC transcodificado — o <video> nativo de
   muita TV nao decodifica EAC3/DTS, so o passthrough de /original nao basta. */
(function () {
  var API = '/api/filmes';
  var PLAYER = '/api/player';
  var estadoRemotoAnterior = null;
  var hls = null;
  var pollTimer = null;
  var hlsRetries = 0;
  var hlsWatchdog = null;
  var filtroTipo = 'all';   // all | filme | serie
  var links = [];      // itens navegaveis atuais
  var idx = 0;
  var gruposAbertos = {};  // series/pastas expandidas — sobrevive ao re-render

  // continuar de onde parou
  var filmeAtual = null;
  var ultimoSalvo = 0;
  var posicaoRetomar = 0;
  var retomarTentativas = 0;
  // video.duration so e confiavel fora do HLS (stream/remux/original ja sao arquivo completo
  // com Content-Length; HLS cresce enquanto converte). Sem essa guarda, salvarProgresso manda
  // uma duracao pequena de mais durante a conversao e o backend marca "assistido" na marra —
  // mesmo bug que ja existia no index.html antes de duracaoConfiavel existir la.
  var duracaoConfiavel = false;
  var reproducaoConcluida = false;  // apos 'ended', nao deixa um save tardio recriar a retomada
  var proximoPendente = null;       // proximo episodio oferecido apos o 'ended'
  var proximoTimer = null;
  var proximoOfertaId = 0;          // token: só a resposta da última ofereceProximo conta

  // ─── Configuração (valores antes soltos pelo código, alguns repetidos em mais de um
  // lugar com o mesmo literal significando coisas diferentes — ex.: dois "1500" e dois "12") ──
  var RETOMAR_MIN_SEGUNDOS = 5;      // abaixo disso não vale a pena retomar do meio
  var RETOMAR_MARGEM_FIM_S = 5;      // dentro desses últimos segundos do fim, considera "já terminou" (não retoma)
  var RETOMAR_TOLERANCIA_S = 1.5;    // diferença aceitável entre currentTime e a retomada aplicada
  var MAX_RETOMAR_TENTATIVAS = 4;    // desiste de tentar re-aplicar o seek de retomada
  var MAX_HLS_RETRIES = 3;           // reconexões automáticas em erro de rede do hls.js
  var HLS_RETRY_DELAY_MS = 1500;     // espera antes de cada reconexão do hls.js
  var WATCHDOG_HLS_MS = 15000;       // hls.js anexado sem dado nenhum até cair pro arquivo direto
  var POLL_STATUS_MS = 1500;         // intervalo de poll de /stream-status enquanto prepara o HLS
  var POLL_REMUX_MS = 2000;          // intervalo de poll de /remux-status
  var POLL_REMOTO_MS = 1500;         // intervalo de poll de /player/state (comandos do celular)
  var MAX_FALHAS_POLL = 12;          // falhas de rede seguidas no poll até desistir com "erro"
  var PROXIMO_COUNTDOWN_S = 12;      // contagem regressiva antes de tocar o próximo episódio sozinho
  var AUTOSAVE_THROTTLE_MS = 10000;  // intervalo mínimo entre saves automáticos de progresso
  var KEEPALIVE_MS = 20000;          // intervalo do aviso "ainda tem alguém aqui" pro transcode
  var POSICAO_REPORT_MS = 2000;      // intervalo do report de posição pro controle.html
  var SEEK_STEP_S = 15;              // avanço/retrocesso das setas esquerda/direita durante o filme
  var AVISO_ORIGINAL_MS = 8000;      // quanto tempo o aviso "arquivo original" fica na tela
  var DICA_CONTROLES_MS = 7000;      // quanto tempo a dica dos controles fica visível sobre o vídeo
  var LEGENDA_TIMEOUT_MS = 20000;    // 1a conversao de legenda no servidor pode demorar alguns segundos
  var LEGENDA_MSG_MS = 3000;         // quanto tempo o aviso "Legenda: on/off" fica na tela
  var PLAY_PAUSE_RACE_MS = 80;       // espera pra corrigir corrida com o play/pause nativo do <video>

  // Elementos consultados em 2+ lugares (funções diferentes) — pegos uma vez só. phint só
  // aparece 1x no código e fica com getElementById direto ali mesmo.
  var els = {
    video: document.getElementById('video'),
    pmsg: document.getElementById('pmsg'),
    psub: document.getElementById('psub'),
    grid: document.getElementById('grid'),
    player: document.getElementById('player'),
    msg: document.getElementById('msg'),
    bar: document.getElementById('bar'),
    list: document.getElementById('list')
  };

  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4) {
        if (x.status >= 200 && x.status < 300) {
          var d = null;
          try { d = JSON.parse(x.responseText); } catch (e) {}
          cb(null, d);
        } else {
          cb(x.status || 'erro', null);
        }
      }
    };
    x.send();
  }

  // cb (opcional) roda quando a resposta chega — usado quando algo depois precisa ter
  // certeza que o servidor já processou (ex.: trocar dublagem antes de recarregar o vídeo).
  function send(method, url, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    if (typeof cb === 'function') {
      x.onreadystatechange = function () { if (x.readyState === 4) cb(); };
    }
    if (body != null) {
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify(body));
    } else {
      x.send();
    }
  }

  // TV nao tem console acessivel — manda erro pro servidor (docker logs) em vez de
  // depender de alguem ler a tela. Best-effort: nunca lanca.
  function logDiag(msg) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/diag/log', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify({ msg: String(msg) }));
    } catch (e) {}
  }

  window.onerror = function (msg, url, line, col, err) {
    logDiag('JS error: ' + msg + ' @ ' + url + ':' + line + ':' + col);
    return false;
  };

  // esc() vem de /js/util.js (compartilhado com index.html e controle.html).

  // Serie/episodio/rotulo/pasta vem prontos da API (MediaNomeParser no servidor) — uma
  // fonte so, sem regex duplicada aqui.

  function load() {
    els.msg.style.display = 'block';
    els.msg.innerHTML = 'Carregando...';
    render();
  }

  // formatarTempo() vem de /js/util.js.

  // Filtro (tipo/visto) e agrupamento (filme solto / pasta filme+extras / serie com
  // episodios) vem prontos de /api/filmes/tela -- esta tela so desenha o que chega, sem
  // logica propria de agrupar (mesma fonte do index.html e do controle.html).
  function render() {
    var grid = els.grid;
    var msg = els.msg;
    var i, j;

    var url = API + '/tela?tipo=' + encodeURIComponent(filtroTipo) + '&visto=all';

    get(url, function (err, t) {
      if (err || !t) {
        grid.innerHTML = '';
        msg.style.display = 'block';
        msg.innerHTML = 'Falha ao carregar a lista.';
        buildNav();
        return;
      }

      var nada = !t.continuarAssistindo.length && !t.filmesSoltos.length && !t.pastasFilme.length && !t.series.length;
      if (nada) {
        grid.innerHTML = '';
        msg.style.display = 'block';
        msg.innerHTML = t.catalogoVazio ? 'Nenhum filme. Rode o Scan no celular.' : 'Nada nesse filtro.';
        buildNav();
        return;
      }
      msg.style.display = 'none';

      function itemHtml(m, rotulo) {
        return '<a class="item" href="#" data-id="' + m.id + '">' +
               esc(rotulo || m.titulo) +
               (m.anoLancamento ? ' <span class="ano">(' + m.anoLancamento + ')</span>' : '') +
               (m.assistido ? ' <span class="visto">&#10003; assistido</span>' : '') +
               '</a>';
      }

      var totalFilmes = t.filmesSoltos.length;
      for (i = 0; i < t.pastasFilme.length; i++) totalFilmes += t.pastasFilme[i].itens.length;

      var html = '';
      if (t.continuarAssistindo.length) {
        html += '<h2>Continuar assistindo</h2><div class="movies">';
        for (i = 0; i < t.continuarAssistindo.length; i++) {
          var c = t.continuarAssistindo[i];
          var pct = c.duracaoSegundos ? Math.round(100 * c.posicaoSegundos / c.duracaoSegundos) : 0;
          var nota = pct ? (pct + '%') : formatarTempo(c.posicaoSegundos);
          html += '<a class="item" href="#" data-id="' + c.id + '">' +
                  esc(c.titulo) + ' <span class="ano">(' + nota + ')</span></a>';
        }
        html += '</div>';
      }

      if (totalFilmes) {
        html += '<h2>Filmes (' + totalFilmes + ')</h2>';
        if (t.filmesSoltos.length) {
          html += '<div class="movies">';
          for (i = 0; i < t.filmesSoltos.length; i++) html += itemHtml(t.filmesSoltos[i]);
          html += '</div>';
        }
        for (i = 0; i < t.pastasFilme.length; i++) {
          var pasta = t.pastasFilme[i], peps = '';
          for (j = 0; j < pasta.itens.length; j++) peps += itemHtml(pasta.itens[j]);
          html += grpHtml('f:' + pasta.chave, esc(pasta.nome) + ' (' + pasta.itens.length + ' arquivos)', peps);
        }
      }

      for (i = 0; i < t.series.length; i++) {
        var s = t.series[i], seps = '';
        if (i === 0) html += '<h2>Series (' + t.series.length + ')</h2>';
        for (j = 0; j < s.episodios.length; j++) seps += itemHtml(s.episodios[j], rotuloComTitulo(s.episodios[j]));
        html += grpHtml('s:' + s.chave,
          esc(s.nome) + ' (' + s.episodios.length + (s.episodios.length === 1 ? ' episodio)' : ' episodios)'), seps);
      }
      grid.innerHTML = html;
      buildNav();
    });
  }

  // cabecalho dobravel (.grp) + itens (.eps) — respeita gruposAbertos
  function grpHtml(chave, label, itensHtml) {
    var aberto = !!gruposAbertos[chave];
    return '<a class="grp" href="#" data-g="' + esc(chave) + '" data-label="' + label + '">' +
           (aberto ? '▾ ' : '▸ ') + label + '</a>' +
           '<div class="eps" data-g="' + esc(chave) + '" style="display:' + (aberto ? 'block' : 'none') + '">' +
           itensHtml + '</div>';
  }

  function buildNav() {
    // ordem de navegacao: barra de filtros + cabecalhos de serie + itens visiveis
    var bar = els.bar.getElementsByTagName('a');
    var grid = els.grid;
    links = [];
    var i, j;
    for (i = 0; i < bar.length; i++) links.push(bar[i]);
    var nodes = grid.childNodes;
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType !== 1) continue;
      var c = n.className || '';
      if (c.indexOf('grp') !== -1) {
        links.push(n);
      } else if (c.indexOf('eps') !== -1) {
        if (n.style.display !== 'none') {
          var eps = n.getElementsByClassName('item');
          for (j = 0; j < eps.length; j++) links.push(eps[j]);
        }
      } else if (c.indexOf('movies') !== -1) {
        var mv = n.getElementsByClassName('item');
        for (j = 0; j < mv.length; j++) links.push(mv[j]);
      }
    }
    if (idx >= links.length) idx = links.length - 1;
    if (idx < 0) idx = 0;
    focar(idx);
  }

  function toggleGrp(el) {
    var g = el.getAttribute('data-g');
    var boxes = els.grid.getElementsByClassName('eps');
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].getAttribute('data-g') === g) {
        var aberto = boxes[i].style.display !== 'none';
        boxes[i].style.display = aberto ? 'none' : 'block';
        if (aberto) delete gruposAbertos[g]; else gruposAbertos[g] = 1;
        el.innerHTML = (aberto ? '▸ ' : '▾ ') + el.getAttribute('data-label');
      }
    }
    buildNav();
    // mantem o foco no proprio cabecalho — assim o proximo "baixo" entra no 1o episodio
    var n = links.indexOf(el);
    if (n >= 0) focar(n);
  }

  function focar(n) {
    var i;
    for (i = 0; i < links.length; i++) links[i].className = links[i].className.replace(/ ?sel/, '');
    idx = Math.max(0, Math.min(n, links.length - 1));
    var el = links[idx];
    if (!el) return;
    el.className += ' sel';
    try { el.focus(); } catch (e) {}
    if (el.scrollIntoView) el.scrollIntoView();
  }

  function ativar(el) {
    if (!el) return;
    if (el.className && el.className.indexOf('grp') !== -1) { toggleGrp(el); return; }
    var fg = el.getAttribute('data-fg');
    if (fg) {
      var fv = el.getAttribute('data-fv');
      filtroTipo = fv;  // só resta o grupo "tipo" nessa tela
      var bar = els.bar.getElementsByTagName('a');
      for (var i = 0; i < bar.length; i++) {
        if (bar[i].getAttribute('data-fg') !== fg) continue;
        bar[i].className = bar[i].className.replace(/ ?on/, '');
        if (bar[i].getAttribute('data-fv') === fv) bar[i].className += ' on';
      }
      render();
      return;
    }
    if (el.id === 'reload') { load(); return; }
    var id = el.getAttribute('data-id');
    if (id) tocar(id);
  }

  // ---- player ----
  function pararPoll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function destruirHls() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  }

  function pararWatchdog() {
    if (hlsWatchdog) { clearTimeout(hlsWatchdog); hlsWatchdog = null; }
  }

  // Se o hls.js anexa mas nunca entrega dado nenhum pro <video> (MediaSource com bug
  // silencioso, comum em WebKit velho de TV — nao dispara ERROR nenhum), cai pro
  // caminho antigo (arquivo direto/original) depois de um tempo em vez de ficar
  // preso pra sempre numa tela preta.
  function armarWatchdog(id) {
    pararWatchdog();
    hlsWatchdog = setTimeout(function () {
      var v = els.video;
      if (filmeAtual !== id || v.readyState >= 2) return;  // ja tem dado -> hls ta ok
      logDiag('watchdog: hls sem dado em 15s (readyState=' + v.readyState + '), filme ' + id + ' — caindo pro arquivo direto');
      destruirHls();
      els.pmsg.innerHTML = 'HLS não respondeu, tentando arquivo direto...';
      tocarSemHls(id);
    }, WATCHDOG_HLS_MS);
  }

  function iniciarHls(id, url, tAlvo) {
    var v = els.video;
    destruirHls();
    armarWatchdog(id);
    hls = new window.Hls(tAlvo ? { startPosition: tAlvo } : {});
    hls.on(window.Hls.Events.MANIFEST_PARSED, function () { try { v.play(); } catch (e) {} });
    hls.on(window.Hls.Events.ERROR, function (_e, d) {
      if (!d) return;
      logDiag('hls.js error: type=' + d.type + ' details=' + d.details + ' fatal=' + d.fatal +
              (d.response ? (' status=' + d.response.code) : ''));
      if (!d.fatal || filmeAtual !== id) return;
      pararWatchdog();
      if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); armarWatchdog(id); return; }
      destruirHls();
      // erro fatal de rede: segmento sumiu (transcode reiniciou) — recarrega o filme.
      // Limite de tentativas: senao um erro persistente (TV incompativel, etc.)
      // fica tentando pra sempre sem avisar nada na tela.
      if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR && hlsRetries++ < MAX_HLS_RETRIES) {
        setTimeout(function () { if (filmeAtual === id) tocar(id, true); }, HLS_RETRY_DELAY_MS);
      } else {
        els.pmsg.innerHTML = 'Falha ao carregar o video (erro ' + d.type + ').';
      }
    });
    v.onerror = function () {
      var err = v.error;
      logDiag('<video> error: code=' + (err && err.code) + ' filme ' + id);
    };
    hls.attachMedia(v);
    hls.loadSource(url);
  }

  function tocarUrl(id, url, comAviso) {
    var v = els.video;
    var pmsg = els.pmsg;
    var seg = posicaoRetomar > RETOMAR_MIN_SEGUNDOS ? Math.floor(posicaoRetomar) : 0;
    // As 3 chamadoras (stream/remux/original) sao sempre arquivo completo com
    // Content-Length — duration nunca cresce depois, ao contrario do HLS.
    duracaoConfiavel = true;
    v.src = url + (seg ? '#t=' + seg : '');
    if (comAviso) {
      pmsg.innerHTML = 'Arquivo original (pode nao rodar em TV muito antiga).';
      setTimeout(function () {
        if (pmsg.innerHTML.indexOf('original') !== -1) pmsg.innerHTML = '';
      }, AVISO_ORIGINAL_MS);
    }
    v.onerror = function () {
      var err = v.error;
      logDiag('<video> error (direto): code=' + (err && err.code) + ' filme ' + id + ' url=' + url);
    };
    try { v.load(); v.play(); } catch (e) {}
    carregarLegendas(id);
    // "assistido" fica por conta do backend (perto do fim) ou do evento 'ended'.
  }

  // Poll generico "preparando -> disponivel/erro": usado tanto pelo /stream-status do
  // HLS quanto pelo /remux-status (a diferenca entre os dois eh so a mensagem e o que
  // fazer quando fica pronto). Continua rechamando a si mesmo enquanto "preparando".
  // Erro de rede tambem cai em "preparando" (mesmo padrao do checarStatus do index.html) --
  // sem um teto, uma falha de rede prendia a tela em "Preparando..." pra sempre, sem nunca
  // desistir. `falhas` viaja de chamada em chamada via parametro (nao tem closure aqui).
  function pollStatus(id, url, intervaloMs, msgPreparando, msgErro, aoPronto, falhas) {
    falhas = falhas || 0;
    get(url, function (err, d) {
      if (filmeAtual !== id) return;  // trocou de filme enquanto esperava
      var pmsg = els.pmsg;
      var status = (!err && d) ? d.status : null;
      falhas = err ? falhas + 1 : 0;

      if (status === 'erro' || falhas > MAX_FALHAS_POLL) { pmsg.innerHTML = msgErro; return; }
      if (status === null || status === 'preparando') {
        pmsg.innerHTML = typeof msgPreparando === 'function' ? msgPreparando(d) : msgPreparando;
        pollTimer = setTimeout(function () {
          pollStatus(id, url, intervaloMs, msgPreparando, msgErro, aoPronto, falhas);
        }, intervaloMs);
        return;
      }
      pmsg.innerHTML = '';
      aoPronto(status);
    });
  }

  // /remux-status ate o .mp4 (video copiado, audio -> AAC) ficar pronto em cache — so
  // entao toca, como um arquivo normal (Content-Length + Range, ao contrario de um pipe
  // ao vivo que algumas TVs recusam na hora por nao saber o tamanho).
  function pollRemuxEtocar(id) {
    pollStatus(id, API + '/' + id + '/remux-status', POLL_REMUX_MS,
      function (d) { return 'Preparando audio' + (d && d.progresso != null ? ' (' + d.progresso + '%)' : '...'); },
      'Falha ao preparar o audio.',
      function () { tocarUrl(id, API + '/' + id + '/remux', false); });
  }

  // TV sem MediaSource nem HLS nativo (ou hls.js que travou sem erro): pergunta se da
  // pra tocar direto (sem disparar transcode); se so o audio for o problema (EAC3/DTS
  // de rip WEB-DL — o video ja e compativel), espera o /remux ficar pronto em cache
  // (video copiado, so o audio vira AAC); senao, ultimo recurso, arquivo original cru.
  function tocarSemHls(id) {
    var pmsg = els.pmsg;
    get(API + '/' + id + '/pode-direto', function (e2, pd) {
      if (filmeAtual !== id) return;
      if (!e2 && pd && pd.compativel) {
        pmsg.innerHTML = '';
        tocarUrl(id, API + '/' + id + '/stream', false);
      } else if (!e2 && pd && pd.remuxavel) {
        logDiag('remux (audio) filme ' + id);
        pollRemuxEtocar(id);
      } else {
        tocarUrl(id, API + '/' + id + '/original', true);
      }
    });
  }

  // Poll de /stream-status ate sair de "preparando", igual ao index.html. So entra
  // aqui quando a TV tem algum jeito de tocar HLS (MSE+hls.js OU HLS nativo do
  // <video>) — TV sem nenhum dos dois nem chega, vai direto pro tocarSemHls.
  function pollStatusEtocar(id) {
    pollStatus(id, API + '/' + id + '/stream-status', POLL_STATUS_MS, 'Preparando video...', 'Falha ao preparar o video.',
      function (status) {
        var v = els.video;
        var t = posicaoRetomar > RETOMAR_MIN_SEGUNDOS ? Math.floor(posicaoRetomar) : 0;
        var url = API + '/' + id + '/hls/playlist.m3u8';
        if (status === 'compativel') {
          duracaoConfiavel = true;  // arquivo completo, sem HLS — mesma razao do tocarUrl acima
          v.src = API + '/' + id + '/stream' + (t ? ('#t=' + t) : '');
          try { v.load(); v.play(); } catch (e) {}
        } else if (window.Hls && window.Hls.isSupported && window.Hls.isSupported()) {
          iniciarHls(id, url, t);
        } else {
          // Sem MediaSource, mas o <video> entende .m3u8 direto (HLS nativo — comum em
          // smart TV mesmo sem hls.js). Mesmo watchdog: se travar sem erro, cai pro raw.
          logDiag('native HLS (canPlayType) filme ' + id);
          armarWatchdog(id);
          v.onerror = function () {
            var err = v.error;
            logDiag('<video> error (HLS nativo): code=' + (err && err.code) + ' filme ' + id);
            pararWatchdog();
            tocarSemHls(id);
          };
          v.src = url + (t ? ('#t=' + t) : '');
          try { v.load(); v.play(); } catch (e) {}
        }
        carregarLegendas(id);
      });
  }

  // Legenda desenhada num <div> (#psub), nao pelo <track> nativo: muita smart TV toca o video
  // mas nao renderiza <track>. Baixa o .vtt, parseia os cues e mostra o da posicao atual a
  // cada timeupdate. Botao VERMELHO liga/desliga durante o filme.
  var legendaFaixas = [];   // faixas convertiveis do filme atual
  var legendaAtiva = -1;    // idx da faixa mostrada (-1 = desligada)
  var legendaCues = [];     // [{ini, fim, html}] da faixa ativa, em ordem
  var legendaUltimo = 0;    // indice do ultimo cue achado (atalho — o tempo anda pra frente)
  var legendaToken = 0;     // invalida download de legenda ainda em voo
  var legendaProntas = false; // /legendas ja respondeu para o filme atual
  var legendaPendente = -1;   // idx pedido pelo celular antes de /legendas responder
  var legendaDiag = 3;      // quantas vezes ainda loga a legenda desenhada (diagnostico: TV sem console, cai no docker logs)
  var legendaSemCue = 0;    // timeupdates seguidos sem cue na posicao atual (so pro diagnostico)
  var teclasDiag = 15;      // quantas teclas "desconhecidas" ainda loga (diagnostico: que keyCode o vermelho manda?)
  var legendaManualLocal = false;  // quem assiste ja escolheu (celular ou vermelho): a legenda automatica nao se mete mais neste filme
  var legendaHtml = '';     // ultimo html escrito em #psub (comparar com o innerHTML relido nao serve: o navegador reserializa)

  function removerLegendas() {
    legendaFaixas = [];
    legendaProntas = false;
    ativarLegenda(-1);
  }

  function tempoVtt(t) {
    var p = t.replace(',', '.').split(':'), n = 0;
    for (var i = 0; i < p.length; i++) n = n * 60 + parseFloat(p[i]);
    return n;
  }

  function parseVtt(txt) {
    var cues = [], blocos = txt.replace(/\r/g, '').split(/\n[ \t]*\n/);
    for (var i = 0; i < blocos.length; i++) {
      var linhas = blocos[i].split('\n'), k = 0;
      while (k < linhas.length && linhas[k].indexOf('-->') === -1) k++;
      if (k >= linhas.length) continue;
      var tempos = linhas[k].split('-->');
      var corpo = [];
      for (var j = k + 1; j < linhas.length; j++) if (linhas[j]) corpo.push(esc(linhas[j].replace(/<[^>]*>/g, '')));
      if (!corpo.length) continue;
      cues.push({ ini: tempoVtt(tempos[0].replace(/^\s+|\s+$/g, '')),
                  fim: tempoVtt(tempos[1].replace(/^\s+/, '').split(' ')[0]),
                  html: corpo.join('<br>') });
    }
    return cues;
  }

  function renderLegenda() {
    var t = els.video.currentTime, c = legendaCues, i = legendaUltimo, achou = null;
    if (!c.length) return;
    if (c[i] && t >= c[i].ini && t <= c[i].fim) achou = c[i];
    else {
      for (i = 0; i < c.length; i++) if (t >= c[i].ini && t <= c[i].fim) { achou = c[i]; legendaUltimo = i; break; }
    }
    var html = achou ? achou.html : '';
    if (legendaHtml !== html) { legendaHtml = html; els.psub.innerHTML = html; }
    if (achou && legendaDiag > 0) { legendaDiag--; diagLegendaTela(); }
    else if (!achou && legendaDiag === 3 && ++legendaSemCue === 40)
      logDiag('legenda: ' + c.length + ' cues carregados, nenhum na posicao t=' + t + ' (primeiro ' + c[0].ini + '-' + c[0].fim + ')');
  }

  // Diagnostico: onde o div da legenda caiu e se o video esta em tela cheia nativa (nesse caso
  // algumas TVs desenham o video por cima de qualquer elemento HTML).
  function diagLegendaTela() {
    try {
      var s = els.psub, v = els.video;
      var cs = window.getComputedStyle ? window.getComputedStyle(s, null) : null;
      logDiag('legenda desenhada: psub ' + s.offsetWidth + 'x' + s.offsetHeight + ' display=' + (cs && cs.display) +
        ' visibility=' + (cs && cs.visibility) + ' z=' + (cs && cs.zIndex) + ' | video ' + v.offsetWidth + 'x' + v.offsetHeight +
        ' | telaCheia=' + !!(document.fullscreenElement || document.webkitFullscreenElement) + ' t=' + v.currentTime);
    } catch (e) {}
  }

  // Tela cheia nativa do <video> desenha SO o <video> e o que vive dentro dele: o #psub fica de
  // fora e some (medido na Samsung J5200: entra em tela cheia com document.fullscreenElement =
  // o proprio <video>). A legenda nativa (<track>) vive dentro do video e e desenhada tambem em
  // tela cheia — entao a faixa ativa e espelhada num <track> e ligada SO enquanto o video esta
  // em tela cheia; fora dela o #psub continua sendo o que aparece (sem legenda em dobro).
  function trilhaNativa(idx) {
    var v = els.video, antigas = v.getElementsByTagName('track');
    while (antigas.length) v.removeChild(antigas[0]);
    if (idx === -1 || !v.textTracks) return;
    var t = document.createElement('track');
    t.setAttribute('kind', 'subtitles');
    t.setAttribute('label', 'Legenda');
    t.setAttribute('srclang', 'und');
    t.setAttribute('src', API + '/' + filmeAtual + '/legenda/' + idx);
    v.appendChild(t);
    aplicarModoLegenda();   // 'hidden' ja basta pra o navegador baixar os cues
  }

  function emTelaCheiaNativa() {
    return (document.fullscreenElement || document.webkitFullscreenElement) === els.video;
  }

  function aplicarModoLegenda() {
    var tt = els.video.textTracks, nativo = emTelaCheiaNativa();
    if (!tt) return;
    for (var i = 0; i < tt.length; i++) tt[i].mode = nativo ? 'showing' : 'hidden';
  }

  // Diagnostico: a TV carregou os cues do <track>? (readyState 2 = carregado, 3 = erro)
  function diagTrilhasNativas() {
    try {
      var v = els.video, tt = v.textTracks, el = v.getElementsByTagName('track')[0];
      logDiag('tela cheia nativa: trilhas=' + (tt ? tt.length : 'sem textTracks') +
        (tt && tt.length ? ' modo=' + tt[0].mode + ' cues=' + (tt[0].cues ? tt[0].cues.length : 'null') : '') +
        (el ? ' readyState=' + el.readyState : ''));
    } catch (e) {}
  }

  // idx de /legendas; -1 (ou idx desconhecido) desliga.
  function ativarLegenda(idx) {
    var meu = ++legendaToken;
    legendaCues = [];
    legendaUltimo = 0;
    legendaHtml = '';
    legendaSemCue = 0;
    els.psub.innerHTML = '';
    legendaPendente = -1;
    var ok = false;
    for (var i = 0; i < legendaFaixas.length; i++) if (legendaFaixas[i].idx === idx) ok = true;
    legendaAtiva = ok ? idx : -1;
    // Comando do celular chegou antes de /legendas responder: guarda e aplica quando a lista vier.
    if (!ok && !legendaProntas && idx !== -1) legendaPendente = idx;
    trilhaNativa(ok ? idx : -1);
    if (!ok) return;
    var x = new XMLHttpRequest();
    x.open('GET', API + '/' + filmeAtual + '/legenda/' + idx);
    x.timeout = LEGENDA_TIMEOUT_MS;
    var falhou = function () {
      if (meu !== legendaToken) return;
      legendaAtiva = -1;  // senao o botao vermelho acha que esta ligada e o proximo toque so "desliga"
      trilhaNativa(-1);
      var p = els.pmsg;
      if (p.innerHTML === '' || p.innerHTML.indexOf('Legenda:') === 0) {
        p.innerHTML = 'Legenda: indisponivel';
        setTimeout(function () { if (p.innerHTML.indexOf('Legenda:') === 0) p.innerHTML = ''; }, LEGENDA_MSG_MS);
      }
    };
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || meu !== legendaToken) return;
      if (x.status === 200) {
        legendaCues = parseVtt(x.responseText);
        logDiag('legenda idx=' + idx + ' baixada: ' + x.responseText.length + ' bytes, ' + legendaCues.length + ' cues' +
          (legendaCues[0] ? ', primeiro ' + legendaCues[0].ini + '-' + legendaCues[0].fim : '') +
          ' | t=' + els.video.currentTime + ' dur=' + els.video.duration);
        renderLegenda();
      }
      else if (x.status !== 0) { logDiag('legenda idx=' + idx + ' falhou: HTTP ' + x.status); falhou(); }  // status 0 = erro de rede/timeout, tratado abaixo
    };
    x.onerror = x.ontimeout = function () {
      logDiag('legenda idx=' + idx + ' sem resposta (erro de rede ou timeout)');
      falhou();
    };
    x.send();
  }

  function carregarLegendas(id) {
    get(API + '/' + id + '/legendas', function (err, faixas) {
      if (err || !faixas || filmeAtual !== id) return;
      legendaFaixas = [];
      for (var i = 0; i < faixas.length; i++) if (faixas[i].convertivel) legendaFaixas.push(faixas[i]);
      legendaProntas = true;
      if (legendaPendente !== -1) { ativarLegenda(legendaPendente); return; }
      ligarLegendaRecomendada();
    });
  }

  // Quem so assiste com legenda quando o audio e estrangeiro nao deveria ter que ligar o CC a cada episodio:
  // o servidor marca `recomendada` (audio atual de idioma conhecido e nao portugues + melhor legenda em
  // portugues) e a TV liga sozinha — a menos que a pessoa ja tenha escolhido neste filme (ligar OU desligar).
  function ligarLegendaRecomendada() {
    if (legendaManualLocal || legendaAtiva !== -1) return;
    var rec = null;
    for (var i = 0; i < legendaFaixas.length; i++) if (legendaFaixas[i].recomendada) { rec = legendaFaixas[i]; break; }
    if (!rec) return;
    logDiag('legenda automatica: idx=' + rec.idx + ' (audio nao e portugues)');
    ativarLegenda(rec.idx);
    avisarLegendaTv(rec.idx, false);
    els.pmsg.innerHTML = 'Legenda: ' + (rec.titulo || rec.idioma || 'on') + ' (automatica)';
    setTimeout(function () { var p = els.pmsg; if (p.innerHTML.indexOf('Legenda:') === 0) p.innerHTML = ''; }, LEGENDA_MSG_MS);
  }

  // Conta pro servidor (e pro celular) a legenda que a TV ligou/desligou por conta propria.
  function avisarLegendaTv(idx, manual) {
    send('POST', PLAYER + '/legenda-tv', { idx: idx, manual: manual });
  }

  function cancelarProximo() {
    if (proximoTimer) { clearInterval(proximoTimer); proximoTimer = null; }
    proximoPendente = null;
    proximoOfertaId++;  // invalida qualquer resposta de /proximo ainda em voo (ver ofereceProximo)
  }

  function ofereceProximo(id) {
    // 'ended' pode disparar 2x (visto em navegador de TV). cancelarProximo() sozinho nao
    // bastava: se as 2 chamadas acontecem sincronas (uma logo apos a outra, antes do fetch
    // da 1a responder), as 2 leem proximoTimer==null e nenhuma cancela nada — cada resposta
    // cria seu PROPRIO setInterval, a 2a var proximoTimer so guarda o mais recente, e o 1o
    // fica orfao rodando junto. Os dois "relogios" independentes chamavam irProximo() um
    // depois do outro: o proximo episodio comecava a tocar e, poucos segundos depois, a
    // chamada orfa tocava ELE MESMO de novo do zero — parecia "tocou o mesmo episodio de novo".
    // O token (proximoOfertaId) resolve isso não importa o intervalo entre as 2 chamadas:
    // só a resposta da ÚLTIMA ofereceProximo (a que "ganhou" o token por último) monta o timer.
    cancelarProximo();
    var meuToken = ++proximoOfertaId;
    get(API + '/' + id + '/proximo', function (err, prox) {
      if (err || !prox || filmeAtual !== id || meuToken !== proximoOfertaId) return;
      proximoPendente = prox;
      // Dispara o transcode do proximo episodio AGORA, antes de alguem pedir de verdade — o
      // HLS entrega o primeiro segmento sem esperar o episodio inteiro, entao so precisa
      // comecar cedo pra nao ter o "Preparando..." quando o usuario realmente abrir. Seguro
      // nesse momento (fim do atual): o job do episodio que acabou ja deve estar pronto, entao
      // nao compete por CPU/VPU com o que esta tocando de verdade.
      if (!prox.assistido) preAquecerProximo(prox.id, meuToken);   // rever: nao enche o cache de quem ja viu
      // Avisa o celular que tem oferta de proximo episodio na tela — sem isso, quem so
      // tem o controle.html na mao nao sabe que apareceu nem consegue confirmar.
      send('POST', PLAYER + '/proximo-oferece', { filmeId: prox.id, rotulo: rotuloComTitulo(prox) });
      var pmsg = els.pmsg;
      var resta = PROXIMO_COUNTDOWN_S;
      function tick() {
        pmsg.innerHTML = 'Proximo: ' + esc(rotuloComTitulo(prox)) + ' &mdash; OK assiste, Voltar cancela  (' + resta + 's)';
        if (resta-- <= 0) irProximo();
      }
      tick();
      proximoTimer = setInterval(tick, 1000);
    });
  }

  // So dispara/reusa o job de transcode do proximo episodio (igual tocar()/tocarSemHls()
  // decidiriam) -- nunca toca nada, so "cutuca" o servidor a comecar. Resposta ignorada de
  // proposito. Mesma logica de HLS-vs-sem-HLS de tocar(), pra nao aquecer o cache HLS numa TV
  // que vai usar /remux de verdade (ou vice-versa) -- desperdicio de CPU sem ajudar em nada.
  function suportaMseHls() {
    return !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
  }
  function suportaHlsNativo() {
    var v = els.video;
    return !!(v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl'));
  }

  // token = proximoOfertaId da oferta que mandou pre-aquecer: se o usuario cancelou enquanto o
  // /pode-direto (ffprobe, pode levar segundos) ainda estava em voo, nao dispara o remux.
  function preAquecerProximo(id, token) {
    if (suportaMseHls() || suportaHlsNativo()) {
      get(API + '/' + id + '/hls/playlist.m3u8', function () {});
    } else {
      get(API + '/' + id + '/pode-direto', function (err, pd) {
        if (token !== proximoOfertaId) return;
        if (!err && pd && pd.remuxavel) get(API + '/' + id + '/remux-status', function () {});
      });
    }
  }

  function irProximo() {
    var p = proximoPendente;
    cancelarProximo();
    if (p) tocar(p.id);
  }

  // posInicial (opcional): pula o fetch de /progresso e usa essa posicao direto — usado ao
  // recarregar o MESMO filme depois de trocar dublagem (aplicarAudioRemoto), onde a posicao
  // certa e onde o video estava (v.currentTime), nao a ultima salva no banco. Tambem pula o
  // aviso de "selecionar" ao PlayerStateService (mesmo filme, nao e uma selecao nova).
  function tocar(id, ehRetry, posInicial) {
    cancelarProximo();
    pararPoll();
    pararWatchdog();
    destruirHls();
    removerLegendas();
    if (!ehRetry) hlsRetries = 0;  // retry preserva o contador, senao o teto de 3 nunca conta
    // Avisa o controle.html o que esta tocando agora, nao importa se foi selecionado
    // aqui no D-pad ou remotamente — fonte unica de verdade no servidor. Fire-and-forget,
    // nao atrasa nem interfere na reproducao local.
    if (!ehRetry && posInicial == null) { legendaManualLocal = false; send('POST', PLAYER + '/selecionar/' + id); }
    els.list.className = 'hide';
    els.player.className = 'on';
    els.video.style.width = ''; els.video.style.height = '';  // o ajuste do filme anterior nao vale pra este (ver ajustarVideo)
    document.body.className = 'playing';
    var v = els.video;
    var pmsg = els.pmsg;
    pmsg.innerHTML = 'Preparando...';
    v.removeAttribute('src');

    // dica dos controles so nos primeiros segundos, pra nao ficar sobre o video
    var phint = document.getElementById('phint');
    phint.style.display = 'block';
    setTimeout(function () { phint.style.display = 'none'; }, DICA_CONTROLES_MS);

    filmeAtual = id;
    ultimoSalvo = 0;
    posicaoRetomar = 0;
    retomarTentativas = 0;
    duracaoConfiavel = false;
    reproducaoConcluida = false;

    var temMseHls = suportaMseHls();
    var temNativeHls = suportaHlsNativo();
    var temHls = temMseHls || temNativeHls;
    if (!ehRetry) logDiag('tocar filme ' + id + ': mse=' + temMseHls + ' native=' + temNativeHls);

    if (posInicial != null) {
      // Posicao ja definida por quem chamou (ex.: troca de dublagem) — nao busca /progresso,
      // que traria a ultima posicao SALVA, nao a posicao real de onde o video estava.
      posicaoRetomar = posInicial;
      if (temHls) pollStatusEtocar(id); else tocarSemHls(id);
      return;
    }

    // pega o ponto de retomada ANTES de setar o src (senao o loadedmetadata perde a corrida)
    get(API + '/' + id + '/progresso', function (err, d) {
      if (!err && d && d.posicaoSegundos) posicaoRetomar = d.posicaoSegundos;
      if (temHls) pollStatusEtocar(id); else tocarSemHls(id);
    });
  }

  // aplicar so no 'loadedmetadata' nao cola (o navegador volta pra 0 depois).
  // 'loadeddata'/'canplay'/'seeked' pegam, e re-tenta se o seek for revertido.
  function aplicarRetomada() {
    var v = els.video;
    if (!(posicaoRetomar > RETOMAR_MIN_SEGUNDOS)) return;
    var dur = v.duration;
    if (duracaoConfiavel && isFinite(dur) && posicaoRetomar >= dur - RETOMAR_MARGEM_FIM_S) { posicaoRetomar = 0; return; }
    if (Math.abs(v.currentTime - posicaoRetomar) <= RETOMAR_TOLERANCIA_S) { posicaoRetomar = 0; return; }
    if (retomarTentativas++ > MAX_RETOMAR_TENTATIVAS) { posicaoRetomar = 0; return; }
    try { v.currentTime = posicaoRetomar; } catch (e) {}
  }

  // Preenche a tela por conta propria. O CSS (width/height:auto + max-*:100%) nunca AUMENTA o
  // video: um 720p num viewport de 1707x960 ficava a 1280x720, com sobra preta em volta, e o
  // usuario apertava o "expandir" nativo da TV — que passa o video pra um plano de hardware
  // por cima de qualquer HTML, e a legenda (#psub) some. Cabendo na tela aqui, nao precisa
  // expandir. Em JS e nao object-fit, porque TV antiga distorce a imagem com ele (ver
  // comentario do #player.on video). videoWidth/Height ja vem com a proporcao de pixel aplicada.
  var ajusteDiag = 4;       // quantas vezes ainda loga o ajuste (diagnostico: TV sem console)
  function ajustarVideo() {
    var v = els.video, vw = v.videoWidth, vh = v.videoHeight;
    if (!vw || !vh || els.player.className !== 'on') return;
    var W = els.player.clientWidth || window.innerWidth, H = els.player.clientHeight || window.innerHeight;
    if (!W || !H) return;
    var f = Math.min(W / vw, H / vh), w = Math.floor(vw * f), h = Math.floor(vh * f);
    v.style.width = w + 'px';
    v.style.height = h + 'px';
    if (ajusteDiag > 0) { ajusteDiag--; logDiag('video ' + vw + 'x' + vh + ' ajustado pra ' + w + 'x' + h + ' (tela ' + W + 'x' + H + ')'); }
  }

  // Tela cheia do #player INTEIRO (video + legenda #psub + avisos), pela tecla ↑. O botao de
  // expandir nativo poe so o <video> em tela cheia — na J5200 nem a legenda nativa (<track>,
  // 464 cues em modo showing no log) e desenhada ali, entao a legenda some. Em tela cheia do
  // container os filhos dele continuam sendo desenhados. requestFullscreen so e aceito dentro
  // de um gesto do usuario (num fullscreenchange nao funciona, ja tentado): a tecla e o gesto.
  function alternarTelaCheiaPlayer() {
    var p = els.player;
    var fs = document.fullscreenElement || document.webkitFullscreenElement;
    var sair = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
    var pedir = p.requestFullscreen || p.webkitRequestFullscreen || p.webkitRequestFullScreen;
    try {
      if (fs) { if (sair) sair.call(document); return; }
      if (!pedir) { logDiag('tela cheia do #player: API indisponivel neste navegador'); return; }
      logDiag('tela cheia do #player: pedindo (tecla)');
      var r = pedir.call(p);
      if (r && r.catch) r.catch(function (err) { logDiag('tela cheia do #player recusada: ' + err); });
    } catch (ex) { logDiag('tela cheia do #player lancou: ' + ex); }
  }

  function configurarProgresso() {
    var v = els.video;
    v.onloadeddata = aplicarRetomada;
    v.oncanplay = aplicarRetomada;
    v.onseeked = aplicarRetomada;
    v.ontimeupdate = function () {
      if (filmeAtual == null || v.paused) return;
      var t = (new Date()).getTime();
      if (t - ultimoSalvo < AUTOSAVE_THROTTLE_MS) return;
      ultimoSalvo = t;
      salvarProgresso();
    };
    // Tela cheia nativa do <video>: troca o #psub pelo <track> nativo (ver trilhaNativa). Antes
    // isto tentava mandar a tela cheia pro #player (video + #psub), mas requestFullscreen so e
    // aceito dentro de um gesto do usuario, nao num fullscreenchange — no log da J5200 o
    // elemento em tela cheia continuou sendo o <video> por 15 s depois da tentativa.
    var telaCheiaDiag = 6;
    var aoMudarTelaCheia = function () {
      var fs = document.fullscreenElement || document.webkitFullscreenElement;
      aplicarModoLegenda();
      if (telaCheiaDiag > 0) {
        telaCheiaDiag--;
        logDiag('tela cheia mudou: elemento=' + (fs ? (fs.tagName + '#' + fs.id) : 'nenhum'));
        if (fs === v) setTimeout(diagTrilhasNativas, 1500);
      }
      setTimeout(ajustarVideo, 300);   // o tamanho da tela muda (863 -> 960 de altura); resize nem sempre dispara
    };
    var erroTelaCheia = function () { logDiag('fullscreenerror: o navegador recusou o pedido de tela cheia'); };
    document.addEventListener('fullscreenerror', erroTelaCheia, false);
    document.addEventListener('webkitfullscreenerror', erroTelaCheia, false);
    document.addEventListener('fullscreenchange', aoMudarTelaCheia, false);
    document.addEventListener('webkitfullscreenchange', aoMudarTelaCheia, false);
    v.addEventListener('webkitbeginfullscreen', function () { logDiag('video entrou em tela cheia nativa (webkitbeginfullscreen) — a legenda #psub nao aparece nesse modo'); }, false);
    v.addEventListener('webkitendfullscreen', function () { logDiag('video saiu da tela cheia nativa'); ajustarVideo(); }, false);
    v.addEventListener('loadedmetadata', ajustarVideo, false);
    v.addEventListener('resize', ajustarVideo, false);   // o <video> dispara quando videoWidth/Height muda
    window.addEventListener('resize', ajustarVideo, false);
    v.addEventListener('timeupdate', renderLegenda, false);
    v.addEventListener('seeked', renderLegenda, false);
    v.onpause = function () { salvarProgresso(); };
    v.onended = function () {
      if (filmeAtual == null) return;
      reproducaoConcluida = true;
      var idFim = filmeAtual;
      send('POST', API + '/' + idFim + '/concluir');
      ofereceProximo(idFim);
    };

    // Keepalive: avisa o backend que ainda tem alguem aqui, senao o transcode em
    // andamento e abortado por inatividade (HlsOrphanTimeoutSeconds) — o hls.js so
    // bate no servidor quando busca segmento novo, o que nao conta como "pedido
    // de status" o tempo todo (buffer cheio, pausado, etc).
    setInterval(function () {
      if (filmeAtual != null) send('POST', API + '/' + filmeAtual + '/assistindo');
    }, KEEPALIVE_MS);

    // Reporta posicao pro controle.html desenhar a barra de progresso (nao precisa
    // ser preciso — so o suficiente pra nao ficar visualmente parado).
    setInterval(function () {
      if (filmeAtual == null) return;
      var x = new XMLHttpRequest();
      x.open('POST', PLAYER + '/posicao', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify({
        pos: v.currentTime,
        dur: isFinite(v.duration) && v.duration > 0 ? v.duration : 0
      }));
    }, POSICAO_REPORT_MS);
  }

  // ---- controle remoto (celular, controle.html) ----
  // Poll independente do pollTimer de status do video: precisa continuar rodando mesmo
  // com a lista na tela (senao nunca pegaria um "selecionar" vindo do celular). So chama
  // as MESMAS funcoes que o D-pad local ja usa (tocar/fecharPlayer/video.play etc.) —
  // a logica de reproducao (HLS/nativo/remux/watchdog/keepalive) nao muda em nada.
  function pollRemoto() {
    get(PLAYER + '/state', function (err, estado) {
      if (!err && estado) aplicarEstadoRemoto(estado);
      setTimeout(pollRemoto, POLL_REMOTO_MS);
    });
  }

  function aplicarEstadoRemoto(estado) {
    var anterior = estadoRemotoAnterior;
    estadoRemotoAnterior = estado;
    if (!anterior) return;  // 1o poll: so guarda a base, nao reage a versao "zerada" do boot

    if (estado.pararVersion !== anterior.pararVersion && filmeAtual !== null) {
      fecharPlayer();
      return;
    }
    if (estado.filmeId !== null && estado.filmeId !== filmeAtual) {
      tocar(estado.filmeId);
      return;
    }
    if (filmeAtual === null) return;

    var v = els.video;
    if (estado.playing && v.paused) { try { v.play(); } catch (e) {} }
    if (!estado.playing && !v.paused) { try { v.pause(); } catch (e) {} }
    if (estado.volume !== anterior.volume) v.volume = estado.volume;
    if (estado.seekVersion !== anterior.seekVersion) {
      try { v.currentTime = Math.max(0, v.currentTime + estado.seekDelta); } catch (e) {}
    }
    if (estado.seekAbsVersion !== anterior.seekAbsVersion) {
      try { v.currentTime = Math.max(0, estado.seekAbsPos); } catch (e) {}
    }
    if (estado.legendaVersion !== anterior.legendaVersion) { legendaManualLocal = true; ativarLegenda(estado.legendaIdx); }
    if (estado.audioVersion !== anterior.audioVersion) aplicarAudioRemoto(estado.audioIdx);
    // Celular confirmou a oferta de proximo episodio que esta TV mesma colocou no ar —
    // mesmo caminho que o OK local do D-pad usaria (irProximo -> tocar -> Selecionar).
    if (estado.aceitarProximoVersion !== anterior.aceitarProximoVersion && proximoPendente) irProximo();
  }

  // Ao contrario da legenda (so troca o <track> ativo, sem tocar no servidor), a dublagem
  // vai dentro dos segments HLS/remux — trocar precisa regerar o video inteiro. Guarda a
  // posicao atual, avisa o servidor da faixa nova (so recarrega DEPOIS da resposta, senao o
  // /hls/playlist.m3u8 podia ser pedido antes do servidor aplicar a troca e vir com a faixa
  // velha) e recarrega o MESMO filme nessa posicao — um "Preparando..." breve e inevitavel
  // (o audio esta embutido nos segments, nao da pra trocar sem reprocessar).
  function aplicarAudioRemoto(idx) {
    if (filmeAtual == null) return;
    var id = filmeAtual;
    var pos = els.video.currentTime || 0;
    send('POST', API + '/' + id + '/audio', { idx: idx }, function () {
      if (filmeAtual === id) tocar(id, false, pos);
    });
  }

  // cb (opcional) roda quando o PUT termina — usado pelo fecharPlayer pra so
  // recarregar a lista depois que o progresso ja foi gravado.
  function salvarProgresso(cb) {
    var v = els.video;
    if (filmeAtual == null || reproducaoConcluida || !(v.currentTime > 15)) { if (typeof cb === 'function') cb(); return; }
    var x = new XMLHttpRequest();
    x.open('PUT', API + '/' + filmeAtual + '/progresso', true);
    x.setRequestHeader('Content-Type', 'application/json');
    if (typeof cb === 'function') {
      x.onreadystatechange = function () { if (x.readyState === 4) cb(); };
    }
    x.send(JSON.stringify({
      posicao: v.currentTime,
      duracao: (duracaoConfiavel && isFinite(v.duration) && v.duration > 0) ? v.duration : null
    }));
  }

  function fecharPlayer() {
    cancelarProximo();
    pararPoll();
    pararWatchdog();
    destruirHls();
    removerLegendas();
    send('POST', PLAYER + '/parar');  // avisa o controle.html, mesma ideia do selecionar acima
    // grava o progresso e so entao recarrega a lista, senao o "continuar
    // assistindo" volta antes do PUT e fica desatualizado.
    salvarProgresso(function () { load(); });
    var v = els.video;
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    filmeAtual = null;
    els.player.className = '';
    els.list.className = '';
    document.body.className = '';
  }

  // ---- teclado / controle remoto ----
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode;
    var playerAtivo = els.player.className === 'on';

    // Diagnostico (TV sem console): se o vermelho nao manda 403 nesta TV a legenda nunca liga e
    // nada aparece no log. Loga as teclas que nao sao seta/OK pra descobrir o codigo de verdade.
    if (playerAtivo && k !== 37 && k !== 38 && k !== 39 && k !== 40 && k !== 13 && k !== 32 && teclasDiag > 0) {
      teclasDiag--;
      logDiag('tecla keyCode=' + k + (e.key ? ' key=' + e.key : '') + (e.which && e.which !== k ? ' which=' + e.which : ''));
    }

    // Voltar (varia por fabricante: 8, 27, 461, 10009, 166)
    if (k === 8 || k === 27 || k === 461 || k === 10009 || k === 166) {
      if (playerAtivo) { fecharPlayer(); if (e.preventDefault) e.preventDefault(); return false; }
      // Na lista, dentro do app Tizen, Voltar fecha o app (o navegador faria history.back()).
      try { if (window.tizen && tizen.application) { tizen.application.getCurrentApplication().exit(); return false; } } catch (err) {}
      return true;
    }

    if (playerAtivo) {
      // Nesta TV a navegacao e por seta — durante o filme: <- -> pulam 15s, OK pausa.
      // Cima/baixo (volume) ficam com o controle nativo do <video>.
      var v = els.video;

      // Oferta de proximo episodio na tela: OK assiste agora, resto ignora
      // (Voltar ja foi tratado acima -> fecharPlayer -> cancelarProximo).
      if (proximoPendente) {
        if (k === 13 || k === 32) { if (e.preventDefault) e.preventDefault(); irProximo(); return false; }
        return true;
      }

      // ↑: tela cheia do #player (video + legenda) — ver alternarTelaCheiaPlayer.
      if (k === 38) {
        alternarTelaCheiaPlayer();
        if (e.preventDefault) e.preventDefault();
        return false;
      }

      // botao VERMELHO (403 na maioria dos controles): liga/desliga legenda
      if (k === 403) {
        var ligada = legendaAtiva !== -1;
        var f = legendaFaixas[0];
        logDiag('botao vermelho: faixas=' + legendaFaixas.length + ' prontas=' + legendaProntas + ' ligada=' + ligada);
        var novoIdx = ligada || !f ? -1 : f.idx;
        legendaManualLocal = true;
        ativarLegenda(novoIdx);
        avisarLegendaTv(novoIdx, true);
        els.pmsg.innerHTML = 'Legenda: ' + (ligada ? 'off' : (f ? (f.titulo || f.idioma || 'on') : 'nenhuma'));
        setTimeout(function () { var p = els.pmsg; if (p.innerHTML.indexOf('Legenda:') === 0) p.innerHTML = ''; }, LEGENDA_MSG_MS);
        if (e.preventDefault) e.preventDefault();
        return false;
      }

      if (k === 37) {
        v.currentTime = Math.max(0, v.currentTime - SEEK_STEP_S);
        if (e.preventDefault) e.preventDefault(); return false;
      }
      if (k === 39) {
        var d = v.duration;
        v.currentTime = isFinite(d) ? Math.min(d - 1, v.currentTime + SEEK_STEP_S) : v.currentTime + SEEK_STEP_S;
        if (e.preventDefault) e.preventDefault(); return false;
      }
      if (k === 13 || k === 32) {
        // decide o alvo agora e aplica depois de um tiquinho, corrigindo caso o
        // controle nativo do <video> tambem responda ao OK e fique de briga.
        var querPausar = !v.paused;
        if (e.preventDefault) e.preventDefault();
        setTimeout(function () {
          if (querPausar && !v.paused) v.pause();
          if (!querPausar && v.paused) { try { v.play(); } catch (er) {} }
        }, PLAY_PAUSE_RACE_MS);
        return false;
      }
      return true;
    }

    if (k === 38 || k === 37) { focar(idx - 1); if (e.preventDefault) e.preventDefault(); return false; } // cima / esquerda
    if (k === 40 || k === 39) { focar(idx + 1); if (e.preventDefault) e.preventDefault(); return false; } // baixo / direita
    if (k === 13 || k === 32) { ativar(links[idx]); if (e.preventDefault) e.preventDefault(); return false; } // OK
    return true;
  };

  // clique tambem funciona (mouse/touch de alguns controles)
  els.grid.onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    while (t && t !== this && (!t.className ||
           (t.className.indexOf('item') === -1 && t.className.indexOf('grp') === -1))) t = t.parentNode;
    if (t && t !== this) { ativar(t); return false; }
  };
  els.bar.onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    if (t && t.tagName === 'A') { ativar(t); return false; }
  };

  // Quando a pagina roda dentro do app Tizen (pasta tizen/ do repo) ha `window.tizen`: registra as
  // teclas coloridas/midia, que o app nao recebe por padrao, e deixa o Voltar da lista fechar o app.
  // Fora do app (navegador da TV) nada disso existe e a funcao so loga o ambiente.
  function integrarTizen() {
    var ua = (navigator.userAgent || '');
    logDiag('ambiente: ' + ua + ' | tizen=' + !!window.tizen + ' webapis=' + !!window.webapis +
      ' avplay=' + !!(window.webapis && window.webapis.avplay));
    try {
      if (window.tizen && tizen.tvinputdevice) {
        var teclas = ['ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue',
          'MediaPlayPause', 'MediaPlay', 'MediaPause', 'MediaStop', 'MediaFastForward', 'MediaRewind'];
        for (var i = 0; i < teclas.length; i++) {
          try { tizen.tvinputdevice.registerKey(teclas[i]); } catch (e) {}
        }
      }
    } catch (e) {}
  }

  configurarProgresso();
  integrarTizen();
  load();
  pollRemoto();
})();
</script>
</body>
</html>
