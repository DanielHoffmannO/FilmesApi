<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Filmes — TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<style>
/* Sem flexbox, sem grid, sem media queries: so o que TV velha entende. */
* { margin: 0; padding: 0; }
html, body {
  background: #000;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 28px;
  line-height: 1.4;
}
body { padding: 5%; }              /* margem de overscan pra nao cortar nas bordas */
h1 { font-size: 40px; margin-bottom: 20px; }
h2 {
  font-size: 30px;
  color: #aaa;
  margin: 30px 0 10px;
  border-bottom: 2px solid #333;
  padding-bottom: 6px;
}
a.item {
  display: block;
  color: #fff;
  text-decoration: none;
  padding: 14px 18px;
  border: 2px solid #333;
  margin-bottom: 8px;
  background: #111;
}
a.item:focus, a.item.sel {
  background: #e50914;
  border-color: #fff;
  outline: 0;
}
a.grp {
  display: block;
  color: #fff;
  text-decoration: none;
  font-size: 30px;
  padding: 14px 18px;
  border: 2px solid #333;
  margin: 24px 0 8px;
  background: #1a1a1a;
}
a.grp:focus, a.grp.sel { background: #e50914; border-color: #fff; outline: 0; }
.eps { margin-left: 24px; }
.ano { color: #bbb; font-size: 22px; }
.visto { color: #2ecc40; font-size: 22px; }
#msg { color: #bbb; margin: 20px 0; }
#bar {
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 2px solid #333;
}
#bar a {
  display: inline-block;
  color: #fff;
  text-decoration: none;
  padding: 10px 16px;
  border: 2px solid #333;
  background: #111;
  margin: 0 8px 8px 0;
}
#bar a.on { border-color: #e50914; color: #fff; }              /* filtro ativo */
#bar a:focus, #bar a.sel { background: #333; border-color: #fff; outline: 0; }  /* foco do controle */
#bar .lbl { color: #666; font-size: 18px; margin: 0 4px 0 10px; text-transform: uppercase; }
#bar .sep { color: #444; margin: 0 4px; }

/* player */
#player { display: none; }
#player.on {
  display: block;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  z-index: 100;
}
#list.hide { display: none; }
body.playing { padding: 0; }
body.playing > h1, body.playing #list { display: none; }
video { width: 100%; height: auto; background: #000; }
/* Centralizacao com position:absolute + margin:auto: funciona em TV antiga
   (nao depende de flexbox) e nao mexe no font-size do <video> — se mexer, os
   controles nativos (play/pause/tela cheia) somem em WebKit velho.
   max-* + width/height:auto = preenche a tela e sobra barra so nas laterais
   quando o formato nao bate. Sem object-fit: TV antiga distorceria a imagem. */
#player.on video {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  margin: auto;
  width: auto; height: auto;
  max-width: 100%; max-height: 100%;
}
/* aviso/erro no TOPO — nunca em cima da barra de controle do <video> (que fica embaixo) */
#pmsg {
  position: absolute;
  top: 0; left: 0; right: 0;
  margin: 0;
  padding: 10px 16px;
  font-size: 22px;
  text-align: center;
  color: #ddd;
  background: rgba(0,0,0,.7);
  z-index: 2;
}
#pmsg:empty { display: none; }
#phint {
  position: absolute;
  top: 0; right: 0;
  padding: 6px 12px;
  font-size: 18px;
  color: #aaa;
  background: rgba(0,0,0,.5);
  z-index: 3;
}
</style>
</head>
<body>

<h1>&#128250; Filmes</h1>

<div id="list">
  <div id="bar">
    <span class="lbl">Tipo</span>
    <a href="#" data-fg="tipo" data-fv="all" class="on">Tudo</a>
    <a href="#" data-fg="tipo" data-fv="filme">Filmes</a>
    <a href="#" data-fg="tipo" data-fv="serie">Series</a>
    <span class="sep">|</span>
    <span class="lbl">Status</span>
    <a href="#" data-fg="visto" data-fv="all" class="on">Todos</a>
    <a href="#" data-fg="visto" data-fv="nao">Nao assistidos</a>
    <a href="#" data-fg="visto" data-fv="sim">Assistidos</a>
    <span class="sep">|</span>
    <a href="#" id="reload">Recarregar</a>
  </div>
  <div id="msg">Carregando...</div>
  <div id="grid"></div>
</div>

<div id="player">
  <video id="video" controls autoplay></video>
  <div id="pmsg"></div>
  <div id="phint">&#8592; &#8594; 15s &middot; OK pausa &middot; Vermelho = legenda &middot; Voltar = lista</div>
</div>

<script src="/vendor/hls.min.js"></script>

<script>
/* ES5 puro, XMLHttpRequest, sem Promise. Feito pra navegador de smart TV antiga.
   Excecao: se a TV aguentar MediaSource (window.Hls carregou e Hls.isSupported()),
   usamos hls.js pra sempre ter audio AAC transcodificado — o <video> nativo de
   muita TV nao decodifica EAC3/DTS, so o passthrough de /original nao basta. */
(function () {
  var API = '/api/filmes';
  var PLAYER = '/api/player';
  var estadoRemotoAnterior = null;
  var hls = null;
  var pollTimer = null;
  var hlsRetries = 0;
  var hlsWatchdog = null;
  var filmes = [];
  var continuar = [];
  var filtroTipo = 'all';   // all | filme | serie
  var filtroVisto = 'all';  // all | sim | nao
  var links = [];      // itens navegaveis atuais
  var idx = 0;
  var gruposAbertos = {};  // series/pastas expandidas — sobrevive ao re-render

  // continuar de onde parou
  var filmeAtual = null;
  var ultimoSalvo = 0;
  var posicaoRetomar = 0;
  var retomarTentativas = 0;
  var reproducaoConcluida = false;  // apos 'ended', nao deixa um save tardio recriar a retomada
  var proximoPendente = null;       // proximo episodio oferecido apos o 'ended'
  var proximoTimer = null;

  function get(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4) {
        if (x.status >= 200 && x.status < 300) {
          var d = null;
          try { d = JSON.parse(x.responseText); } catch (e) {}
          cb(null, d);
        } else {
          cb(x.status || 'erro', null);
        }
      }
    };
    x.send();
  }

  function send(method, url) {
    var x = new XMLHttpRequest();
    x.open(method, url, true);
    x.send();
  }

  // TV nao tem console acessivel — manda erro pro servidor (docker logs) em vez de
  // depender de alguem ler a tela. Best-effort: nunca lanca.
  function logDiag(msg) {
    try {
      var x = new XMLHttpRequest();
      x.open('POST', '/api/diag/log', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify({ msg: String(msg) }));
    } catch (e) {}
  }

  window.onerror = function (msg, url, line, col, err) {
    logDiag('JS error: ' + msg + ' @ ' + url + ':' + line + ':' + col);
    return false;
  };

  function esc(s) {
    s = String(s == null ? '' : s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Serie/episodio/rotulo/pasta vem prontos da API (MediaNomeParser no servidor) — uma
  // fonte so, sem regex duplicada aqui.

  function load() {
    document.getElementById('msg').style.display = 'block';
    document.getElementById('msg').innerHTML = 'Carregando...';
    get(API, function (err, data) {
      if (err) {
        document.getElementById('msg').innerHTML = 'Falha ao carregar (erro ' + err + ').';
        return;
      }
      filmes = data || [];
      get(API + '/continuar', function (e2, d2) {
        continuar = (!e2 && d2) ? d2 : [];
        render();
      });
    });
  }

  function formatarTempo(seg) {
    seg = Math.max(0, Math.round(seg || 0));
    var h = Math.floor(seg / 3600), m = Math.round((seg % 3600) / 60);
    return h ? (h + 'h ' + m + 'min') : (m + 'min');
  }

  function render() {
    var grid = document.getElementById('grid');
    var msg = document.getElementById('msg');
    var i, j;

    // nº de arquivos por pasta na lista COMPLETA (pra nao "achatar" pasta ao filtrar)
    var porPasta = {};
    for (i = 0; i < filmes.length; i++) {
      var pp = filmes[i].pasta;
      porPasta[pp] = (porPasta[pp] || 0) + 1;
    }

    var list = [];
    for (i = 0; i < filmes.length; i++) {
      var f = filmes[i];
      if (filtroVisto === 'sim' && !f.assistido) continue;
      if (filtroVisto === 'nao' && f.assistido) continue;
      if (filtroTipo === 'filme' && f.ehEpisodio) continue;
      if (filtroTipo === 'serie' && !f.ehEpisodio) continue;
      list.push(f);
    }
    if (!list.length) {
      grid.innerHTML = '';
      msg.style.display = 'block';
      msg.innerHTML = filmes.length ? 'Nada nesse filtro.' : 'Nenhum filme. Rode o Scan no celular.';
      buildNav();
      return;
    }
    msg.style.display = 'none';

    function itemHtml(m, rotulo) {
      return '<a class="item" href="#" data-id="' + m.id + '">' +
             esc(rotulo || m.titulo) +
             (m.anoLancamento ? ' <span class="ano">(' + m.anoLancamento + ')</span>' : '') +
             (m.assistido ? ' <span class="visto">&#10003; assistido</span>' : '') +
             '</a>';
    }

    // episodios (por serie) / filmes soltos / pastas de filme (filme + extras)
    var filmesSoltos = [];
    var pfMap = {}, pfOrdem = [];
    var serieMap = {}, serieOrdem = [];
    for (i = 0; i < list.length; i++) {
      var m = list[i];
      if (m.ehEpisodio) {
        var ks = m.serie;
        if (!serieMap[ks]) { serieMap[ks] = []; serieOrdem.push(ks); }
        serieMap[ks].push(m);
        continue;
      }
      var pa = m.pasta;
      if (pa !== 'Sem pasta' && porPasta[pa] > 1) {
        if (!pfMap[pa]) { pfMap[pa] = []; pfOrdem.push(pa); }
        pfMap[pa].push(m);
      } else {
        filmesSoltos.push(m);
      }
    }
    // pasta com 1 filme "de verdade" + so extras -> mostra o filme direto
    for (i = 0; i < pfOrdem.length; i++) {
      var arr0 = pfMap[pfOrdem[i]], princ = [];
      for (j = 0; j < arr0.length; j++) if (!arr0[j].ehExtra) princ.push(arr0[j]);
      if (princ.length === 1) { filmesSoltos.push(princ[0]); delete pfMap[pfOrdem[i]]; pfOrdem.splice(i, 1); i--; }
    }
    filmesSoltos.sort(function (a, b) {
      var x = String(a.titulo).toLowerCase(), y = String(b.titulo).toLowerCase();
      return x < y ? -1 : (x > y ? 1 : 0);
    });
    serieOrdem.sort(); pfOrdem.sort();
    for (i = 0; i < serieOrdem.length; i++) {
      serieMap[serieOrdem[i]].sort(function (a, b) {
        return (a.temporada - b.temporada) || (a.episodio - b.episodio) ||
               (String(a.titulo) < String(b.titulo) ? -1 : 1);
      });
    }

    var totalFilmes = filmesSoltos.length;
    for (i = 0; i < pfOrdem.length; i++) totalFilmes += pfMap[pfOrdem[i]].length;

    var html = '';
    if (filtroTipo === 'all' && filtroVisto === 'all' && continuar.length) {
      html += '<h2>Continuar assistindo</h2><div class="movies">';
      for (i = 0; i < continuar.length; i++) {
        var c = continuar[i];
        var pct = c.duracaoSegundos ? Math.round(100 * c.posicaoSegundos / c.duracaoSegundos) : 0;
        var nota = pct ? (pct + '%') : formatarTempo(c.posicaoSegundos);
        html += '<a class="item" href="#" data-id="' + c.id + '">' +
                esc(c.titulo) + ' <span class="ano">(' + nota + ')</span></a>';
      }
      html += '</div>';
    }

    if (totalFilmes) {
      html += '<h2>Filmes (' + totalFilmes + ')</h2>';
      if (filmesSoltos.length) {
        html += '<div class="movies">';
        for (i = 0; i < filmesSoltos.length; i++) html += itemHtml(filmesSoltos[i]);
        html += '</div>';
      }
      for (i = 0; i < pfOrdem.length; i++) {
        var parr = pfMap[pfOrdem[i]], peps = '';
        for (j = 0; j < parr.length; j++) peps += itemHtml(parr[j]);
        html += grpHtml('f:' + pfOrdem[i], esc(pfOrdem[i]) + ' (' + parr.length + ' arquivos)', peps);
      }
    }

    for (i = 0; i < serieOrdem.length; i++) {
      var sarr = serieMap[serieOrdem[i]], seps = '';
      if (i === 0) html += '<h2>Series (' + serieOrdem.length + ')</h2>';
      for (j = 0; j < sarr.length; j++) seps += itemHtml(sarr[j], sarr[j].rotulo);
      html += grpHtml('s:' + serieOrdem[i],
        esc(serieOrdem[i]) + ' (' + sarr.length + (sarr.length === 1 ? ' episodio)' : ' episodios)'), seps);
    }
    grid.innerHTML = html;
    buildNav();
  }

  // cabecalho dobravel (.grp) + itens (.eps) — respeita gruposAbertos
  function grpHtml(chave, label, itensHtml) {
    var aberto = !!gruposAbertos[chave];
    return '<a class="grp" href="#" data-g="' + esc(chave) + '" data-label="' + label + '">' +
           (aberto ? '▾ ' : '▸ ') + label + '</a>' +
           '<div class="eps" data-g="' + esc(chave) + '" style="display:' + (aberto ? 'block' : 'none') + '">' +
           itensHtml + '</div>';
  }

  function buildNav() {
    // ordem de navegacao: barra de filtros + cabecalhos de serie + itens visiveis
    var bar = document.getElementById('bar').getElementsByTagName('a');
    var grid = document.getElementById('grid');
    links = [];
    var i, j;
    for (i = 0; i < bar.length; i++) links.push(bar[i]);
    var nodes = grid.childNodes;
    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType !== 1) continue;
      var c = n.className || '';
      if (c.indexOf('grp') !== -1) {
        links.push(n);
      } else if (c.indexOf('eps') !== -1) {
        if (n.style.display !== 'none') {
          var eps = n.getElementsByClassName('item');
          for (j = 0; j < eps.length; j++) links.push(eps[j]);
        }
      } else if (c.indexOf('movies') !== -1) {
        var mv = n.getElementsByClassName('item');
        for (j = 0; j < mv.length; j++) links.push(mv[j]);
      }
    }
    if (idx >= links.length) idx = links.length - 1;
    if (idx < 0) idx = 0;
    focar(idx);
  }

  function toggleGrp(el) {
    var g = el.getAttribute('data-g');
    var boxes = document.getElementById('grid').getElementsByClassName('eps');
    for (var i = 0; i < boxes.length; i++) {
      if (boxes[i].getAttribute('data-g') === g) {
        var aberto = boxes[i].style.display !== 'none';
        boxes[i].style.display = aberto ? 'none' : 'block';
        if (aberto) delete gruposAbertos[g]; else gruposAbertos[g] = 1;
        el.innerHTML = (aberto ? '▸ ' : '▾ ') + el.getAttribute('data-label');
      }
    }
    buildNav();
    // mantem o foco no proprio cabecalho — assim o proximo "baixo" entra no 1o episodio
    var n = links.indexOf(el);
    if (n >= 0) focar(n);
  }

  function focar(n) {
    var i;
    for (i = 0; i < links.length; i++) links[i].className = links[i].className.replace(/ ?sel/, '');
    idx = Math.max(0, Math.min(n, links.length - 1));
    var el = links[idx];
    if (!el) return;
    el.className += ' sel';
    try { el.focus(); } catch (e) {}
    if (el.scrollIntoView) el.scrollIntoView();
  }

  function ativar(el) {
    if (!el) return;
    if (el.className && el.className.indexOf('grp') !== -1) { toggleGrp(el); return; }
    var fg = el.getAttribute('data-fg');
    if (fg) {
      var fv = el.getAttribute('data-fv');
      if (fg === 'tipo') filtroTipo = fv; else filtroVisto = fv;
      var bar = document.getElementById('bar').getElementsByTagName('a');
      for (var i = 0; i < bar.length; i++) {
        if (bar[i].getAttribute('data-fg') !== fg) continue;
        bar[i].className = bar[i].className.replace(/ ?on/, '');
        if (bar[i].getAttribute('data-fv') === fv) bar[i].className += ' on';
      }
      render();
      return;
    }
    if (el.id === 'reload') { load(); return; }
    var id = el.getAttribute('data-id');
    if (id) tocar(id);
  }

  // ---- player ----
  function pararPoll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function destruirHls() {
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  }

  function pararWatchdog() {
    if (hlsWatchdog) { clearTimeout(hlsWatchdog); hlsWatchdog = null; }
  }

  // Se o hls.js anexa mas nunca entrega dado nenhum pro <video> (MediaSource com bug
  // silencioso, comum em WebKit velho de TV — nao dispara ERROR nenhum), cai pro
  // caminho antigo (arquivo direto/original) depois de um tempo em vez de ficar
  // preso pra sempre numa tela preta.
  function armarWatchdog(id) {
    pararWatchdog();
    hlsWatchdog = setTimeout(function () {
      var v = document.getElementById('video');
      if (filmeAtual !== id || v.readyState >= 2) return;  // ja tem dado -> hls ta ok
      logDiag('watchdog: hls sem dado em 15s (readyState=' + v.readyState + '), filme ' + id + ' — caindo pro arquivo direto');
      destruirHls();
      document.getElementById('pmsg').innerHTML = 'HLS não respondeu, tentando arquivo direto...';
      tocarSemHls(id);
    }, 15000);
  }

  function iniciarHls(id, url, tAlvo) {
    var v = document.getElementById('video');
    destruirHls();
    armarWatchdog(id);
    hls = new window.Hls(tAlvo ? { startPosition: tAlvo } : {});
    hls.on(window.Hls.Events.MANIFEST_PARSED, function () { try { v.play(); } catch (e) {} });
    hls.on(window.Hls.Events.ERROR, function (_e, d) {
      if (!d) return;
      logDiag('hls.js error: type=' + d.type + ' details=' + d.details + ' fatal=' + d.fatal +
              (d.response ? (' status=' + d.response.code) : ''));
      if (!d.fatal || filmeAtual !== id) return;
      pararWatchdog();
      if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); armarWatchdog(id); return; }
      destruirHls();
      // erro fatal de rede: segmento sumiu (transcode reiniciou) — recarrega o filme.
      // Limite de tentativas: senao um erro persistente (TV incompativel, etc.)
      // fica tentando pra sempre sem avisar nada na tela.
      if (d.type === window.Hls.ErrorTypes.NETWORK_ERROR && hlsRetries++ < 3) {
        setTimeout(function () { if (filmeAtual === id) tocar(id, true); }, 1500);
      } else {
        document.getElementById('pmsg').innerHTML = 'Falha ao carregar o video (erro ' + d.type + ').';
      }
    });
    v.onerror = function () {
      var err = v.error;
      logDiag('<video> error: code=' + (err && err.code) + ' filme ' + id);
    };
    hls.attachMedia(v);
    hls.loadSource(url);
  }

  function tocarUrl(id, url, comAviso) {
    var v = document.getElementById('video');
    var pmsg = document.getElementById('pmsg');
    var seg = posicaoRetomar > 5 ? Math.floor(posicaoRetomar) : 0;
    v.src = url + (seg ? '#t=' + seg : '');
    if (comAviso) {
      pmsg.innerHTML = 'Arquivo original (pode nao rodar em TV muito antiga).';
      setTimeout(function () {
        if (pmsg.innerHTML.indexOf('original') !== -1) pmsg.innerHTML = '';
      }, 8000);
    }
    v.onerror = function () {
      var err = v.error;
      logDiag('<video> error (direto): code=' + (err && err.code) + ' filme ' + id + ' url=' + url);
    };
    try { v.load(); v.play(); } catch (e) {}
    carregarLegendas(id);
    // "assistido" fica por conta do backend (perto do fim) ou do evento 'ended'.
  }

  // Poll generico "preparando -> disponivel/erro": usado tanto pelo /stream-status do
  // HLS quanto pelo /remux-status (a diferenca entre os dois eh so a mensagem e o que
  // fazer quando fica pronto). Continua rechamando a si mesmo enquanto "preparando".
  function pollStatus(id, url, intervaloMs, msgPreparando, msgErro, aoPronto) {
    get(url, function (err, d) {
      if (filmeAtual !== id) return;  // trocou de filme enquanto esperava
      var pmsg = document.getElementById('pmsg');
      var status = (!err && d) ? d.status : null;

      if (status === 'erro') { pmsg.innerHTML = msgErro; return; }
      if (status === null || status === 'preparando') {
        pmsg.innerHTML = typeof msgPreparando === 'function' ? msgPreparando(d) : msgPreparando;
        pollTimer = setTimeout(function () {
          pollStatus(id, url, intervaloMs, msgPreparando, msgErro, aoPronto);
        }, intervaloMs);
        return;
      }
      pmsg.innerHTML = '';
      aoPronto(status);
    });
  }

  // /remux-status ate o .mp4 (video copiado, audio -> AAC) ficar pronto em cache — so
  // entao toca, como um arquivo normal (Content-Length + Range, ao contrario de um pipe
  // ao vivo que algumas TVs recusam na hora por nao saber o tamanho).
  function pollRemuxEtocar(id) {
    pollStatus(id, API + '/' + id + '/remux-status', 2000,
      function (d) { return 'Preparando audio' + (d && d.progresso != null ? ' (' + d.progresso + '%)' : '...'); },
      'Falha ao preparar o audio.',
      function () { tocarUrl(id, API + '/' + id + '/remux', false); });
  }

  // TV sem MediaSource nem HLS nativo (ou hls.js que travou sem erro): pergunta se da
  // pra tocar direto (sem disparar transcode); se so o audio for o problema (EAC3/DTS
  // de rip WEB-DL — o video ja e compativel), espera o /remux ficar pronto em cache
  // (video copiado, so o audio vira AAC); senao, ultimo recurso, arquivo original cru.
  function tocarSemHls(id) {
    var pmsg = document.getElementById('pmsg');
    get(API + '/' + id + '/pode-direto', function (e2, pd) {
      if (filmeAtual !== id) return;
      if (!e2 && pd && pd.compativel) {
        pmsg.innerHTML = '';
        tocarUrl(id, API + '/' + id + '/stream', false);
      } else if (!e2 && pd && pd.remuxavel) {
        logDiag('remux (audio) filme ' + id);
        pollRemuxEtocar(id);
      } else {
        tocarUrl(id, API + '/' + id + '/original', true);
      }
    });
  }

  // Poll de /stream-status ate sair de "preparando", igual ao index.html. So entra
  // aqui quando a TV tem algum jeito de tocar HLS (MSE+hls.js OU HLS nativo do
  // <video>) — TV sem nenhum dos dois nem chega, vai direto pro tocarSemHls.
  function pollStatusEtocar(id) {
    pollStatus(id, API + '/' + id + '/stream-status', 1500, 'Preparando video...', 'Falha ao preparar o video.',
      function (status) {
        var v = document.getElementById('video');
        var t = posicaoRetomar > 5 ? Math.floor(posicaoRetomar) : 0;
        var url = API + '/' + id + '/hls/playlist.m3u8';
        if (status === 'compativel') {
          v.src = API + '/' + id + '/stream' + (t ? ('#t=' + t) : '');
          try { v.load(); v.play(); } catch (e) {}
        } else if (window.Hls && window.Hls.isSupported && window.Hls.isSupported()) {
          iniciarHls(id, url, t);
        } else {
          // Sem MediaSource, mas o <video> entende .m3u8 direto (HLS nativo — comum em
          // smart TV mesmo sem hls.js). Mesmo watchdog: se travar sem erro, cai pro raw.
          logDiag('native HLS (canPlayType) filme ' + id);
          armarWatchdog(id);
          v.onerror = function () {
            var err = v.error;
            logDiag('<video> error (HLS nativo): code=' + (err && err.code) + ' filme ' + id);
            pararWatchdog();
            tocarSemHls(id);
          };
          v.src = url + (t ? ('#t=' + t) : '');
          try { v.load(); v.play(); } catch (e) {}
        }
        carregarLegendas(id);
      });
  }

  function removerLegendas() {
    var v = document.getElementById('video');
    var tr = v.getElementsByTagName('track');
    while (tr.length) v.removeChild(tr[0]);
  }

  // Legenda embutida (as de texto) como <track>. Em TV muito velha pode nao renderizar
  // — mas nao atrapalha. Botao VERMELHO liga/desliga durante o filme.
  function carregarLegendas(id) {
    get(API + '/' + id + '/legendas', function (err, faixas) {
      if (err || !faixas || filmeAtual !== id) return;
      var v = document.getElementById('video');
      removerLegendas();
      for (var i = 0; i < faixas.length; i++) {
        if (!faixas[i].convertivel) continue;
        var t = document.createElement('track');
        t.kind = 'subtitles';
        t.setAttribute('src', API + '/' + id + '/legenda/' + faixas[i].idx);
        t.setAttribute('srclang', faixas[i].idioma || 'und');
        t.setAttribute('label', faixas[i].titulo || faixas[i].idioma || ('Legenda ' + (faixas[i].idx + 1)));
        v.appendChild(t);
      }
    });
  }

  function cancelarProximo() {
    if (proximoTimer) { clearInterval(proximoTimer); proximoTimer = null; }
    proximoPendente = null;
  }

  function ofereceProximo(id) {
    get(API + '/' + id + '/proximo', function (err, prox) {
      if (err || !prox || filmeAtual !== id) return;
      proximoPendente = prox;
      var pmsg = document.getElementById('pmsg');
      var resta = 12;
      function tick() {
        pmsg.innerHTML = 'Proximo: ' + esc(prox.rotulo) + ' &mdash; OK assiste, Voltar cancela  (' + resta + 's)';
        if (resta-- <= 0) irProximo();
      }
      tick();
      proximoTimer = setInterval(tick, 1000);
    });
  }

  function irProximo() {
    var p = proximoPendente;
    cancelarProximo();
    if (p) tocar(p.id);
  }

  function tocar(id, ehRetry) {
    cancelarProximo();
    pararPoll();
    pararWatchdog();
    destruirHls();
    removerLegendas();
    if (!ehRetry) hlsRetries = 0;  // retry preserva o contador, senao o teto de 3 nunca conta
    // Avisa o controle.html o que esta tocando agora, nao importa se foi selecionado
    // aqui no D-pad ou remotamente — fonte unica de verdade no servidor. Fire-and-forget,
    // nao atrasa nem interfere na reproducao local.
    if (!ehRetry) send('POST', PLAYER + '/selecionar/' + id);
    document.getElementById('list').className = 'hide';
    document.getElementById('player').className = 'on';
    document.body.className = 'playing';
    var v = document.getElementById('video');
    var pmsg = document.getElementById('pmsg');
    pmsg.innerHTML = 'Preparando...';
    v.removeAttribute('src');

    // dica dos controles so nos primeiros segundos, pra nao ficar sobre o video
    var phint = document.getElementById('phint');
    phint.style.display = 'block';
    setTimeout(function () { phint.style.display = 'none'; }, 7000);

    filmeAtual = id;
    ultimoSalvo = 0;
    posicaoRetomar = 0;
    retomarTentativas = 0;
    reproducaoConcluida = false;

    var temMseHls = !!(window.Hls && window.Hls.isSupported && window.Hls.isSupported());
    var temNativeHls = !!(v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl'));
    var temHls = temMseHls || temNativeHls;
    if (!ehRetry) logDiag('tocar filme ' + id + ': mse=' + temMseHls + ' native=' + temNativeHls);

    // pega o ponto de retomada ANTES de setar o src (senao o loadedmetadata perde a corrida)
    get(API + '/' + id + '/progresso', function (err, d) {
      if (!err && d && d.posicaoSegundos) posicaoRetomar = d.posicaoSegundos;
      if (temHls) pollStatusEtocar(id); else tocarSemHls(id);
    });
  }

  // aplicar so no 'loadedmetadata' nao cola (o navegador volta pra 0 depois).
  // 'loadeddata'/'canplay'/'seeked' pegam, e re-tenta se o seek for revertido.
  function aplicarRetomada() {
    var v = document.getElementById('video');
    if (!(posicaoRetomar > 5)) return;
    var dur = v.duration;
    if (isFinite(dur) && posicaoRetomar >= dur - 5) { posicaoRetomar = 0; return; }
    if (Math.abs(v.currentTime - posicaoRetomar) <= 1.5) { posicaoRetomar = 0; return; }
    if (retomarTentativas++ > 4) { posicaoRetomar = 0; return; }
    try { v.currentTime = posicaoRetomar; } catch (e) {}
  }

  function configurarProgresso() {
    var v = document.getElementById('video');
    v.onloadeddata = aplicarRetomada;
    v.oncanplay = aplicarRetomada;
    v.onseeked = aplicarRetomada;
    v.ontimeupdate = function () {
      if (filmeAtual == null || v.paused) return;
      var t = (new Date()).getTime();
      if (t - ultimoSalvo < 10000) return;
      ultimoSalvo = t;
      salvarProgresso();
    };
    v.onpause = function () { salvarProgresso(); };
    v.onended = function () {
      if (filmeAtual == null) return;
      reproducaoConcluida = true;
      var idFim = filmeAtual;
      send('POST', API + '/' + idFim + '/concluir');
      ofereceProximo(idFim);
    };

    // Keepalive: avisa o backend que ainda tem alguem aqui, senao o transcode em
    // andamento e abortado por inatividade (HlsOrphanTimeoutSeconds) — o hls.js so
    // bate no servidor quando busca segmento novo, o que nao conta como "pedido
    // de status" o tempo todo (buffer cheio, pausado, etc).
    setInterval(function () {
      if (filmeAtual != null) send('POST', API + '/' + filmeAtual + '/assistindo');
    }, 20000);

    // Reporta posicao pro controle.html desenhar a barra de progresso (nao precisa
    // ser preciso — so o suficiente pra nao ficar visualmente parado).
    setInterval(function () {
      if (filmeAtual == null) return;
      var x = new XMLHttpRequest();
      x.open('POST', PLAYER + '/posicao', true);
      x.setRequestHeader('Content-Type', 'application/json');
      x.send(JSON.stringify({
        pos: v.currentTime,
        dur: isFinite(v.duration) && v.duration > 0 ? v.duration : 0
      }));
    }, 2000);
  }

  // ---- controle remoto (celular, controle.html) ----
  // Poll independente do pollTimer de status do video: precisa continuar rodando mesmo
  // com a lista na tela (senao nunca pegaria um "selecionar" vindo do celular). So chama
  // as MESMAS funcoes que o D-pad local ja usa (tocar/fecharPlayer/video.play etc.) —
  // a logica de reproducao (HLS/nativo/remux/watchdog/keepalive) nao muda em nada.
  function pollRemoto() {
    get(PLAYER + '/state', function (err, estado) {
      if (!err && estado) aplicarEstadoRemoto(estado);
      setTimeout(pollRemoto, 1500);
    });
  }

  function aplicarEstadoRemoto(estado) {
    var anterior = estadoRemotoAnterior;
    estadoRemotoAnterior = estado;
    if (!anterior) return;  // 1o poll: so guarda a base, nao reage a versao "zerada" do boot

    if (estado.pararVersion !== anterior.pararVersion && filmeAtual !== null) {
      fecharPlayer();
      return;
    }
    if (estado.filmeId !== null && estado.filmeId !== filmeAtual) {
      tocar(estado.filmeId);
      return;
    }
    if (filmeAtual === null) return;

    var v = document.getElementById('video');
    if (estado.playing && v.paused) { try { v.play(); } catch (e) {} }
    if (!estado.playing && !v.paused) { try { v.pause(); } catch (e) {} }
    if (estado.volume !== anterior.volume) v.volume = estado.volume;
    if (estado.seekVersion !== anterior.seekVersion) {
      try { v.currentTime = Math.max(0, v.currentTime + estado.seekDelta); } catch (e) {}
    }
    if (estado.seekAbsVersion !== anterior.seekAbsVersion) {
      try { v.currentTime = Math.max(0, estado.seekAbsPos); } catch (e) {}
    }
    if (estado.legendaVersion !== anterior.legendaVersion) aplicarLegendaRemota(estado.legendaIdx);
  }

  // Casa o idx (indice da faixa no arquivo original) com o <track> certo — carregarLegendas
  // criou eles na mesma ordem de /legendas, com a url terminando em /legenda/{idx}.
  function aplicarLegendaRemota(idx) {
    var v = document.getElementById('video');
    var tt = v.textTracks;
    var tracks = v.getElementsByTagName('track');
    for (var i = 0; i < tt.length; i++) {
      var src = tracks[i] ? tracks[i].getAttribute('src') : '';
      var m = src && src.match(/\/legenda\/(\d+)$/);
      tt[i].mode = (m && Number(m[1]) === idx) ? 'showing' : 'disabled';
    }
  }

  // cb (opcional) roda quando o PUT termina — usado pelo fecharPlayer pra so
  // recarregar a lista depois que o progresso ja foi gravado.
  function salvarProgresso(cb) {
    var v = document.getElementById('video');
    if (filmeAtual == null || reproducaoConcluida || !(v.currentTime > 15)) { if (typeof cb === 'function') cb(); return; }
    var x = new XMLHttpRequest();
    x.open('PUT', API + '/' + filmeAtual + '/progresso', true);
    x.setRequestHeader('Content-Type', 'application/json');
    if (typeof cb === 'function') {
      x.onreadystatechange = function () { if (x.readyState === 4) cb(); };
    }
    x.send(JSON.stringify({
      posicao: v.currentTime,
      duracao: (isFinite(v.duration) && v.duration > 0) ? v.duration : null
    }));
  }

  function fecharPlayer() {
    cancelarProximo();
    pararPoll();
    pararWatchdog();
    destruirHls();
    removerLegendas();
    send('POST', PLAYER + '/parar');  // avisa o controle.html, mesma ideia do selecionar acima
    // grava o progresso e so entao recarrega a lista, senao o "continuar
    // assistindo" volta antes do PUT e fica desatualizado.
    salvarProgresso(function () { load(); });
    var v = document.getElementById('video');
    try { v.pause(); } catch (e) {}
    v.removeAttribute('src');
    try { v.load(); } catch (e) {}
    filmeAtual = null;
    document.getElementById('player').className = '';
    document.getElementById('list').className = '';
    document.body.className = '';
  }

  // ---- teclado / controle remoto ----
  document.onkeydown = function (e) {
    e = e || window.event;
    var k = e.keyCode;
    var playerAtivo = document.getElementById('player').className === 'on';

    // Voltar (varia por fabricante: 8, 27, 461, 10009, 166)
    if (k === 8 || k === 27 || k === 461 || k === 10009 || k === 166) {
      if (playerAtivo) { fecharPlayer(); if (e.preventDefault) e.preventDefault(); return false; }
      return true;
    }

    if (playerAtivo) {
      // Nesta TV a navegacao e por seta — durante o filme: <- -> pulam 15s, OK pausa.
      // Cima/baixo (volume) ficam com o controle nativo do <video>.
      var v = document.getElementById('video');

      // Oferta de proximo episodio na tela: OK assiste agora, resto ignora
      // (Voltar ja foi tratado acima -> fecharPlayer -> cancelarProximo).
      if (proximoPendente) {
        if (k === 13 || k === 32) { if (e.preventDefault) e.preventDefault(); irProximo(); return false; }
        return true;
      }

      // botao VERMELHO (403 na maioria dos controles): liga/desliga legenda
      if (k === 403) {
        var tt = v.textTracks, algum = false, xi;
        if (tt) {
          for (xi = 0; xi < tt.length; xi++) if (tt[xi].mode === 'showing') algum = true;
          for (xi = 0; xi < tt.length; xi++) tt[xi].mode = 'disabled';
          if (!algum && tt.length) tt[0].mode = 'showing';
          var pm = document.getElementById('pmsg');
          pm.innerHTML = 'Legenda: ' + (algum ? 'off' : (tt.length ? (tt[0].label || 'on') : 'nenhuma'));
          setTimeout(function () { var p = document.getElementById('pmsg'); if (p.innerHTML.indexOf('Legenda:') === 0) p.innerHTML = ''; }, 3000);
        }
        if (e.preventDefault) e.preventDefault();
        return false;
      }

      if (k === 37) {
        v.currentTime = Math.max(0, v.currentTime - 15);
        if (e.preventDefault) e.preventDefault(); return false;
      }
      if (k === 39) {
        var d = v.duration;
        v.currentTime = isFinite(d) ? Math.min(d - 1, v.currentTime + 15) : v.currentTime + 15;
        if (e.preventDefault) e.preventDefault(); return false;
      }
      if (k === 13 || k === 32) {
        // decide o alvo agora e aplica depois de um tiquinho, corrigindo caso o
        // controle nativo do <video> tambem responda ao OK e fique de briga.
        var querPausar = !v.paused;
        if (e.preventDefault) e.preventDefault();
        setTimeout(function () {
          if (querPausar && !v.paused) v.pause();
          if (!querPausar && v.paused) { try { v.play(); } catch (er) {} }
        }, 80);
        return false;
      }
      return true;
    }

    if (k === 38 || k === 37) { focar(idx - 1); if (e.preventDefault) e.preventDefault(); return false; } // cima / esquerda
    if (k === 40 || k === 39) { focar(idx + 1); if (e.preventDefault) e.preventDefault(); return false; } // baixo / direita
    if (k === 13 || k === 32) { ativar(links[idx]); if (e.preventDefault) e.preventDefault(); return false; } // OK
    return true;
  };

  // clique tambem funciona (mouse/touch de alguns controles)
  document.getElementById('grid').onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    while (t && t !== this && (!t.className ||
           (t.className.indexOf('item') === -1 && t.className.indexOf('grp') === -1))) t = t.parentNode;
    if (t && t !== this) { ativar(t); return false; }
  };
  document.getElementById('bar').onclick = function (e) {
    e = e || window.event;
    var t = e.target || e.srcElement;
    if (t && t.tagName === 'A') { ativar(t); return false; }
  };

  configurarProgresso();
  load();
  pollRemoto();
})();
</script>
</body>
</html>
