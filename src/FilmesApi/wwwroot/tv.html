<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmes - TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain}
.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font:20px system-ui,sans-serif;text-align:center;padding:24px}
</style>
</head>
<body>
<video id="video" autoplay></video>
<div class="msg" id="msg">Aguardando seleção pelo controle remoto (celular)…</div>

<script src="/vendor/hls.min.js"></script>
<script>
const API = '';
let estadoAnterior = { filmeId: null, playing: false, volume: 1, seekVersion: 0, pararVersion: 0 };
const video = document.getElementById('video');
const msg = document.getElementById('msg');

function mostrarMsg(texto) {
  msg.textContent = texto;
  msg.style.display = 'flex';
  video.style.display = 'none';
}

function mostrarVideo() {
  msg.style.display = 'none';
  video.style.display = 'block';
}

async function checarStatus(filmeId) {
  const res = await fetch(`/api/filmes/${filmeId}/stream-status`);
  const data = await res.json();
  return data.status;
}

let hls = null;

function destruirHls() {
  if (hls) { hls.destroy(); hls = null; }
}

async function carregarFilme(filmeId) {
  mostrarMsg('Preparando vídeo…');
  destruirHls();
  let status = await checarStatus(filmeId);
  while (status === 'preparando') {
    mostrarMsg('Preparando vídeo…');
    await new Promise(r => setTimeout(r, 1500));
    status = await checarStatus(filmeId);
  }
  if (status === 'erro') {
    mostrarMsg('Falha ao converter o vídeo.');
    return;
  }

  video.volume = estadoAnterior.volume;

  if (status === 'compativel') {
    video.src = `/api/filmes/${filmeId}/stream`;
    mostrarVideo();
    video.play();
    return;
  }

  const playlistUrl = `/api/filmes/${filmeId}/hls/playlist.m3u8`;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(playlistUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { mostrarVideo(); video.play(); });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = playlistUrl;
    mostrarVideo();
    video.play();
  } else {
    mostrarMsg('Este navegador não suporta HLS.');
  }
}

async function poll() {
  try {
    const res = await fetch('/api/player/state');
    const estado = await res.json();

    if (estado.pararVersion !== estadoAnterior.pararVersion && estado.filmeId === null) {
      destruirHls();
      video.pause();
      video.removeAttribute('src');
      mostrarMsg('Aguardando seleção pelo controle remoto (celular)…');
    } else if (estado.filmeId !== null && estado.filmeId !== estadoAnterior.filmeId) {
      await carregarFilme(estado.filmeId);
    } else if (estado.filmeId !== null) {
      if (estado.playing && video.paused) video.play();
      if (!estado.playing && !video.paused) video.pause();
    }

    if (estado.volume !== estadoAnterior.volume) video.volume = estado.volume;

    if (estado.seekVersion !== estadoAnterior.seekVersion) {
      video.currentTime = Math.max(0, video.currentTime + estado.seekDelta);
    }

    estadoAnterior = estado;
  } catch { /* rede instável, tenta de novo no próximo ciclo */ }
  finally {
    setTimeout(poll, 1000);
  }
}

poll();
</script>
</body>
</html>
