<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filmes - TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
video{width:100%;height:100%;object-fit:contain}
.msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ccc;font:20px system-ui,sans-serif;text-align:center;padding:24px;white-space:pre-line}
</style>
</head>
<body>
<video id="video" autoplay></video>
<div class="msg" id="msg">Aguardando seleção pelo controle remoto (celular)…</div>

<script src="/vendor/hls.min.js"></script>
<script>
const API = '';
let estadoAnterior = { filmeId: null, playing: false, volume: 1, seekVersion: 0, pararVersion: 0, seekAbsVersion: 0, legendaVersion: 0, legendaIdx: -1 };
const video = document.getElementById('video');
const msg = document.getElementById('msg');

// Reporta a posição pro celular desenhar a barra de progresso do controle remoto,
// e serve de keepalive (senão o transcode em andamento é abortado por inatividade).
setInterval(() => {
  if (filmeAtual == null || !isFinite(video.currentTime)) return;
  fetch('/api/player/posicao', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pos: video.currentTime, dur: isFinite(video.duration) ? video.duration : 0 })
  }).catch(() => {});
  fetch(`/api/filmes/${filmeAtual}/assistindo`, { method: 'POST' }).catch(() => {});
}, 2000);

// continuar de onde parou
let filmeAtual = null, ultimoSalvo = 0, posicaoRetomar = 0, retomarTentativas = 0, hlsRetries = 0;
// video.duration só é confiável no stream direto; no HLS cresce durante o transcode.
let duracaoConfiavel = false;
// depois do 'ended' o /concluir já limpou a retomada — impede um save tardio de recriá-la.
let reproducaoConcluida = false;

// aplicar só no 'loadedmetadata' não cola (o navegador volta pra 0 depois);
// 'loadeddata'/'canplay'/'seeked' pegam, e re-tenta se o seek for revertido.
function aplicarRetomada() {
  if (!(posicaoRetomar > 5)) return;
  const dur = video.duration;
  if (duracaoConfiavel && isFinite(dur) && posicaoRetomar >= dur - 5) { posicaoRetomar = 0; return; }
  if (Math.abs(video.currentTime - posicaoRetomar) <= 1.5) { posicaoRetomar = 0; return; }
  if (retomarTentativas++ > 4) { posicaoRetomar = 0; return; }
  try { video.currentTime = posicaoRetomar; } catch { /* ainda não seekável */ }
}
video.addEventListener('loadeddata', aplicarRetomada);
video.addEventListener('canplay', aplicarRetomada);
video.addEventListener('seeked', aplicarRetomada);
video.addEventListener('timeupdate', () => {
  if (filmeAtual == null || video.paused) return;
  const t = Date.now();
  if (t - ultimoSalvo < 10000) return;
  ultimoSalvo = t;
  salvarProgresso();
});
video.addEventListener('pause', () => salvarProgresso());
video.addEventListener('ended', () => {
  if (filmeAtual == null) return;
  reproducaoConcluida = true;
  const id = filmeAtual;
  fetch(`/api/filmes/${id}/concluir`, { method: 'POST', keepalive: true }).catch(() => {});
  ofereceProximo(id);
});

// ─── Próximo episódio ────────────────────────────────────────────────
let proximoTimer = null, aguardandoProximo = false;
function cancelarProximo() {
  if (proximoTimer) { clearTimeout(proximoTimer); proximoTimer = null; }
  aguardandoProximo = false;
}
async function ofereceProximo(id) {
  let prox;
  try {
    const r = await fetch(`/api/filmes/${id}/proximo`);
    if (r.status !== 200) return;
    prox = await r.json();
  } catch { return; }
  if (filmeAtual !== id || !prox) return;

  cancelarProximo();
  aguardandoProximo = true;  // o poll não deve dar play() no episódio que já acabou
  try { video.pause(); } catch {}
  let resta = 8;
  const tick = () => {
    mostrarMsg(`Próximo: ${prox.titulo}\nem ${resta}s`);
    if (resta-- <= 0) {
      cancelarProximo();
      fetch(`/api/player/selecionar/${prox.id}`, { method: 'POST' }).catch(() => {});
    } else {
      proximoTimer = setTimeout(tick, 1000);
    }
  };
  tick();
}

// ─── Legendas (faixa escolhida pelo celular via player state) ─────────
function removerLegendas() {
  video.querySelectorAll('track').forEach(t => t.remove());
}
async function carregarLegendas(filmeId) {
  let faixas;
  try { faixas = await fetch(`/api/filmes/${filmeId}/legendas`).then(r => r.ok ? r.json() : []); }
  catch { return; }
  if (filmeAtual !== filmeId) return;
  removerLegendas();
  faixas.filter(x => x.convertivel).forEach(x => {
    const tr = document.createElement('track');
    tr.kind = 'subtitles';
    tr.src = `/api/filmes/${filmeId}/legenda/${x.idx}`;
    tr.srclang = x.idioma || 'und';
    tr.label = x.titulo || x.idioma || `Legenda ${x.idx + 1}`;
    video.appendChild(tr);
  });
  // Filme novo sempre começa sem legenda (o servidor zera _legendaIdx=-1 em Selecionar);
  // se o celular pedir CC depois, o canal legendaVersion aplica no poll.
  aplicarLegenda(-1);
}
function aplicarLegenda(idx) {
  const tt = video.textTracks;
  for (let i = 0; i < tt.length; i++) tt[i].mode = (i === idx) ? 'showing' : 'disabled';
}

function salvarProgresso() {
  if (filmeAtual == null || reproducaoConcluida || !(video.currentTime > 15)) return;
  fetch(`/api/filmes/${filmeAtual}/progresso`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      posicao: video.currentTime,
      duracao: duracaoConfiavel && isFinite(video.duration) && video.duration > 0 ? video.duration : null
    }),
    keepalive: true
  }).catch(() => {});
}

function mostrarMsg(texto) {
  msg.textContent = texto;
  msg.style.display = 'flex';
  video.style.display = 'none';
}

function mostrarVideo() {
  msg.style.display = 'none';
  video.style.display = 'block';
}

// nunca lança: erro transitório vira 'preparando'; muitas falhas seguidas -> 'erro'.
let checarFalhas = 0;
async function checarStatus(filmeId) {
  try {
    const res = await fetch(`/api/filmes/${filmeId}/stream-status`);
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    checarFalhas = 0;
    return data.status;
  } catch {
    return (++checarFalhas > 12) ? 'erro' : 'preparando';
  }
}

let hls = null;

function destruirHls() {
  if (hls) { hls.destroy(); hls = null; }
}

async function carregarFilme(filmeId, ehRetry) {
  mostrarMsg('Preparando vídeo…');
  destruirHls();
  cancelarProximo();
  removerLegendas();

  filmeAtual = filmeId;
  ultimoSalvo = 0;
  posicaoRetomar = 0;
  retomarTentativas = 0;
  checarFalhas = 0;
  if (!ehRetry) hlsRetries = 0;  // retry preserva o contador
  duracaoConfiavel = false;
  reproducaoConcluida = false;
  const prog = await fetch(`/api/filmes/${filmeId}/progresso`).then(r => r.ok ? r.json() : null).catch(() => null);
  if (prog && prog.posicaoSegundos) posicaoRetomar = prog.posicaoSegundos;

  const inicioPrep = Date.now();
  const prepTimer = setInterval(() => {
    const s = Math.round((Date.now() - inicioPrep) / 1000);
    mostrarMsg(`Preparando vídeo… ${s}s` + (s > 45 ? '\n(a primeira vez demora mais)' : ''));
  }, 1000);
  let status;
  try {
    status = await checarStatus(filmeId);
    while (status === 'preparando') {
      await new Promise(r => setTimeout(r, 1500));
      if (filmeAtual !== filmeId) return;  // celular trocou/parou durante a espera
      status = await checarStatus(filmeId);
    }
  } finally {
    clearInterval(prepTimer);
  }
  if (status === 'erro') {
    mostrarMsg('Falha ao preparar o vídeo.');
    return;
  }

  video.volume = estadoAnterior.volume;
  const t = posicaoRetomar > 5 ? Math.floor(posicaoRetomar) : 0;  // retoma sem pulo
  carregarLegendas(filmeId);

  if (status === 'compativel') {
    duracaoConfiavel = true;
    video.src = `/api/filmes/${filmeId}/stream${t ? `#t=${t}` : ''}`;
    mostrarVideo();
    video.play();
    return;
  }

  const playlistUrl = `/api/filmes/${filmeId}/hls/playlist.m3u8`;
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls(t ? { startPosition: t } : {});
    hls.loadSource(playlistUrl);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { mostrarVideo(); video.play(); });
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && filmeAtual === filmeId && hlsRetries++ < 3) {
        setTimeout(() => { if (filmeAtual === filmeId) carregarFilme(filmeId, true); }, 1500);
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = t ? `${playlistUrl}#t=${t}` : playlistUrl;
    mostrarVideo();
    video.play();
  } else {
    mostrarMsg('Este navegador não suporta HLS.');
  }
}

async function poll() {
  try {
    const res = await fetch('/api/player/state');
    const estado = await res.json();

    if (estado.pararVersion !== estadoAnterior.pararVersion && estado.filmeId === null) {
      salvarProgresso();
      cancelarProximo();
      removerLegendas();
      filmeAtual = null;
      destruirHls();
      video.pause();
      video.removeAttribute('src');
      mostrarMsg('Aguardando seleção pelo controle remoto (celular)…');
    } else if (estado.filmeId !== null && estado.filmeId !== estadoAnterior.filmeId) {
      salvarProgresso();  // guarda o filme anterior antes de trocar
      await carregarFilme(estado.filmeId);
    } else if (estado.filmeId !== null && !aguardandoProximo) {
      if (estado.playing && video.paused) video.play();
      if (!estado.playing && !video.paused) video.pause();
    }

    if (estado.volume !== estadoAnterior.volume) video.volume = estado.volume;
    if (estado.legendaVersion !== estadoAnterior.legendaVersion) aplicarLegenda(estado.legendaIdx);

    if (estado.seekVersion !== estadoAnterior.seekVersion) {
      video.currentTime = Math.max(0, video.currentTime + estado.seekDelta);
    }
    if (estado.seekAbsVersion !== estadoAnterior.seekAbsVersion) {
      try { video.currentTime = Math.max(0, estado.seekAbsPos); } catch { /* ainda não seekável */ }
    }

    estadoAnterior = estado;
  } catch { /* rede instável, tenta de novo no próximo ciclo */ }
  finally {
    setTimeout(poll, 1000);
  }
}

poll();
</script>
</body>
</html>
